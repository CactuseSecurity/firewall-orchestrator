version: 2

registries:
  private-github:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{ secrets.PRIVATE_SUBMODULE_TOKEN }}

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    assignees:
      - Laennart

  - package-ecosystem: "nuget"
    directory: "/roles/"
    target-branch: "develop"
    schedule:
      interval: "daily"
    registries:
      - private-github
    assignees:
      - SolidProgramming

  # importer and scripts requirements are installed together in CI, so shared
  # pins (graphql-core, requests, urllib3, ...) must be bumped in one PR
  - package-ecosystem: "pip"
    directories:
      - "/roles/importer/files/importer"
      - "/scripts"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      importer-and-scripts:
        group-by: dependency-name
    cooldown:
      default-days: 30
      include:
        - "ruff"
    ignore:
      # scrapli >=2026.5 is the native libscrapli rewrite (scrapli 2); the ASA importer still uses the scrapli 1 API
      - dependency-name: "scrapli"
        versions: [">=2026.5"]
      # python-dateutil >=4 requires Python >=3.11; the installer and importer still support Python 3.10
      - dependency-name: "python-dateutil"
        versions: [">=4"]
    assignees:
      - Laennart

  - package-ecosystem: "pip"
    directory: "/scripts/customizing/app_data_import"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    assignees:
      - Laennart

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    # scripts/ is covered together with the importer above
    exclude-paths:
      - "scripts/**"
    ignore:
      # ansible >=13 requires Python >=3.12, unavailable on Debian 12 (see requirements.txt)
      - dependency-name: "ansible"
        versions: [">=13"]
    assignees:
      - Laennart
