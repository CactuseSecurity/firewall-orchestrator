version: 2

registries:
  private-github:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{ secrets.PRIVATE_SUBMODULE_TOKEN }}

# Minor and patch updates are grouped into one pull request per entry. Each pull request runs the
# whole CI, so one pull request per package flooded the shared runner pool: three pip updates on
# one morning queued every other pull request for more than an hour. Major updates are the ones
# that break things, so they keep a pull request of their own.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      # init and analyze share one pinned SHA in codeql-analysis.yml, so separate PRs conflict
      codeql-action:
        patterns:
          - "github/codeql-action*"
      github-actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    assignees:
      - Laennart

  - package-ecosystem: "nuget"
    directory: "/roles/"
    target-branch: "develop"
    schedule:
      interval: "daily"
    registries:
      - private-github
    groups:
      nuget-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    assignees:
      - SolidProgramming

  # importer and scripts requirements are installed together in CI, so shared
  # pins (graphql-core, requests, urllib3, ...) must be bumped in one PR
  - package-ecosystem: "pip"
    directories:
      - "/roles/importer/files/importer"
      - "/scripts"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      # Pinned in both requirements files: one PR per package that bumps both files. A group
      # without group-by opens one PR per directory, which would split these again.
      # Keep this list in sync with the pins shared by both files.
      importer-and-scripts-shared:
        group-by: dependency-name
        patterns:
          - "graphql-core"
          - "netaddr"
          - "python-dateutil"
          - "requests"
          - "urllib3"
      pip-importer-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 30
      include:
        - "ruff"
    ignore:
      # scrapli >=2026.5 is the native libscrapli rewrite (scrapli 2); the ASA importer still uses the scrapli 1 API
      - dependency-name: "scrapli"
        versions: [">=2026.5"]
      # python-dateutil >=4 requires Python >=3.11; the installer and importer still support Python 3.10
      - dependency-name: "python-dateutil"
        versions: [">=4"]
      # pre-commit >=4.7 requires Python >=3.11; the installer and importer still support Python 3.10
      - dependency-name: "pre-commit"
        versions: [">=4.7"]
    assignees:
      - Laennart

  - package-ecosystem: "pip"
    directory: "/scripts/customizing/app_data_import"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      pip-app-data-import-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    assignees:
      - Laennart

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    # scripts/ is covered together with the importer above
    exclude-paths:
      - "scripts/**"
    ignore:
      # ansible >=13 requires Python >=3.12, unavailable on Debian 12 (see requirements.txt)
      - dependency-name: "ansible"
        versions: [">=13"]
    groups:
      pip-installer-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    assignees:
      - Laennart
