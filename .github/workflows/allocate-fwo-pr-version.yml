name: Allocate FWO PR version

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: allocate-fwo-pr-version
  cancel-in-progress: false

jobs:
  allocate:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/allocate-fwo-version'
    runs-on: ubuntu-latest
    steps:
      - name: Read and authorize pull request
        id: pull-request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!['admin', 'maintain', 'write'].includes(permission.user.permissions)) {
              core.setFailed('Only repository maintainers may allocate FWO versions.');
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pullRequest.base.ref !== 'develop') {
              core.setFailed('Version allocation is only supported for pull requests targeting develop.');
              return;
            }
            if (!pullRequest.labels.some((label) => label.name === 'versioned-change')) {
              core.setFailed('Add the versioned-change label before allocating a FWO version.');
              return;
            }
            if (pullRequest.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Version allocation cannot push to a fork. A maintainer must create a same-repository branch.');
              return;
            }

            core.setOutput('head_ref', pullRequest.head.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Check out trusted allocation helper
        if: success()
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: develop
          path: fwo-version-tooling
          fetch-depth: 1

      - name: Check out pull request head
        if: success()
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ steps.pull-request.outputs.head_sha }}
          path: pull-request
          fetch-depth: 0

      - name: Select next unreserved patch version
        id: version
        if: success()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const versionPattern = /^product_version:\s*"?([0-9]+\.[0-9]+\.[0-9]+)"?\s*$/m;
            const parseVersion = (version) => version.split('.').map(Number);
            const compareVersions = (left, right) => {
              const leftParts = parseVersion(left);
              const rightParts = parseVersion(right);
              return leftParts.findIndex((part, index) => part !== rightParts[index]) === -1
                ? 0
                : leftParts.find((part, index) => part !== rightParts[index]) < rightParts.find((part, index) => part !== rightParts[index]) ? -1 : 1;
            };
            const readVersion = async (ref) => {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'inventory/group_vars/all.yml',
                ref,
              });
              const match = Buffer.from(data.content, 'base64').toString('utf8').match(versionPattern);
              if (!match) throw new Error(`No valid product_version on ${ref}.`);
              return match[1];
            };
            const baseVersion = await readVersion('develop');
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'develop',
              per_page: 100,
            });
            const [baseMajor, baseMinor] = parseVersion(baseVersion);
            const reservedVersions = [baseVersion];
            for (const pullRequest of pullRequests) {
              if (pullRequest.number === context.issue.number ||
                  !pullRequest.labels.some((label) => label.name === 'versioned-change')) continue;
              const version = await readVersion(pullRequest.head.sha);
              if (version === '999.0.0') continue;
              const [major, minor] = parseVersion(version);
              if (major !== baseMajor || minor !== baseMinor) {
                throw new Error(`PR #${pullRequest.number} reserves ${version}, outside develop's ${baseMajor}.${baseMinor}.x release line.`);
              }
              reservedVersions.push(version);
            }
            const greatestVersion = reservedVersions.reduce((greatest, version) =>
              compareVersions(version, greatest) > 0 ? version : greatest);
            const [major, minor, patch] = parseVersion(greatestVersion);
            core.setOutput('base_version', baseVersion);
            core.setOutput('target_version', `${major}.${minor}.${patch + 1}`);

      - name: Allocate versioned files
        if: success()
        env:
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
        run: |
          cd pull-request
          ../fwo-version-tooling/scripts/allocate-fwo-version.sh --allocate --target "$TARGET_VERSION"

      - name: Commit allocation
        if: success()
        env:
          HEAD_REF: ${{ steps.pull-request.outputs.head_ref }}
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
        run: |
          set -euo pipefail
          cd pull-request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory/group_vars/all.yml documentation/revision-history.md roles/database/files/upgrade
          git commit -m "chore: allocate FWO version $TARGET_VERSION"
          git push origin "HEAD:refs/heads/$HEAD_REF"
