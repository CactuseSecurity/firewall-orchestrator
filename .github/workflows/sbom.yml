name: Publish release SBOM

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  source-sbom:
    name: Generate and publish source SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Validate stable release tag
        id: validate
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$TAG_NAME" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "Skipping SBOM publication for non-stable release tag '$TAG_NAME'."
          fi

      - name: Checkout release source
        if: steps.validate.outputs.stable == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        if: steps.validate.outputs.stable == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate source SBOMs
        if: steps.validate.outputs.stable == 'true'
        run: |
          python scripts/sbom/generate_sbom.py \
            --mode source \
            --output-dir sbom \
            --reference-platform debian-testing \
            --merge

      - name: Attach SBOMs to release
        if: steps.validate.outputs.stable == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" sbom/*.cdx.json sbom/fwo-sbom-details/*.cdx.json --clobber
