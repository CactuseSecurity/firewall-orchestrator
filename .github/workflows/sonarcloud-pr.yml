name: SonarCloud PR
# NOTE: this workflow's behavior and its accepted residual risk (GHSA-3cwm-h5cm-r3f8) are
# documented in documentation/developer-docs/github/sonarcloud-workflow.md - please keep that doc
# in sync when changing triggers or job logic here.
#
# Security: this workflow builds pull request code of trusted fork owners in the privileged
# pull_request_target context. This is only acceptable while SONAR_TOKEN is the only secret used
# here, the token is limited to Browse and Execute Analysis on this project, and no privileged
# workflow restores caches. scripts/ci/test_workflow_security_policy.py enforces the workflow side.

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: SonarQube Analyze PR
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - name: Gate trusted PR sources
        shell: bash
        run: |
          if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import sys

          trusted = json.loads(os.environ["TRUSTED_OWNERS"])
          pr_owner = os.environ["PR_OWNER"]

          if pr_owner not in trusted:
              print(
                  f"PR owner '{pr_owner}' is not listed in SONAR_TRUSTED_FORK_OWNERS. "
                  "This privileged Sonar workflow is blocked for untrusted fork PRs."
              )
              sys.exit(1)
          PY
        env:
          TRUSTED_OWNERS: ${{ vars.SONAR_TRUSTED_FORK_OWNERS || '[]' }}
          PR_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          # fork PRs are gated by the trusted-owner check above, so the
          # pull_request_target fork checkout block of checkout@v7 can be lifted
          allow-unsafe-pr-checkout: true

      # The checkout above only contains the fork's refs; origin/<base> can be
      # months stale. Sonar resolves the PR baseline from that remote-tracking
      # ref, so refresh it from the upstream repository.
      - name: Fetch base branch from upstream
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git remote add base "https://github.com/${{ github.repository }}.git"
          git fetch base "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git branch -f "$BASE_REF" "origin/$BASE_REF"

      # Keep the project version in sync with the branch analysis so the
      # "previous version" new code baseline stays consistent across both.
      - name: Resolve product version
        id: product_version
        shell: bash
        run: |
          set -o pipefail
          version="$(sed -n 's/^product_version:[[:space:]]*"\{0,1\}\([^"[:space:]]\{1,\}\)"\{0,1\}[[:space:]]*$/\1/p' inventory/group_vars/all.yml | head -n 1)"
          if [ -z "$version" ]; then
            echo "Unable to read product_version from inventory/group_vars/all.yml" >&2
            exit 1
          fi
          echo "Analyzing as project version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # No caches (GHSA-3cwm-h5cm-r3f8): this workflow builds pull request code in the
      # pull_request_target context, which can write cache entries of the base branch. Restoring
      # caches in a Sonar workflow would let such an entry run code in later runs.
      - name: Install SonarCloud scanner
        run: dotnet tool update dotnet-sonarscanner --tool-path .sonar/scanner

      - name: Install .NET coverage collector
        run: dotnet tool update dotnet-coverage --tool-path .sonar/scanner

      - name: Install Python dependencies
        run: python -m pip install -r roles/importer/files/importer/requirements.txt -r scripts/requirements.txt coverage==7.15.0

      - name: Build and analyze pull request
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PRODUCT_VERSION: ${{ steps.product_version.outputs.version }}
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if .sonar/scanner/dotnet-sonarscanner begin \
              /k:"${SONAR_PROJECT_KEY}" \
              /o:"${SONAR_ORGANIZATION}" \
              /v:"${PRODUCT_VERSION}" \
              /d:sonar.token="${SONAR_TOKEN}" \
              /d:sonar.host.url="https://sonarcloud.io" \
              /d:sonar.qualitygate.wait=true \
              /d:sonar.pullrequest.key="${PR_NUMBER}" \
              /d:sonar.pullrequest.branch="${PR_HEAD_REF}" \
              /d:sonar.pullrequest.base="${PR_BASE_REF}" \
              /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml \
              /d:sonar.python.coverage.reportPaths=python-coverage.xml; then
              break
            else
              status=$?
            fi

            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi

            rm -rf .sonarqube
            sleep $((attempt * 30))
          done
          dotnet build roles/FWO.sln --configuration Debug --no-incremental
          .sonar/scanner/dotnet-coverage collect --settings FWO.coverage.settings \
            "dotnet test roles/tests-unit/files/FWO.Test/FWO.Test.csproj --configuration Debug --no-build --settings FWO.default.runsettings" \
            -f xml \
            -o coverage.xml
          python -m coverage run -m pytest -q roles/importer/files/importer/test scripts
          python -m coverage xml -o python-coverage.xml
          for attempt in 1 2 3; do
            if .sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}" 2>&1 | tee sonar-end.log; then
              break
            else
              status=$?
            fi

            # A failing quality gate is a verdict, not a transient error -
            # retrying it only triples the runtime of an already failed run.
            if grep -q "QUALITY GATE STATUS: FAILED" sonar-end.log; then
              echo "Quality gate failed, see the SonarCloud dashboard for details - not retrying."
              exit "$status"
            fi

            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi

            sleep $((attempt * 30))
          done
