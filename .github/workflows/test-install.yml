name: FWO Test Install
# NOTE: this workflow's behavior (triggers, test plan, job contents) is documented in
# documentation/developer-docs/github/test-install-workflow.md - please keep that doc in
# sync when changing triggers, the plan or job logic here.
#
# A pull request installs on Ubuntu 24.04 and runs the Python unit tests on Python 3.11. The
# installs on every supported Ubuntu version and the Python unit tests on every supported
# Python version run after the merge into develop, and on the pull requests they exist for:
# Ansible changes also install on Ubuntu 22.04 (ansible-core 2.18), Dependabot pip updates run
# every Python version. scripts/ci/install_plan.py makes that choice. A failure after the merge
# is reported to the merged pull request. The C# unit tests run in the Sonar workflows, which
# need them for coverage.

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Full run: the same checks as a merge into develop"
        type: boolean
        default: false
        required: true
  push:
    branches:
      - main
      - develop
  pull_request:

# A newer push to a pull request cancels its running checks. On main and develop every commit
# gets a run of its own instead, so that a failure after a merge points at the pull request
# whose merge caused it: in one shared group GitHub would replace a waiting run by the next
# merge, and the commits in between would never be tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only for every job; the repository default would give each job a write token. Jobs that
# need more declare their own block, which replaces this one: test-install and report-merge-failure.
permissions:
  contents: read

jobs:
  plan:
    name: Determine test plan
    runs-on: ubuntu-latest
    outputs:
      install_matrix: ${{ steps.plan.outputs.install_matrix }}
      python_versions: ${{ steps.plan.outputs.python_versions }}
    steps:
      # A pull request checks out its merge commit; depth 2 adds its first parent, the base
      # branch, which the changed files are listed against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: List the files the pull request changes
        if: ${{ github.event_name == 'pull_request' }}
        run: git diff --no-renames --name-only -z HEAD^1 HEAD >"$RUNNER_TEMP/changed-files"

      - name: Select installs and Python versions
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          INPUT_FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail
          changed_files=()
          if [[ -f "$RUNNER_TEMP/changed-files" ]]; then
            changed_files=(--changed-files "$RUNNER_TEMP/changed-files")
          fi
          python3 scripts/ci/install_plan.py \
            --event-name "$EVENT_NAME" \
            --ref "$REF" \
            --head-ref "$HEAD_REF" \
            --full "${INPUT_FULL:-false}" \
            "${changed_files[@]}" \
            --output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  test-install:
    needs: plan
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: read  # gh pr view in scripts/ci/evaluate_version_gate.sh
    env:
      RUNNING_ON_GITHUB_ACTIONS: true
      FWO_RUN_INTEGRATION_TESTS: "true"
      FWO_TEST_USERNAME: "integration_user_jwt_refresh_test"
      FWO_TEST_PASSWORD: "testpassword"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.install_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same evaluation as the required "Gate pull request version" check, so that a pull
      # request that needs a version bump learns it within seconds instead of after its install.
      # It runs in every install job rather than once in the plan job, so that each re-run of a
      # failed install decides again. It fails rather than skips the install: GitHub counts a
      # skipped required check as passed. This copy runs the pull request's own script and is
      # only an early signal; the binding gate runs in version-gate.yml from the base branch.
      - name: Check the version before installing
        id: version
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if ! scripts/ci/evaluate_version_gate.sh "$PR_NUMBER" "$PR_BASE_REF"; then
            echo "::error title=Version gate::The version of this pull request cannot be merged as it is, see the log of this step. After fixing it, or once the Version gate check turned green without a push, re-run the failed jobs."
            exit 1
          fi

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The installer environment of a real installation: a venv of the system's own python3
      # (3.10 on Ubuntu 22.04, 3.12 on 24.04, 3.14 on 26.04), which also decides the pinned
      # Ansible version, see requirements.txt. The importer venv uses the same interpreter.
      - name: Set up the installer environment
        run: |
          source scripts/install-ansible-from-venv.sh
          echo "$VIRTUAL_ENV/bin" >>"$GITHUB_PATH"
          ansible --version

      - name: Run sample LDAP seeding regression tests
        run: bash scripts/tests/test-sample-auth-data.sh

      # Demo data is off by default since GHSA-3v53-q5h9-pvfh, but the tests rely on it: sample-auth-data
      # creates the LDAP user of the JWT integration tests (integration_user_jwt_refresh_test), and the
      # integration tests use the sample devices, tenants and users. So every run requests it explicitly.
      #
      # unittests_run is skipped in both playbook runs: the C# unit tests run in the Sonar workflows and
      # the Python unit tests in python-unit-tests. The test project is still deployed, the JWT step
      # runs from it.
      - name: Run Ansible test install
        run: |
          cd ${{ github.workspace }}
          ./scripts/run-playbook-with-sudo.sh site.yml -e force_install=true -e add_demo_data=yes --skip-tags integrationtests,unittests_run

      # Runs inside the installation, below the global.json the installer writes to
      # /usr/local/fworch (dotnet_sdk_global_json_file): dotnet looks for global.json from the current
      # directory up, not from the project. From the checkout it would build with the newest SDK of
      # the runner image, which on Ubuntu 22.04 shares /usr/share/dotnet with the installer's
      # dotnet-install fallback and includes a newer major SDK than FWO supports.
      - name: Run installed API integration tests
        working-directory: /usr/local/fworch/test/csharp/FWO.Test
        run: |
          sudo -u fworch env \
            RUNNING_ON_GITHUB_ACTIONS=true \
            FWO_RUN_INTEGRATION_TESTS=true \
            FWO_TEST_USERNAME=integration_user_jwt_refresh_test \
            FWO_TEST_PASSWORD=testpassword \
            dotnet test FWO.Test.csproj --filter "FullyQualifiedName~AuthenticationTokenIntegrationTest|FullyQualifiedName~EffectiveRequestStateMutationIntegrationTest" --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Collect middleware diagnostics after installed API test failure
        if: ${{ failure() && steps.version.outcome != 'failure' }}
        run: |
          sudo systemctl status fworch-middleware --no-pager || true
          sudo journalctl -u fworch-middleware --no-pager -n 200 || true
          sudo tail -n 200 /var/log/fworch/middleware.log || true
          sudo tail -n 200 /var/log/apache2/error.log || true

      - name: Run Ansible integration tests with cleanup
        if: ${{ success() }}
        run: |
          cd ${{ github.workspace }}
          ./scripts/run-playbook-with-sudo.sh site.yml -e force_install=true -e add_demo_data=yes --tags integrationtests

      # Both passes of a CA rotation, each limited to the certificate play plus the tests:
      # the rotation restarts the services caching anchors and identities itself, which is
      # what makes a "--tags certificates" rotation supported in the first place. The
      # tests run inside each invocation because they assert on the state that very step
      # has to leave - both anchors trusted after pass 1 (proven with a client identity of
      # the staged CA presented to the API), the previous one retired after pass 2.
      - name: Run Ansible CA rotation pass 1 (prepare) with integration tests
        if: ${{ success() }}
        run: |
          cd ${{ github.workspace }}
          ./scripts/run-playbook-with-sudo.sh site.yml \
            -e force_install=true \
            -e add_demo_data=yes \
            -e "installation_mode=upgrade internalca_ca_rotation=prepare" \
            --tags certificates,integrationtests

      # The refusal pass 2 depends on: without a pass-1 record for every host it must stop
      # before switching anything. The markers are set aside, pass 2 has to be refused for
      # exactly that reason, and the staged CA must still be staged rather than switched
      # to; the pass 2 step below is the matching allowed case once the markers are back.
      # The markers are put back before the result is checked, so a failure leaves the
      # rotation state intact for the diagnostics step.
      - name: Verify CA rotation pass 2 refuses a host that has not recorded pass 1
        if: ${{ success() }}
        run: |
          cd ${{ github.workspace }}
          ca_dir=/usr/local/fworch/etc/secrets/ca
          sudo mv "$ca_dir/rotation" "$RUNNER_TEMP/rotation-markers"
          refusal_status=0
          ./scripts/ci/expect-installer-refusal.sh \
            "has not confirmed that it trusts the next internal CA" \
            site.yml \
            -e force_install=true \
            -e "installation_mode=upgrade internalca_ca_rotation=activate" \
            --tags certificates || refusal_status=$?
          sudo mv "$RUNNER_TEMP/rotation-markers" "$ca_dir/rotation"
          test "$refusal_status" -eq 0
          sudo test -f "$ca_dir/next-ca.crt"
          sudo test ! -e "$ca_dir/previous-ca.crt"

      # An interrupted switch leaves the key and certificate of two different CAs in place,
      # and only pass 2 may complete it: any other run would take the mismatch for a damaged
      # CA certificate and self-sign a replacement for the key. The state is simulated by a
      # previous-ca.crt next to the staged CA; an upgrade without the switch has to be
      # refused and must not have touched the CA in force.
      - name: Verify an interrupted CA switch refuses every run other than pass 2
        if: ${{ success() }}
        run: |
          cd ${{ github.workspace }}
          ca_dir=/usr/local/fworch/etc/secrets/ca
          ca_before="$(sudo sha256sum "$ca_dir/ca.crt" "$ca_dir/ca.key")"
          sudo install -o root -g root -m 0600 "$ca_dir/ca.crt" "$ca_dir/previous-ca.crt"
          refusal_status=0
          ./scripts/ci/expect-installer-refusal.sh \
            "was interrupted while it switched to the next internal CA" \
            site.yml \
            -e force_install=true \
            -e installation_mode=upgrade \
            --tags certificates || refusal_status=$?
          sudo rm -f "$ca_dir/previous-ca.crt"
          test "$refusal_status" -eq 0
          test "$(sudo sha256sum "$ca_dir/ca.crt" "$ca_dir/ca.key")" = "$ca_before"
          sudo test -f "$ca_dir/next-ca.crt"

      - name: Run Ansible CA rotation pass 2 (activate) with integration tests
        if: ${{ success() }}
        run: |
          cd ${{ github.workspace }}
          ./scripts/run-playbook-with-sudo.sh site.yml \
            -e force_install=true \
            -e add_demo_data=yes \
            -e "installation_mode=upgrade internalca_ca_rotation=activate" \
            --tags certificates,integrationtests

      # The refusals that apply once a rotation has completed, each checked against its
      # own message:
      # - pass 2 repeated finds nothing to resume and must say so, rather than send the
      #   operator off to prepare another rotation;
      # - pass 1 while a switch has not completed (simulated by a previous-ca.crt without
      #   a staged CA) must not stage a CA;
      # - the switch persisted in the installer settings file must be refused, because it
      #   would repeat the step on every later upgrade.
      # None of them may leave a staged CA behind. "activate" with --limit is not covered:
      # the single-host CI inventory has no host a limit could leave out.
      - name: Verify the CA rotation refusals after pass 2
        if: ${{ success() }}
        run: |
          cd ${{ github.workspace }}
          ca_dir=/usr/local/fworch/etc/secrets/ca

          ./scripts/ci/expect-installer-refusal.sh \
            "that rotation is complete and nothing needs to be repeated" \
            site.yml \
            -e force_install=true \
            -e "installation_mode=upgrade internalca_ca_rotation=activate" \
            --tags certificates
          sudo test ! -e "$ca_dir/next-ca.crt"

          sudo install -o root -g root -m 0600 "$ca_dir/ca.crt" "$ca_dir/previous-ca.crt"
          refusal_status=0
          ./scripts/ci/expect-installer-refusal.sh \
            "to finish it before preparing another rotation" \
            site.yml \
            -e force_install=true \
            -e "installation_mode=upgrade internalca_ca_rotation=prepare" \
            --tags certificates || refusal_status=$?
          sudo rm -f "$ca_dir/previous-ca.crt"
          test "$refusal_status" -eq 0
          sudo test ! -e "$ca_dir/next-ca.crt"

          settings_file="$RUNNER_TEMP/fwo-install-settings-rotation.yml"
          printf 'internalca_ca_rotation: prepare\n' > "$settings_file"
          FWORCH_LOCAL_SETTINGS="$settings_file" ./scripts/ci/expect-installer-refusal.sh \
            "It is a one-shot switch for the two passes of a CA rotation" \
            site.yml \
            -e force_install=true \
            -e installation_mode=upgrade \
            --tags certificates
          rm -f "$settings_file"
          sudo test ! -e "$ca_dir/next-ca.crt"

      - name: Collect certificate diagnostics after a failed CA rotation
        if: ${{ failure() && steps.version.outcome != 'failure' }}
        run: |
          sudo ls -laR /usr/local/fworch/etc/secrets/ca/ || true
          sudo cat /usr/local/fworch/etc/secrets/ca/retired-ca-names || true
          sudo openssl crl2pkcs7 -nocrl -certfile /etc/fworch/fworch-internal-ca.crt | openssl pkcs7 -print_certs -noout || true
          sudo openssl x509 -in /usr/local/fworch/etc/secrets/client/client.crt -noout -issuer -dates || true
          sudo tail -n 100 /var/log/apache2/error.log || true

      # A full run rather than "--tags integrationtests", because roles/tests-integration
      # asserts on facts the reset itself produces - the retired CA names, which identities
      # were reissued, which customer-managed pairs were left untouched - and those exist
      # only inside the invocation that performed the rotation. This is also the only run
      # that exercises the force-regeneration paths in create-ca.yml and
      # issue-certificates.yml, and that proves every service still comes up against a CA
      # anchor that changed underneath it. Only unittests_run is skipped, see the install step.
      - name: Run Ansible certificate reset upgrade with integration tests
        if: ${{ success() }}
        run: |
          cd ${{ github.workspace }}
          ./scripts/run-playbook-with-sudo.sh site.yml \
            -e force_install=true \
            -e add_demo_data=yes \
            -e "installation_mode=upgrade internalca_reset_certificates=true" \
            --skip-tags unittests_run

      - name: Collect certificate diagnostics after a failed reset upgrade
        if: ${{ failure() && steps.version.outcome != 'failure' }}
        run: |
          sudo ls -la /usr/local/fworch/etc/secrets/ca/ || true
          sudo cat /usr/local/fworch/etc/secrets/ca/retired-ca-names || true
          sudo openssl x509 -in /usr/local/fworch/etc/fworch-internal-ca.crt -noout -subject -dates || true
          sudo apachectl configtest || true
          sudo tail -n 100 /var/log/apache2/error.log || true

      # The UI blocks before it listens until its config subscription delivers, so a broken API
      # websocket path only shows up as a 503 from Apache - its own log says why.
      - name: Collect UI diagnostics after a failure
        if: ${{ failure() && steps.version.outcome != 'failure' }}
        run: |
          sudo systemctl status fworch-ui --no-pager || true
          sudo journalctl -u fworch-ui --no-pager -n 200 || true
          sudo tail -n 200 /var/log/fworch/ui.log || true

  launcher-guard-tests:
    name: Launcher guard regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Stubbed ansible/ansible-galaxy, so no real Ansible install is needed.
      - name: Run run-playbook-with-sudo.sh guard tests
        run: ./scripts/tests/test-run-playbook-with-sudo.sh

  # Python 3.11 on a pull request, every supported version after a merge and on Dependabot pip
  # updates. Pyright in python-code-check reports APIs the oldest and the newest supported
  # Python lack on every pull request already.
  python-unit-tests:
    needs: plan
    name: Python unit tests on Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.python_versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # Each requirements file goes into an environment of its own, as on an installed system:
      # the installer requirements run Ansible, the importer ones the importer venv. Installing the
      # installer requirements proves that the pinned Ansible still installs on this version.
      - name: Install the installer requirements
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libldap2-dev libsasl2-dev
          python -m venv "$RUNNER_TEMP/installer-venv"
          "$RUNNER_TEMP/installer-venv/bin/python" -m pip install -r requirements.txt

      - name: Install the importer and scripts requirements
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --only-binary=cryptography --prefer-binary -r roles/importer/files/importer/requirements.txt -r scripts/requirements.txt

      # The scripts tests include the customizing scripts, the version gate and the workflow
      # policy tests in scripts/ci.
      - name: Run importer and scripts unit tests
        run: .venv/bin/python -m pytest -q roles/importer/files/importer/test scripts

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The repository's global.json, the installer's SDK pin (derived from dotnet_version) and the
      # setup-dotnet version of sonarcloud-pr.yml must name the same .NET major.minor version. Otherwise CI builds
      # with a different SDK than an installation does (#5700).
      - name: Check that the .NET SDK pins match dotnet_version
        run: |
          set -euo pipefail
          inventory_version="$(sed -n 's/^dotnet_version:[[:space:]]*"\{0,1\}\([0-9][0-9.]*\)"\{0,1\}[[:space:]]*$/\1/p' inventory/group_vars/all.yml)"
          global_json_version="$(jq -r '.sdk.version' global.json)"
          sonar_pr_version="$(sed -n "s/^[[:space:]]*dotnet-version:[[:space:]]*'\{0,1\}\([0-9][0-9.]*\)\.x'\{0,1\}[[:space:]]*$/\1/p" .github/workflows/sonarcloud-pr.yml)"
          echo "dotnet_version in inventory/group_vars/all.yml: ${inventory_version:-<missing>}"
          echo "sdk.version in global.json: ${global_json_version}"
          echo "dotnet-version in sonarcloud-pr.yml: ${sonar_pr_version:-<missing>}.x"
          if [ -z "$inventory_version" ] || [ -z "$sonar_pr_version" ]; then
            echo "::error::Could not read dotnet_version or the sonarcloud-pr.yml dotnet-version"
            exit 1
          fi
          if [[ "$global_json_version" != "${inventory_version}".* ]]; then
            echo "::error file=global.json::sdk.version ${global_json_version} does not match dotnet_version ${inventory_version}"
            exit 1
          fi
          if [ "$sonar_pr_version" != "$inventory_version" ]; then
            echo "::error file=.github/workflows/sonarcloud-pr.yml::dotnet-version ${sonar_pr_version}.x does not match dotnet_version ${inventory_version}"
            exit 1
          fi
      # The installer publishes middleware and UI in Release, while the other workflows build Debug. Warnings are
      # errors, so a warning that only occurs in Release (e.g. a variable used only inside #if DEBUG) would break
      # every installation unnoticed (GHSA-9j26-vffp-8f83).
      - name: Build all projects in Release configuration
        run: dotnet build roles/FWO.sln --configuration Release

  python-code-check:
    name: Python Code Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - run: python -m venv .venv

      - run: ".venv/bin/python -m pip install --only-binary=cryptography --prefer-binary -r roles/importer/files/importer/requirements.txt"

      - run: ".venv/bin/python -m pip install --only-binary=cryptography --prefer-binary -r scripts/requirements.txt"

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        with:
          version-file: "roles/importer/files/importer/requirements.txt"

      # pyproject.toml sets the oldest supported Python (3.10), which reports APIs only newer
      # versions provide; the second pass with the newest one reports what newer versions removed.
      - name: pyright
        run: |
          .venv/bin/pyright --version
          .venv/bin/pyright
          .venv/bin/pyright --pythonversion 3.14

      - run: ruff check

      - run: ruff format --exit-non-zero-on-format

  # Most of these checks run only after a merge, so their failure would otherwise only show in
  # the commit history of develop. This comments on the pull request whose merge produced the
  # commit, which notifies its author and reviewers.
  report-merge-failure:
    name: Report failed checks to the merged pull request
    needs: [plan, test-install, python-unit-tests]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Comment on the merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python3 scripts/ci/report_merge_failure.py \
            --repository "$REPOSITORY" \
            --commit-sha "$COMMIT_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --server-url "$SERVER_URL"
