name: Validate FWO PR version

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
  # Started on the PR branch by the allocator and by the requeue workflow,
  # because their GITHUB_TOKEN pushes and merges do not trigger pull_request.
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Number of the pull request whose head branch is validated
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # The validation tooling comes from develop, so a PR cannot weaken the
      # checks applied to itself by editing the helper scripts.
      - name: Check out trusted validation tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: develop
          path: fwo-version-tooling
          fetch-depth: 1
          persist-credentials: false

      - name: Read pull request
        id: pull-request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        run: |
          if [[ ! -f fwo-version-tooling/scripts/fwo_version_reservations.py ]]; then
            echo "::warning::Versioning tooling is not on develop yet; skipping validation."
            exit 0
          fi
          python3 fwo-version-tooling/scripts/fwo_version_reservations.py describe-pull-request --pull-request "$PULL_REQUEST_NUMBER" \
            --event-name "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --sha "$GITHUB_SHA"

      # Without the label a PR must not reserve a version, otherwise it would
      # bypass uniqueness and ordering.
      - name: Reject unlabelled version changes
        if: steps.pull-request.outputs.versioned == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ steps.pull-request.outputs.number }}
        run: python3 fwo-version-tooling/scripts/fwo_version_reservations.py check-unlabelled --pull-request "$PULL_REQUEST_NUMBER"

      - name: Check out pull request head
        if: steps.pull-request.outputs.versioned == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ steps.pull-request.outputs.head_sha }}
          path: pull-request
          fetch-depth: 1
          persist-credentials: false

      - name: Read base product version
        id: base-version
        if: steps.pull-request.outputs.versioned == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 fwo-version-tooling/scripts/fwo_version_reservations.py base-version

      - name: Validate versioned files
        if: steps.pull-request.outputs.versioned == 'true'
        env:
          BASE_VERSION: ${{ steps.base-version.outputs.value }}
        run: |
          cd pull-request
          ../fwo-version-tooling/scripts/allocate-fwo-version.sh --check --base-version "$BASE_VERSION"

      - name: Enforce the next reserved version
        if: steps.pull-request.outputs.versioned == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_VERSION: ${{ steps.base-version.outputs.value }}
          HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
          PULL_REQUEST_NUMBER: ${{ steps.pull-request.outputs.number }}
        run: |
          python3 fwo-version-tooling/scripts/fwo_version_reservations.py check-order --pull-request "$PULL_REQUEST_NUMBER" \
            --head-sha "$HEAD_SHA" --base-version "$BASE_VERSION"
