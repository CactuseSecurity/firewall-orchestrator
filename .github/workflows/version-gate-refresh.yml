name: Version gate refresh
# NOTE: this workflow's behavior is documented in
# documentation/developer-docs/github/version-gate-workflow.md and the policy it enforces
# in documentation/developer-docs/versioning.md - please keep both in sync when changing
# triggers or job logic here.
#
# Advancing develop or creating a sealing tag can change a pull request's verdict without
# sending that pull request an event of its own. This workflow re-runs the Version gate
# workflow for every open pull request, which rewrites that same check run with a freshly
# evaluated result. It deliberately lives in its own file so that it never adds a second,
# skipped entry to a pull request.

on:
  push:
    branches:
      - develop
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to refresh (empty means all open pull requests)
        type: string
        required: false

permissions:
  contents: read

env:
  BASE_BRANCH: develop
  GATE_WORKFLOW: version-gate.yml
  PULL_REQUEST_LIMIT: 200
  # Bounded wait for gate runs that are still running when the refresh starts, see below.
  # The budget is for the whole loop, not per pull request.
  RUN_WAIT_SECONDS: 15
  RUN_WAIT_BUDGET_SECONDS: 300

jobs:
  refresh-open-prs:
    name: Refresh open pull request gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # Needed to re-run the gate workflow. This job only ever runs on push and
      # workflow_dispatch, so no fork controlled code is anywhere near this token.
      actions: write
    concurrency:
      group: version-gate-refresh
      cancel-in-progress: false
    steps:
      - name: Decide whether open pull request gates need refresh
        id: trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$REF_TYPE" == "branch" ]]; then
            echo "Branch '$REF_NAME' advanced, refreshing open pull requests."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$REF_NAME" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-dev)?$ ]]; then
            echo "Tag '$REF_NAME' seals a version, refreshing open pull requests."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag '$REF_NAME' does not seal a version, nothing to refresh."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # No checkout: everything below goes through the GitHub API.
      - name: Re-run the version gate for every open pull request
        if: steps.trigger.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SINGLE_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail

          if [[ -n "${SINGLE_PR:-}" ]]; then
            pull_requests="[$(gh pr view "$SINGLE_PR" --json number,headRefOid)]"
          else
            pull_requests="$(gh pr list --base "$BASE_BRANCH" --state open --limit "$PULL_REQUEST_LIMIT" \
              --json number,headRefOid)"
            pull_request_count="$(jq length <<<"$pull_requests")"
            if [[ "$pull_request_count" -ge "$PULL_REQUEST_LIMIT" ]]; then
              # The cap bounds the cost of the loop below. Pull requests beyond it keep their
              # previous gate result on purpose, so report how many they are: the number is what
              # tells a maintainer how much has to be refreshed by hand.
              if ! open_pull_request_count="$(gh api graphql \
                -f query='query($owner: String!, $name: String!, $base: String!) {
                  repository(owner: $owner, name: $name) {
                    pullRequests(states: OPEN, baseRefName: $base) { totalCount }
                  }
                }' \
                -f owner="${GH_REPO%%/*}" -f name="${GH_REPO##*/}" -f base="$BASE_BRANCH" \
                --jq '.data.repository.pullRequests.totalCount')"; then
                open_pull_request_count=""
              fi
              # The list and the count are two round trips, so a pull request closed in between
              # can make the total the smaller number. Fall back rather than print a negative.
              if [[ -n "$open_pull_request_count" && "$open_pull_request_count" -gt "$pull_request_count" ]]; then
                echo "::warning::Refreshed ${pull_request_count} of ${open_pull_request_count} open pull requests; $((open_pull_request_count - pull_request_count)) were not refreshed and keep their previous gate result."
              else
                echo "::warning::Open pull request query reached its limit of ${PULL_REQUEST_LIMIT}; additional pull requests may exist and were not refreshed."
              fi
            fi
          fi

          unrefreshed=0
          # One deadline for the whole loop. The wait below is serial, so a per-pull-request
          # budget would multiply by the number of open pull requests and could outlast the job
          # limit, which is the one outcome this loop avoids: pull requests it never reached
          # would be neither refreshed nor named. Past the deadline the rest is counted at once.
          wait_deadline=$(($(date +%s) + RUN_WAIT_BUDGET_SECONDS))
          while read -r number head_sha; do
            # GitHub returns runs newest first. Filter server-side so refresh cost is
            # bounded by the open pull request count instead of all historical runs.
            # Guarded, so one failing query costs this pull request and not the rest of the loop.
            if ! run_line="$(gh api \
              "repos/${GH_REPO}/actions/workflows/${GATE_WORKFLOW}/runs?event=pull_request_target&head_sha=${head_sha}&per_page=1" \
              --jq '.workflow_runs[0] | select(. != null) | [.id, .status] | @tsv')"; then
              echo "PR #${number}: could not query the version gate run for ${head_sha}." >&2
              unrefreshed=$((unrefreshed + 1))
              continue
            fi
            if [[ -z "$run_line" ]]; then
              echo "PR #${number}: no version gate run found for ${head_sha}, cannot refresh." >&2
              unrefreshed=$((unrefreshed + 1))
              continue
            fi

            run_id="$(cut -f1 <<<"$run_line")"
            run_status="$(cut -f2 <<<"$run_line")"

            # A run that is still going may have read the base ref or the tag list before the
            # push or tag that started this refresh, and nothing would re-run it afterwards.
            # Wait for it and re-run it like any other, rather than trust it to be fresh.
            while [[ "$run_status" != "completed" && "$(date +%s)" -lt "$wait_deadline" ]]; do
              echo "PR #${number}: run ${run_id} is ${run_status}, waiting for it to finish."
              sleep "$RUN_WAIT_SECONDS"
              if ! run_status="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}" --jq '.status')"; then
                echo "PR #${number}: could not read the status of run ${run_id}." >&2
                break
              fi
            done
            if [[ "$run_status" != "completed" ]]; then
              echo "PR #${number}: run ${run_id} is still ${run_status}, its result may predate this refresh." >&2
              unrefreshed=$((unrefreshed + 1))
              continue
            fi

            echo "PR #${number}: re-running version gate run ${run_id}."
            gh run rerun "$run_id" ||
              { echo "PR #${number}: could not re-run ${run_id}." >&2; unrefreshed=$((unrefreshed + 1)); }
          done < <(jq -r '.[] | "\(.number) \(.headRefOid)"' <<<"$pull_requests")

          # A pull request that could not be refreshed keeps a stale gate result, so make
          # that loud rather than silently leaving a merge unblocked.
          if [[ "$unrefreshed" -gt 0 ]]; then
            echo "Could not refresh the version gate for ${unrefreshed} pull request(s)." >&2
            exit 1
          fi
