# returns the stored (encrypted) credentials of a single ldap connection
# only the middleware-server role is allowed to read them

query getLdapConnectionSecrets($id: bigint!) {
  ldap_connection(where: { ldap_connection_id: { _eq: $id } }) {
    ldap_connection_id
    ldap_search_user_pwd
    ldap_write_user_pwd
  }
}
