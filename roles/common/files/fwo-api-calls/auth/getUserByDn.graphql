query getUserByDn($dn: String!, $ldapConnectionId: bigint!) {
  uiuser(where: {uuid: {_eq: $dn}, ldap_connection_id: {_eq: $ldapConnectionId}}) {
    uiuser_id
    uuid
    uiuser_username
    uiuser_email
    uiuser_first_name
    uiuser_last_name
    uiuser_language
    uiuser_password_must_be_changed
  }
}
