mutation updateUserPasswordChange(
  $id: Int!
  $passwordMustBeChanged: Boolean
  $changeTime: timestamptz!
  ) {
  update_uiuser_by_pk(
    pk_columns: { uiuser_id: $id }
    _set: {
      uiuser_password_must_be_changed: $passwordMustBeChanged
      uiuser_last_password_change: $changeTime
    }
  ) {
    uiuser_id
  }
}
