query getPoliciesByIds($ids: [Int!]!) {
  compliance_policy(where: { id: { _in: $ids } }) {
    id
    name
    created_date
    disabled
    criteria: policy_criterions(where: { removed: { _is_null: true } }) {
      criterion: criterion {
        content
        criterion_type
        id
        name
      }
    }
  }
}
