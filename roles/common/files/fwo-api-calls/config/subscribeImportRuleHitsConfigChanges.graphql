subscription subscribeImportRuleHitsConfigChanges {
  config(where: {config_user: {_eq: 0}, _or: [
    {config_key: {_eq: "importRuleHitsSleepTime"}},
    {config_key: {_eq: "importRuleHitsSleepTimeUnit"}},
    {config_key: {_eq: "importRuleHitsStartAt"}}
  ]}) {
    config_key
    config_value
    config_user
  }
}
