query getManagementNames
{
  management(order_by: {mgm_name:asc}){
    id: mgm_id
    name: mgm_name
    uid: mgm_uid
    extMgtData: ext_mgm_data
    deviceType: stm_dev_typ {
      id: dev_typ_id
      name: dev_typ_name
    }
    devices {
      id: dev_id
      name: dev_name
      uid: dev_uid
      hideInUi: hide_in_gui
    }
    hideInUi: hide_in_gui
  }
}
