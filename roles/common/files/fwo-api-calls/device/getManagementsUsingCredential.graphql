query getManagementsUsingCredential($importCredentialId: Int!) {
  management(
    where: {
      _or: [
        { import_credential_id: { _eq: $importCredentialId } }
        { export_credential_id: { _eq: $importCredentialId } }
      ]
    }
    order_by: { mgm_name: asc }
  ) {
    id: mgm_id
    name: mgm_name
  }
}
