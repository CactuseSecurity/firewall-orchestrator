mutation updateCredential(
  $id: Int!
  $username: String!
  $secret: String!
  $sshPublicKey: String
  $credential_name: String!
  $isKeyPair: Boolean
  $additionalCredentialId: Int
) {
  update_credential_by_pk(
    pk_columns: { id: $id }
    _set: {
      username: $username
      secret: $secret
      public_key: $sshPublicKey
      credential_name: $credential_name
      is_key_pair: $isKeyPair
      additional_credential_id: $additionalCredentialId
    }
  ) {
    updatedId: id
  }
}
