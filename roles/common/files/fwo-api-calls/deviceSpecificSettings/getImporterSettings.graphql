# The device specific settings the importer needs for one management, on every level they can be set on.
# The importer role may only read these keys (Hasura row filter on device_specific_config_value).
query getImporterSettings($deviceTypeKey: String!, $managementKey: String!) {
  device_specific_config_node(
    where: {
      _or: [
        {node_type: {_eq: "global"}}
        {node_type: {_eq: "device_type"}, object_key: {_eq: $deviceTypeKey}}
        {node_type: {_eq: "management"}, object_key: {_eq: $managementKey}}
      ]
    }
  ) {
    node_type
    values(where: {config_key: {_in: ["importerHostName", "sshLegacyKeyExchange"]}}) {
      config_key
      config_value
    }
  }
}
