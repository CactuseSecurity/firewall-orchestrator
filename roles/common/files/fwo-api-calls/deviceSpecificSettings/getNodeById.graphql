fragment deviceSpecificConfigNodeScopeFields on device_specific_config_node {
  id
  node_type
  object_key
  parent_id
  display_name
  sort_order
  values(order_by: {config_key: asc}) {
    node_id
    config_key
    config_value
  }
}

query getNodeById($nodeId: bigint!) {
  device_specific_config_node(where: {id: {_eq: $nodeId}}) {
    ...deviceSpecificConfigNodeScopeFields
    parent_node {
      ...deviceSpecificConfigNodeScopeFields
      parent_node {
        ...deviceSpecificConfigNodeScopeFields
        parent_node {
          ...deviceSpecificConfigNodeScopeFields
        }
      }
    }
  }
}
