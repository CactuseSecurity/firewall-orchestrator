# closes the active labels of a key on all owner networks, e.g. the App labels of the app servers after the App key changed
mutation closeOwnerNetworkLabelsOfKey($keyName: String!, $removedEventId: bigint!) {
    update_labelling_owner_network_label(
        where: { removed_event_id: { _is_null: true }, label_value: { label_key: { key_name: { _eq: $keyName } } } }
        _set: { removed_event_id: $removedEventId }
    ) {
        affected_rows
    }
}
