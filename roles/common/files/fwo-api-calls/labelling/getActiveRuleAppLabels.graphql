query getActiveRuleAppLabels($keyName: String!, $ruleIds: [bigint!]!) {
    labelling_rule_label(
        where: {
            removed_event_id: { _is_null: true }
            rule_id: { _in: $ruleIds }
            label_value: { label_key: { key_name: { _eq: $keyName } } }
        }
    ) {
        rule_id
        label_id
    }
}
