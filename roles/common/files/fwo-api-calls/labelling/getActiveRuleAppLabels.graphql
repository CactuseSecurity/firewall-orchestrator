# the active labels of the rules as a whole: only the App labels are written there (RuleAppLabelSync), so labels of
# another key are App labels of a former App key
query getActiveRuleAppLabels($ruleIds: [bigint!]!) {
    labelling_rule_label(
        where: {
            removed_event_id: { _is_null: true }
            rule_id: { _in: $ruleIds }
        }
    ) {
        rule_id
        label_id
    }
}
