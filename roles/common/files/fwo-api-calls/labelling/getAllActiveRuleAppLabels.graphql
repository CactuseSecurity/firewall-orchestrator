# the active labels of all rules as a whole written by one writer (label_source): RuleAppLabelSync reads only its own
# App labels, so labels of a former App key are among them, labels of other writers are not
query getAllActiveRuleAppLabels($labelSource: String!) {
    labelling_rule_label(where: { removed_event_id: { _is_null: true }, label_source: { _eq: $labelSource } }) {
        rule_id
        label_id
    }
}
