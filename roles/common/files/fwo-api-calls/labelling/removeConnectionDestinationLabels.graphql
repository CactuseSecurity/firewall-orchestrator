mutation removeConnectionDestinationLabels($connectionId: Int!, $assignments: [labelling_connection_destination_label_bool_exp!]!, $removedEventId: bigint!) {
    update_labelling_connection_destination_label(
        where: { connection_id: { _eq: $connectionId }, removed_event_id: { _is_null: true }, _or: $assignments }
        _set: { removed_event_id: $removedEventId }
    ) {
        affected_rows
    }
}
