# closes assignments of one writer only (label_source): the same label may also be active for another writer
mutation removeRuleLabelAssignments($assignments: [labelling_rule_label_bool_exp!]!, $removedEventId: bigint!, $labelSource: String!) {
    update_labelling_rule_label(
        where: { removed_event_id: { _is_null: true }, label_source: { _eq: $labelSource }, _or: $assignments }
        _set: { removed_event_id: $removedEventId }
    ) {
        affected_rows
    }
}
