mutation removeRuleLabelAssignments($assignments: [labelling_rule_label_bool_exp!]!, $removedEventId: bigint!) {
    update_labelling_rule_label(
        where: { removed_event_id: { _is_null: true }, _or: $assignments }
        _set: { removed_event_id: $removedEventId }
    ) {
        affected_rows
    }
}
