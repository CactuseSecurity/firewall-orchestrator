# Hasura executes the top-level fields of one mutation transactionally. Existing rows are
# therefore only removed when inserting the replacement rows succeeds as well.
mutation replaceLogEntries(
  $ownerIds: [Int!]!
  $entries: [logging_log_entry_insert_input!]!
  $metadata: [logging_ip_metadata_insert_input!]!
) {
  delete_logging_log_entry(where: {owner_id: {_in: $ownerIds}}) {
    affected_rows
  }
  insert_logging_ip_metadata(
    objects: $metadata
    on_conflict: {
      constraint: ip_metadata_pkey
      update_columns: [app_ids, area_ids, dns]
    }
  ) {
    affected_rows
  }
  insert_logging_log_entry(objects: $entries) {
    affected_rows
  }
}
