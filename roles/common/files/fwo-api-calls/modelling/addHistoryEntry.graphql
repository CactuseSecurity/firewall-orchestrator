mutation addHistoryEntry(
  $appId: Int
  $changeType: Int!
  $objectType: Int!
  $objectId: bigint!
  $changeText: String
  $changer: String!
  $changeSource: String
  $ticketId: bigint
  $workflowPhase: Int
  $oldData: jsonb
  $newData: jsonb
) {
  insert_change_history(
    objects: {
      app_id: $appId
      change_type: $changeType
      object_type: $objectType
      object_id: $objectId
      change_text: $changeText
      changer: $changer
      change_source: $changeSource
      ticket_id: $ticketId
      workflow_phase: $workflowPhase
      old_data: $oldData
      new_data: $newData
    }
  ) {
    returning {
      newIdLong: id
    }
  }
}
