mutation addPermittedOwner(
  $connectionId: Int!
  $appId: Int!
  ) {
  insert_modelling_permitted_owners(objects: {
    connection_id: $connectionId
    app_id: $appId
  }, on_conflict: {
    constraint: permitted_owners_pkey
    update_columns: []
  }) {
    returning {
      insertedConnectionId: connection_id
      insertedAppId: app_id
    }
  }
}
