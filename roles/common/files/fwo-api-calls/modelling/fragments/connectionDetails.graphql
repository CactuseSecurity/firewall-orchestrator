fragment connectionDetails on modelling_connection {
  id
  app_id
  proposed_app_id
  name
  reason
  is_interface
  used_interface_id
  is_requested
  is_published
  ticket_id
  common_service
  creator
  creation_date
  conn_prop
  extra_params
  requested_on_fw
  removed
  removal_date
  interface_permission
  owner {
    id
    name
    app_id_external
  }
  permitted_owners {
    owner {
      id
      name
      app_id_external
    }
  }
  source_nwobjects: nwobject_connections (where: { connection_field: { _eq: 1 } }){
    owner_network{
      ...appServerDetails
    }
  }
  source_approles: nwgroup_connections (where: { connection_field: { _eq: 1 } }){
    nwgroup{
      ...appRoleDetails
    }
  }
  destination_nwobjects: nwobject_connections (where: { connection_field: { _eq: 2 } }){
    owner_network{
      ...appServerDetails
    }
  }
  destination_approles: nwgroup_connections (where: { connection_field: { _eq: 2 } }){
    nwgroup{
      ...appRoleDetails
    }
  }
  service_groups: service_group_connections{
    service_group{
      ...serviceGroupDetails
    }
  }
  services: service_connections{
    service{
      ...serviceDetails
    }
  }
  connection_source_labels(where: { removed_event_id: { _is_null: true } }, order_by: [{ and_group: asc }, { label_id: asc }]) {
    label_id
    and_group
    label_value {
      value
      label_key {
        key_name
      }
    }
  }
  connection_destination_labels(where: { removed_event_id: { _is_null: true } }, order_by: [{ and_group: asc }, { label_id: asc }]) {
    label_id
    and_group
    label_value {
      value
      label_key {
        key_name
      }
    }
  }
}
