query getConnectionForNotification($id: Int!) {
  modelling_connection(where: { id: { _eq: $id } }) {
    id
    app_id
    proposed_app_id
    name
    reason
    is_interface
    is_requested
    ticket_id
    creator
    removed
    owner {
      id
      name
      app_id_external
    }
    ownerByProposedAppId {
      id
      name
      app_id_external
    }
  }
}
