query getHistory (  
  $limit: Int
  $offset: Int
){
  change_history (
    limit: $limit
    offset: $offset
    order_by: { change_time: desc }
  ){
    id
    app_id
    change_type
    object_type
    object_id
    change_text
    changer
    change_time
    change_source
    ticket_id
    workflow_phase
    old_data
    new_data
  }
}
