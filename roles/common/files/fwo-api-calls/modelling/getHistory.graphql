query getHistory (
  $limit: Int
  $offset: Int
){
  change_history (
    where: { module: { _eq: "modelling" } }
    limit: $limit
    offset: $offset
    order_by: [{ change_time: desc }, { id: desc }]
  ){
    id
    app_id
    module
    change_type
    object_type
    object_id
    change_text
    changer
    changer_id
    change_time
    change_source
    ticket_id
    workflow_phase
    old_data
    new_data
    audit_proof_critical
  }
}
