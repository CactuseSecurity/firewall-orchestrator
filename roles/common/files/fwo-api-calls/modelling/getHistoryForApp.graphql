query getHistoryForApp ($appId: Int!){
  change_history (where: {app_id: {_eq: $appId}} order_by: { change_time: desc }){
    id
    app_id
    change_type
    object_type
    object_id
    change_text
    changer
    change_time
    change_source
    ticket_id
    workflow_phase
    old_data
    new_data
    audit_prove_critical
  }
}
