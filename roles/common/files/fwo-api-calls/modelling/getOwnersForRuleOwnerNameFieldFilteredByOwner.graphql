query getOwnersForRuleOwnerNameFieldFilteredByOwner($ownerIds: [Int!]!) {
  # Removed connections must stay mapped so delete tasks and deleted-model rules can still be found.
  modelling_connection(
    where: {
      app_id: { _in: $ownerIds }
      owner: { active: { _eq: true } }
    }
  ) {
    id
    app_id
    name
  }
}
