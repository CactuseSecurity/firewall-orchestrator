query getPublishedInterfaces($appId: Int!){
  modelling_connection (where: { _and: [
    { is_interface: { _eq: true }, is_published: { _eq: true }, is_requested: { _eq: false }, removed: { _eq: false } }
    { _or: [
      { app_id: { _eq: $appId } }
      { owner: { active: { _eq: true }, import_source: { _is_null: false }, owner_networks: { is_deleted: { _eq: false } } } }
    ] }
  ] } order_by: { name: asc }){
    ...connectionDetails
    owner{
      id
      name
      app_id_external
    }
  }
}
