query getRequestedInterfaces($showRemoved: Boolean!){
  modelling_connection (
    where: {
      is_interface: { _eq: true },
      is_requested: { _eq: true },
      removed: { _eq: $showRemoved }
    },
    order_by: { name: asc }
  ){
    id
    app_id
    proposed_app_id
    name
    is_interface
    used_interface_id
    is_requested
    is_published
    ticket_id
    creation_date
    conn_prop
    removed
    removal_date
    interface_permission
    owner {
      id
      name
      app_id_external
      owner_lifecycle_state_id
      active
    }
    ownerByProposedAppId {
      id
      name
      app_id_external
      owner_lifecycle_state_id
      active
    }
    used_by_connections: connections (where: { removed: { _eq: false } }, order_by: { id: asc }){
      id
    }
  }
}
