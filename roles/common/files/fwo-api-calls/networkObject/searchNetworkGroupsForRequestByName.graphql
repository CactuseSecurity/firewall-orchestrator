query searchNetworkGroupsForRequestByName(
  $mgmId: Int!
  $pattern: String!
  $limit: Int!
) {
  firewall_nw_object(
    where: {
      mgm_id: { _eq: $mgmId }
      obj_typ_id: { _in: [2, 11] }
      active: { _eq: true }
      removed: { _is_null: true }
      obj_name: { _ilike: $pattern }
    }
    order_by: [{ obj_name: asc }, { obj_id: asc }]
    limit: $limit
  ) {
    obj_id
    obj_name
    obj_member_names
    objgrps(where: { active: { _eq: true }, removed: { _is_null: true } }) {
      id: objgrp_member_id
      byId: objectByObjgrpMemberId {
        obj_id
        obj_name
        obj_ip
        obj_ip_end
      }
    }
  }
}
