query getImportsToNotifyForRuleChanges {
  import_control(where: {
    is_initial_import: {_eq: false}
    successful_import: {_eq: true}
    # not policy_changes_found: that also covers rule changes that are not security-relevant
    security_relevant_changes_counter: {_gt: 0}
    notification_done: {_eq: false}
    mgm_id: {_is_null: false}
  } order_by: {stop_time: asc}) {
    control_id
    stop_time
    mgm_id
    management{
      mgm_name
    }
    security_relevant_changes_counter
  }
}
