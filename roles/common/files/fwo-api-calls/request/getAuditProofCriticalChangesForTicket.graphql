# Audit proof critical changes of a workflow ticket: the change_history rows the workflow module marked as
# audit-proof critical. FWO.Services.Workflow.WfDbAccess.LogWorkflowChange sets that flag for a
# content change made in a UI session by a user other than the ticket requester, which is exactly
# the "performed manually" case this query reports. The flag is therefore the filter, not
# change_source: workflow rows always carry change_source = 'workflow'.
#
# module is part of the filter although the workflow module is the only writer of audit-proof-critical
# rows today: audit_proof_critical, module and ticket_id are all insertable by the workflow and
# modelling roles, so without it a row written directly through the API under module = 'modelling'
# would be reported here as a workflow change of someone else's ticket.
#
# changer_id is selected next to changer because only changer_id is trustworthy: the API presets it
# from the authenticated session, while changer is free text supplied by the writer. Since the
# change_history_bind_changer trigger, a new row's changer always names the user of its changer_id;
# changer_user resolves that name for older rows as well. A reader that has to attribute a change
# uses changer_id and changer_user; changer stays in the result because it is the only attribution
# available for rows written outside a user session, where changer_id is null.
#
# audit_proof_critical is only kept by that trigger for a workflow change of an existing ticket by a
# known user other than its requester, so a user cannot flag a row as someone else's manual change.
#
# change_time sorts nulls last so that a row without a timestamp cannot take the place of the newest
# change: the column is nullable and Postgres orders nulls first on a descending sort.
query getAuditProofCriticalChangesForTicket($ticketId: bigint!) {
  change_history(
    where: {
      ticket_id: { _eq: $ticketId }
      module: { _eq: "workflow" }
      audit_proof_critical: { _eq: true }
    }
    order_by: [{ change_time: desc_nulls_last }, { id: desc }]
  ) {
    change_time
    changer
    changer_id
    changer_user {
      uiuser_username
    }
    change_text
  }
}
