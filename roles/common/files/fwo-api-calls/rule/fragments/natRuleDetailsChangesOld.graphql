fragment natRuleDetailsChangesOld on firewall_rule {
  ...ruleDetailsChangesOld
  translate: ruleByXlateRule {
    rule_src
    rule_src_refs
    rule_src_neg
    rule_dst
    rule_dst_refs
    rule_dst_neg
    rule_svc
    rule_svc_refs
    rule_svc_neg
    rule_froms(where: {
      active: { _eq: $active }
      rf_create: { _lte: $import_id_old }
      _or: [
        { removed: { _is_null: true } }
        { removed: { _gt: $import_id_old } }
      ]
    }, order_by: { object: { obj_name: asc } }) {
      usr {
        ...userDetailsChangesOld
      }
      object {
        ...networkObjectDetailsChangesOld
      }
    }
    rule_tos(where: {
      active: { _eq: $active }
      rt_create: { _lte: $import_id_old }
      _or: [
        { removed: { _is_null: true } }
        { removed: { _gt: $import_id_old } }
      ]
    }, order_by: { object: { obj_name: asc } }) {
      usr {
        ...userDetailsChangesOld
      }
      object {
        ...networkObjectDetailsChangesOld
      }
    }
    rule_services(where: {
      active: { _eq: $active }
      rs_create: { _lte: $import_id_old }
      _or: [
        { removed: { _is_null: true } }
        { removed: { _gt: $import_id_old } }
      ]
    }, order_by: { service: { svc_name: asc } }) {
      service {
        ...networkServiceDetailsChangesOld
      }
    }
  }
}
