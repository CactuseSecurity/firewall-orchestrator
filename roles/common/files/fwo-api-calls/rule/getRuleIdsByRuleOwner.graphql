query GetRuleIdsByRuleOwner(
    $ownerId: Int!
    $owner_mapping_source: smallint!
    $rule_type_filters: [firewall_rule_bool_exp!] = []
) {
    rule_owner(
        where: {
            owner_mapping_source_id: { _eq: $owner_mapping_source }
            owner_id: { _eq: $ownerId }
            removed: { _is_null: true }
            rule: { _and: $rule_type_filters }
        }
    ) {
        rule_id
    }
}
