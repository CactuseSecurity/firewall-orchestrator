query getCheckPointLayerGuardsAtImport(
  $managementId: Int!
  $sourceRuleIds: [bigint!]!
  $importId: bigint!
) {
  firewall_rule(
    where: {
      rule_id: { _in: $sourceRuleIds }
      mgm_id: { _eq: $managementId }
      rule_create: { _lte: $importId }
      _or: [{ removed: { _is_null: true } }, { removed: { _gt: $importId } }]
    }
    order_by: { rule_id: asc }
  ) {
    rule_id
    mgm_id
    rulebase_id
    rule_create
    removed
    rule_src_neg
    rule_dst_neg
    rule_svc_neg
    rule_froms(
      where: {
        rf_create: { _lte: $importId }
        _or: [{ removed: { _is_null: true } }, { removed: { _gt: $importId } }]
      }
      order_by: [{ obj_id: asc }, { rf_create: asc }]
    ) {
      rule_id
      obj_id
      negated
      rf_create
      removed
      object {
        ...CheckPointGuardObject
      }
    }
    rule_tos(
      where: {
        rt_create: { _lte: $importId }
        _or: [{ removed: { _is_null: true } }, { removed: { _gt: $importId } }]
      }
      order_by: [{ obj_id: asc }, { rt_create: asc }]
    ) {
      rule_id
      obj_id
      negated
      rt_create
      removed
      object {
        ...CheckPointGuardObject
      }
    }
    rule_services(
      where: {
        rs_create: { _lte: $importId }
        _or: [{ removed: { _is_null: true } }, { removed: { _gt: $importId } }]
        service: {
          svc_create: { _lte: $importId }
          _or: [{ removed: { _is_null: true } }, { removed: { _gt: $importId } }]
        }
      }
      order_by: [{ svc_id: asc }, { rs_create: asc }]
    ) {
      rule_id
      svc_id
      negated
      rs_create
      removed
      service {
        ...CheckPointGuardService
      }
    }
  }
}

fragment CheckPointGuardService on firewall_nw_service {
  svc_id
  svc_uid
  svc_name
  svc_port
  svc_port_end
  ip_proto_id
  svc_create
  removed
  type: stm_svc_typ {
    name: svc_typ_name
  }
  svcgrp_flats(
    where: {
      import_created: { _lte: $importId }
      _or: [{ removed: { _is_null: true } }, { removed: { _gt: $importId } }]
    }
    order_by: [{ svcgrp_flat_member_id: asc }, { import_created: asc }]
  ) {
    svcgrp_flat_id
    svcgrp_flat_member_id
    negated
    import_created
    removed
    service: serviceBySvcgrpFlatMemberId {
      svc_id
      svc_uid
      svc_name
      svc_port
      svc_port_end
      ip_proto_id
      svc_create
      removed
      type: stm_svc_typ {
        name: svc_typ_name
      }
    }
  }
}

fragment CheckPointGuardObject on firewall_nw_object {
  obj_id
  obj_uid
  obj_name
  obj_ip
  obj_ip_end
  obj_create
  removed
  type: stm_obj_typ {
    name: obj_typ_name
  }
  objgrp_flats(
    where: {
      import_created: { _lte: $importId }
      _or: [{ removed: { _is_null: true } }, { removed: { _gt: $importId } }]
    }
    order_by: [{ objgrp_flat_member_id: asc }, { import_created: asc }]
  ) {
    objgrp_flat_id
    objgrp_flat_member_id
    negated
    import_created
    removed
    object: objectByObjgrpFlatMemberId {
      obj_id
      obj_uid
      obj_name
      obj_ip
      obj_ip_end
      obj_create
      removed
      type: stm_obj_typ {
        name: obj_typ_name
      }
    }
  }
}
