- block: 

  - name: remove local copy of remote config file
    file:
      state: absent
      name: "temp_remote_config_file.json"

  - name: create symlink /usr/local/fworch/etc to /etc/fworch
    file:
      src: "{{ fworch_home }}/etc"
      dest: "/etc/{{ product_name }}"
      state: link

  - name: set config values
    set_fact:
      config_json:
        product_version: "{{ product_version }}"
        fworch_home: "{{ fworch_home }}"
        dotnet_mode: "{{ dotnet_mode }}" 
        api_uri: "https://{{ api_network_listening_ip_address }}:{{ api_web_port }}/api/v1/graphql"
        api_hasura_jwt_alg: "{{ api_hasura_jwt_alg }}"
        middleware_native_uri: "http://{{ middleware_hostname }}:{{ middleware_internal_port }}/"
        middleware_uri: "{{ middleware_uri }}"
        tls_client_certificate: "{{ internalca_client_certificate }}"
        tls_client_private_key: "{{ internalca_client_private_key }}"
        tls_ca_certificate: "{{ internalca_peer_ca_certificate }}"
        remote_addresses: []

  - name: create central conf file by dumping varibale as json file
    copy: 
      content: "{{ config_json | to_nice_json }}" 
      dest: "{{ fworch_conf_file }}"
      owner: "{{ fworch_user }}"
      group: "{{ fworch_group }}"
      mode: "0640"
    when: installation_mode == "new"

  - name: Read existing configuration during upgrade
    slurp:
      src: "{{ fworch_conf_file }}"
    register: existing_config_json
    when: installation_mode == "upgrade"

  # The whole file is rewritten below, so an unparsable original has to be caught
  # with a message naming it. Only the parse is wrapped, so a genuine write
  # failure further down is not mislabelled as a broken config file.
  - name: Parse the existing configuration during upgrade
    block:
      - name: Read the existing configuration into a fact
        set_fact:
          existing_config: "{{ existing_config_json.content | b64decode | from_json }}"
    rescue:
      - name: Report an unreadable existing configuration
        fail:
          msg: >-
            {{ fworch_conf_file }} on {{ inventory_hostname }} is not valid JSON,
            so the TLS identity paths cannot be added to it. Repair or restore the
            file before upgrading; the installer will not overwrite it in this state.
    when: installation_mode == "upgrade"

  - name: Add TLS identity paths during upgrade
    copy:
      content: >-
        {{
          existing_config | combine(
            {
              'tls_client_certificate': internalca_client_certificate,
              'tls_client_private_key': internalca_client_private_key,
              'tls_ca_certificate': internalca_peer_ca_certificate
            }
          ) | to_nice_json
        }}
      dest: "{{ fworch_conf_file }}"
      owner: "{{ fworch_user }}"
      group: "{{ fworch_group }}"
      mode: "0640"
      # The previous configuration is the only record of any hand edit an operator
      # made, and this task replaces the file wholesale.
      backup: true
    # Suppresses the content diff only. Failures stay visible, unlike with no_log:
    # the file holds no secrets today, but dumping an entire config into a --diff
    # or CI log is noise that also invites one to be added unnoticed later.
    diff: false
    when: installation_mode == "upgrade"

  become: true
