- block: 

  - name: remove local copy of remote config file
    file:
      state: absent
      name: "temp_remote_config_file.json"

  - name: create symlink /usr/local/fworch/etc to /etc/fworch
    file:
      src: "{{ fworch_home }}/etc"
      dest: "/etc/{{ product_name }}"
      state: link

  # fworch.json holds a list of strings here (the middleware ignores other values and logs a warning). A comma
  # separated string (e.g. -e login_trusted_client_hosts=ui1,ui2) is accepted and split, a JSON list given as a
  # string (e.g. -e 'login_trusted_client_hosts=["ui1","ui2"]') is parsed.
  - name: parse trusted login client hosts given as a JSON list string
    set_fact:
      login_trusted_client_hosts_value: >-
        {{ login_trusted_client_hosts | from_json
           if login_trusted_client_hosts is string and login_trusted_client_hosts | trim is match('[[]')
           else login_trusted_client_hosts }}

  - name: check the type of the trusted login client hosts
    assert:
      that:
        - login_trusted_client_hosts_value is string or (login_trusted_client_hosts_value is iterable and login_trusted_client_hosts_value is not mapping)
        - login_trusted_client_hosts_value is string or login_trusted_client_hosts_value | reject('string') | reject('number') | list | length == 0
      fail_msg: >-
        login_trusted_client_hosts must be a list of host names or addresses, or a comma separated string of them,
        not {{ login_trusted_client_hosts_value | type_debug }} {{ login_trusted_client_hosts_value }}.
      quiet: true

  - name: normalize the trusted login client hosts to a list of host names
    set_fact:
      login_trusted_client_host_list: >-
        {{ (login_trusted_client_hosts_value.split(',') if login_trusted_client_hosts_value is string else login_trusted_client_hosts_value)
           | map('string') | map('trim') | reject('equalto', '') | unique | list }}

  - name: set config values
    set_fact:
      config_json:
        product_version: "{{ product_version }}"
        fworch_home: "{{ fworch_home }}"
        dotnet_mode: "{{ dotnet_mode }}" 
        # Every endpoint is taken from the inventory derived variable rather than
        # rebuilt here: a second copy of the same expression is how the deployed
        # configuration and the certificate SANs, which are built from those same
        # variables, silently end up describing different endpoints.
        api_uri: "{{ api_uri }}"
        api_hasura_jwt_alg: "{{ api_hasura_jwt_alg }}"
        middleware_native_uri: "{{ middleware_native_uri }}"
        middleware_uri: "{{ middleware_uri }}"
        tls_client_certificate: "{{ internalca_client_certificate }}"
        tls_client_private_key: "{{ internalca_client_private_key }}"
        tls_ca_certificate: "{{ internalca_trust_bundle }}"
        internal_ca_certificate: "{{ internalca_ca_certificate_local }}"
        remote_addresses: []
        login_trusted_client_hosts: "{{ login_trusted_client_host_list }}"

  - name: create central conf file by dumping varibale as json file
    copy: 
      content: "{{ config_json | to_nice_json }}" 
      dest: "{{ fworch_conf_file }}"
      owner: "{{ fworch_user }}"
      group: "{{ fworch_group }}"
      mode: "0640"
    when: installation_mode == "new"

  - name: Read existing configuration during upgrade
    slurp:
      src: "{{ fworch_conf_file }}"
    register: existing_config_json
    when: installation_mode == "upgrade"

  # The whole file is rewritten below, so an unparsable original has to be caught
  # with a message naming it. Only the parse is wrapped, so a genuine write
  # failure further down is not mislabelled as a broken config file.
  - name: Parse the existing configuration during upgrade
    block:
      - name: Read the existing configuration into a fact
        set_fact:
          existing_config: "{{ existing_config_json.content | b64decode | from_json }}"
    rescue:
      - name: Report an unreadable existing configuration
        fail:
          msg: >-
            {{ fworch_conf_file }} on {{ inventory_hostname }} is not valid JSON,
            so the TLS identity paths cannot be added to it. Repair or restore the
            file before upgrading; the installer will not overwrite it in this state.
    when: installation_mode == "upgrade"

  # The endpoint values are derived from the inventory, so they are refreshed
  # rather than carried over: an operator who moves the middleware and upgrades
  # would otherwise keep the old endpoint here, the ui would keep addressing it,
  # and the integration tests read the same file and would agree with it instead
  # of catching the divergence. dotnet_mode is refreshed for the same reason: the
  # systemd units are templated from the inventory variable on every run, so a
  # carried over value makes this file name a build configuration the services do
  # not run from, which is exactly the wrong answer when it is read to diagnose one.
  - name: Add TLS identity paths and refresh derived endpoints during upgrade
    copy:
      content: >-
        {{
          existing_config | combine(
            {
              'tls_client_certificate': internalca_client_certificate,
              'tls_client_private_key': internalca_client_private_key,
              'tls_ca_certificate': internalca_trust_bundle,
              'internal_ca_certificate': internalca_ca_certificate_local,
              'dotnet_mode': config_json.dotnet_mode,
              'api_uri': config_json.api_uri,
              'middleware_uri': config_json.middleware_uri,
              'middleware_native_uri': config_json.middleware_native_uri,
              'login_trusted_client_hosts': config_json.login_trusted_client_hosts
            }
          ) | to_nice_json
        }}
      dest: "{{ fworch_conf_file }}"
      owner: "{{ fworch_user }}"
      group: "{{ fworch_group }}"
      mode: "0640"
      # The previous configuration is the only record of any hand edit an operator
      # made, and this task replaces the file wholesale.
      backup: true
    # Suppresses the content diff only. Failures stay visible, unlike with no_log:
    # the file holds no secrets today, but dumping an entire config into a --diff
    # or CI log is noise that also invites one to be added unnoticed later.
    diff: false
    when: installation_mode == "upgrade"

  become: true
