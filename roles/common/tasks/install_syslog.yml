
- name: install package rsyslog
  package:
    name: "rsyslog"
    state: present
  become: true

# rsyslog only assigns the group of a log file it creates if its runtime user is a member
- name: allow the unprivileged rsyslog user to hand log files to group {{ fworch_log_group }}
  user:
    name: "{{ fworch_log_owner }}"
    groups: "{{ fworch_log_group }}"
    append: true
  become: true
  when: fworch_log_owner != 'root'

- name: create log dir for {{ product_name }} accessible to group {{ fworch_log_group }} only
  file:
    path: "{{ fworch_log_dir }}"
    state: directory
    owner: "{{ fworch_log_owner }}"
    group: "{{ fworch_log_group }}"
    mode: "0750"
  become: true

# fixes the permissions of log files written by previous versions, including rotated ones;
# subdirectories and other files in the log dir are not written by rsyslog and are left alone
- name: find the log files rsyslog has written to {{ fworch_log_dir }}
  find:
    paths: "{{ fworch_log_dir }}"
    patterns: "{{ fworch_log_file_patterns }}"
    file_type: file
    hidden: true
  register: fworch_existing_log_files
  become: true

- name: restrict the existing log files to group {{ fworch_log_group }}
  file:
    path: "{{ item.path }}"
    owner: "{{ fworch_log_owner }}"
    group: "{{ fworch_log_group }}"
    mode: "{{ fworch_log_file_mode }}"
  loop: "{{ fworch_existing_log_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true

# no component sends syslog over the network, all log locally; earlier versions opened an unauthenticated
# network receiver on all interfaces here, through which anyone could forge audit and alert log entries
- name: remove the network syslog receiver added to rsyslog by earlier versions
  blockinfile:
    path: /etc/rsyslog.conf
    state: absent
  become: true

