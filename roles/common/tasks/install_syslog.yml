- name: edit rsyslog to include fworch file logging
  blockinfile:
    path: "/etc/rsyslog.d/30-{{ product_name }}.conf"
    create: true
    block: |
      # syslog for {{ product_name }}; Log {{ product_name }} log messages to file

      # change date format to ISO and contain timezone and remove process id
      template(name="fworch" type="list") {
        property(name="timereported" dateFormat="rfc3339")
        constant(value=" ") property(name="hostname")
        constant(value=" ") property(name="programname")
        constant(value=": ")
        property(name="msg" spifno1stsp="on")
        property(name="msg" droplastlf="on")
        constant(value="\n")
      }

      # program name and message text are chosen by the sender, so only messages of local inputs are routed:
      # a network input enabled by other configuration must not write into the {{ product_name }} logs
      if ($inputname == 'imuxsock' or $inputname == 'imjournal') then {
        if $programname == '{{ product_name }}-database' then action(type="omfile" file="{{ fworch_log_dir }}/database.log" {{ fworch_omfile_params }})
        if $programname == '{{ middleware_server_syslog_id }}' then action(type="omfile" file="{{ fworch_log_dir }}/middleware.log" {{ fworch_omfile_params }})
        if $programname == '{{ ui_syslog_id }}' then action(type="omfile" file="{{ fworch_log_dir }}/ui.log" {{ fworch_omfile_params }})
        if $programname == '{{ ldap_syslog_id }}' then action(type="omfile" file="{{ fworch_log_dir }}/ldap.log" {{ fworch_omfile_params }})
        if $programname == '{{ product_name }}-api' then action(type="omfile" file="{{ fworch_log_dir }}/api.log" {{ fworch_omfile_params }})
        if $programname startswith '{{ product_name }}-importer-api' then action(type="omfile" file="{{ fworch_log_dir }}/importer-api.log" {{ fworch_omfile_params }})
        if $programname startswith '{{ product_name }}' and $msg contains "Audit" then action(type="omfile" file="{{ fworch_log_dir }}/audit.log" {{ fworch_omfile_params }})
        if $programname startswith '{{ product_name }}' and $msg contains "FWORCHAlert" then action(type="omfile" file="{{ fworch_log_dir }}/alert.log" {{ fworch_omfile_params }})
        if $programname == 'import-fworch-app-data' then action(type="omfile" file="{{ fworch_log_dir }}/import-fworch-app-data.log" {{ fworch_omfile_params }})
      }
  vars:
    # set per action: legacy $File* directives would leak into the distribution's own log files
    fworch_omfile_params: >-
      template="fworch" fileOwner="{{ fworch_log_owner }}" fileGroup="{{ fworch_log_group }}"
      fileCreateMode="{{ fworch_log_file_mode }}"
  become: true

- name: edit logrotate
  blockinfile:
    path: "/etc/logrotate.d/{{ product_name }}"
    create: true
    block: |
      {{ fworch_log_dir }}/middleware.log {
          compress
          maxage 7
          rotate 99
          maxsize 4096k
          missingok
          copytruncate
          sharedscripts
              prerotate
                {{ fworch_home }}/scripts/acquire_lock.py {{ fworch_mw_lockfile }} >/dev/null 2>&1
              endscript
              postrotate
                {{ fworch_home }}/scripts/release_lock.py {{ fworch_mw_lockfile }} >/dev/null 2>&1
              endscript
      }

      {{ fworch_log_dir }}/ui.log {
          compress
          maxage 7
          rotate 99
          maxsize 4096k
          missingok
          copytruncate
          sharedscripts
              prerotate
                {{ fworch_home }}/scripts/acquire_lock.py {{ fworch_ui_lockfile }} >/dev/null 2>&1
              endscript
              postrotate
                {{ fworch_home }}/scripts/release_lock.py {{ fworch_ui_lockfile }} >/dev/null 2>&1
              endscript
      }

      {{ fworch_log_dir }}/database.log 
      {{ fworch_log_dir }}/ldap.log 
      {{ fworch_log_dir }}/api.log 
      {{ fworch_log_dir }}/importer-api.log {
          compress
          maxage 7
          rotate 99
          maxsize 4096k
          missingok
          copytruncate
          sharedscripts
              prerotate
                {{ fworch_home }}/scripts/acquire_lock.py {{ fworch_api_importer_lockfile }} >/dev/null 2>&1
              endscript
              postrotate
                {{ fworch_home }}/scripts/release_lock.py {{ fworch_api_importer_lockfile }} >/dev/null 2>&1
              endscript
      }
      {{ fworch_log_dir }}/audit.log 
      {{ fworch_log_dir }}/alert.log 
      {
          compress
          maxage 7
          rotate 99
          maxsize 4096k
          missingok
          copytruncate
      }

  become: true

- name: reload rsyslog service and make it start at host startup
  service:
    name: "rsyslog"
    state: restarted
    enabled: true
  become: true
