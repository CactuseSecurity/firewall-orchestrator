
- name: install package rsyslog
  package:
    name: "rsyslog"
    state: present
  become: true

# rsyslog only assigns the group of a log file it creates if its runtime user is a member
- name: allow the unprivileged rsyslog user to hand log files to group {{ fworch_log_group }}
  user:
    name: "{{ fworch_log_owner }}"
    groups: "{{ fworch_log_group }}"
    append: true
  become: true
  when: fworch_log_owner != 'root'

# also fixes the permissions of log files written by previous versions, including rotated ones
- name: create log dir for {{ product_name }} and restrict all log files to group {{ fworch_log_group }}
  file:
    path: "{{ fworch_log_dir }}"
    state: directory
    recurse: true
    owner: "{{ fworch_log_owner }}"
    group: "{{ fworch_log_group }}"
    mode: "u=rwX,g=rX,o="
  become: true

- name: change rsyslog config to receive logs
  blockinfile:
    path: /etc/rsyslog.conf
    block: |
      module(load="im{{ syslog_proto }}")
      input(type="im{{ syslog_proto }}" port="{{ syslog_port }}")
  become: true

