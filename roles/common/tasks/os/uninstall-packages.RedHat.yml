---
- name: uninstall all packages for {{ product_name }}, keeping git and ansible
  package:
    state: absent
    name: "{{ item }}"
  loop:
    - rsyslog
    - "{{ webserver_package_name }}"
    - gnupg2
    - dnf-plugins-core
    - software-properties-common
    - npm
    - python3-pip
    - python3-virtualenv
    - python3-psycopg2
    - "{{ postgresql_c_client_library_header_files }}"
    - "{{ postgresql_package }}"
    - "{{ postgresql_c_client_library_header_files }}"
    - postgresql
    - openldap-clients
    - openldap-servers
    - openldap
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - podman
    - "dotnet-sdk-{{ dotnet_version }}"
    - make
    - "{{ postgresql_dev_package }}"
    - "{{ postgresql_test_package }}"
    - "{{ webserver_package_name }}"
  when: wipe_packages is defined and wipe_packages|bool
  become: true

- name: check for a script based dotnet installation on RedHat
  stat:
    path: "{{ dotnet_script_install_marker }}"
  register: dotnet_script_install_marker_check
  become: true

# a dotnet installed from an rpm uses the same directory and is owned by the package manager,
# so only an installation carrying the marker written by the dotnet-install script is removed
- name: remove script based dotnet installation on RedHat
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ dotnet_script_install_dir }}"
    - "{{ dotnet_binary_link }}"
  when:
    - wipe_packages is defined and wipe_packages|bool
    - dotnet_script_install_marker_check.stat.exists
  become: true

- name: uninstall openldap on RedHat
  package:
    state: absent
    name: openldap-servers
  become: true
