- name: define RedHat packages that may require external repository enablement
  set_fact:
    redhat_repo_policy_packages: >-
      {{
        (
          (
            ['openldap-servers', 'python3-pyOpenSSL']
            + middleware_ldap_packages
            + middleware_crypto_packages
            if inventory_hostname in (groups['middlewareserver'] | default([]))
            else []
          )
          +
          (
            python_venv_package_name
            if inventory_hostname in (groups['importers'] | default([]))
            else []
          )
        ) | unique
      }}

# Package availability is authoritative because hardened hosts can expose EPEL or CodeReady
# content through internal repositories with arbitrary IDs and without an epel-release package.
- name: check required RedHat packages before optional repository changes
  command: "dnf list {{ item }}"
  loop: "{{ redhat_repo_policy_packages }}"
  register: redhat_repo_policy_initial_package_checks
  changed_when: false
  failed_when: false
  environment: "{{ proxy_env }}"
  become: true
  when: allowRepoChangesForRedhat | default(false) | bool

- name: optionally enable required RedHat repositories
  block:
    - name: list enabled RedHat repositories via dnf
      command: dnf repolist --enabled
      register: redhat_enabled_repos
      changed_when: false
      failed_when: false
      become: true

    - name: detect enabled standard RedHat dependency repositories
      set_fact:
        redhat_epel_repo_enabled: "{{ redhat_enabled_repos.stdout is search('(?m)^epel(?:\\s|$)') }}"
        redhat_codeready_repo_enabled: "{{ redhat_enabled_repos.stdout is search('(?m)^(codeready-builder-for-rhel-' ~ redhat_major_version ~ '-[^\\s]+-rpms|crb)(?:\\s|$)') }}"

    - name: optionally install EPEL when no EPEL repository is enabled
      block:
        - name: check if EPEL release package is installed
          command: rpm -q epel-release
          register: epel_release_check
          changed_when: false
          failed_when: false

        - name: check if EPEL release package is available from configured repositories
          command: dnf list --available epel-release
          register: epel_release_repo_check
          changed_when: false
          failed_when: false
          environment: "{{ proxy_env }}"
          become: true
          when: epel_release_check.rc != 0

        - name: install EPEL release package from configured repositories
          ansible.builtin.dnf:
            name: epel-release
            state: present
          register: redhat_epel_release_repo_install
          environment: "{{ proxy_env }}"
          become: true
          when:
            - epel_release_check.rc != 0
            - epel_release_repo_check.rc | default(1) == 0

        - name: install EPEL release package from Fedora RPM fallback
          block:
            - name: fetch EPEL release package
              get_url:
                url: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ redhat_major_version }}.noarch.rpm"
                dest: "/tmp/epel-release-latest-{{ redhat_major_version }}.noarch.rpm"
              environment: "{{ proxy_env }}"

            - name: import EPEL GPG key
              rpm_key:
                state: present
                key: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ redhat_major_version }}"
              environment: "{{ proxy_env }}"

            - name: add EPEL repos
              yum:
                name: "/tmp/epel-release-latest-{{ redhat_major_version }}.noarch.rpm"
                state: present
              register: redhat_epel_release_fallback_install

            - name: remove file EPEL repo
              file:
                name: "/tmp/epel-release-latest-{{ redhat_major_version }}.noarch.rpm"
                state: absent
          become: true
          when:
            - epel_release_check.rc != 0
            - epel_release_repo_check.rc | default(1) != 0
      when: not redhat_epel_repo_enabled | bool

    - name: install RedHat repository management tools
      package:
        name:
          - subscription-manager
          - dnf-plugins-core
        state: present
      become: true

    - name: list RedHat repos via subscription-manager
      command: subscription-manager repos --list
      register: redhat_subscription_repos
      changed_when: false
      failed_when: false
      environment: "{{ proxy_env }}"
      become: true

    - name: list RedHat repos via dnf
      command: dnf repolist all
      register: redhat_dnf_repos
      changed_when: false
      failed_when: false
      become: true

    - name: detect CodeReady Builder repo ID
      set_fact:
        redhat_codeready_repo_id: >-
          {{
            (
              redhat_subscription_repos.stdout
              | regex_findall('(?m)^Repo ID:\\s+(codeready-builder-for-rhel-' ~ redhat_major_version ~ '-[^\\s]+-rpms)$')
              | first
            ) | default('')
          }}

    - name: enable CodeReady Builder via subscription manager
      rhsm_repository:
        name: "{{ redhat_codeready_repo_id }}"
      register: redhat_codeready_repo_enable
      environment: "{{ proxy_env }}"
      become: true
      when:
        - not redhat_codeready_repo_enabled | bool
        - redhat_codeready_repo_id | length > 0

    - name: enable CRB via dnf config-manager fallback
      command: dnf config-manager --set-enabled crb
      register: redhat_crb_repo_enable
      become: true
      when:
        - not redhat_codeready_repo_enabled | bool
        - redhat_codeready_repo_id | length == 0
        - redhat_dnf_repos.stdout is search('(?m)^crb\\s')

    - name: show CodeReady Builder detection result
      debug:
        msg: "No CodeReady Builder repository ID detected via subscription-manager or dnf. Continuing without enabling it."
      when:
        - not redhat_codeready_repo_enabled | bool
        - redhat_codeready_repo_id | length == 0
        - redhat_dnf_repos.stdout is not search('(?m)^crb\\s')

    - name: detect whether the installer changed RedHat repositories
      set_fact:
        redhat_repo_changes_made: >-
          {{
            (redhat_epel_release_repo_install | default({})).get('changed', false)
            or (redhat_epel_release_fallback_install | default({})).get('changed', false)
            or (redhat_codeready_repo_enable | default({})).get('changed', false)
            or (redhat_crb_repo_enable | default({})).get('changed', false)
          }}

    # Refresh only after this installer changed repository configuration. Hardened hosts own
    # their repository metadata lifecycle when repository changes are disabled or unnecessary.
    - name: update operating system package cache after RedHat repository changes
      ansible.builtin.dnf:
        update_cache: true
      environment: "{{ proxy_env }}"
      become: true
      when: redhat_repo_changes_made | bool
  when:
    - allowRepoChangesForRedhat | default(false) | bool
    - redhat_repo_policy_initial_package_checks.results | default([]) | selectattr('rc', 'ne', 0) | list | length > 0

# The packages below are installed by later roles, but several of them normally live in
# CodeReady Builder/CRB or EPEL. The actual package result, not a repository ID, decides whether
# the configured repositories satisfy the installation policy.

- name: check RedHat packages that may require external repository enablement
  command: "dnf list {{ item }}"
  loop: "{{ redhat_repo_policy_packages }}"
  register: redhat_repo_policy_package_checks
  changed_when: false
  failed_when: false
  environment: "{{ proxy_env }}"
  become: true

- name: fail when required RedHat packages are unavailable
  fail:
    msg:
      - "Required RedHat packages are not installed or available from the currently enabled repositories: {{ redhat_repo_policy_package_checks.results | default([]) | selectattr('rc', 'ne', 0) | map(attribute='item') | join(', ') }}."
      - "Enable the required RedHat repositories outside the FWORCH installer according to your OS repository policy, then rerun the installer."
      - "Alternatively set -e allowRepoChangesForRedhat=true to allow the FWORCH installer to install/enable required RedHat repositories."
  when: redhat_repo_policy_package_checks.results | default([]) | selectattr('rc', 'ne', 0) | list | length > 0

- name: setting default locale in /etc/profile
  blockinfile:
    path: /etc/profile
    block: >
      export LANG="en_US.utf8"
      export LANGUAGE="en_US.utf8"
      export LC_ALL="en_US.utf8"
  become: true
