---
# this script will uninstall all fworch components from all hosts in the chosen inventory
# call with:
# sudo ansible-playbook/ scripts/uninstall-fworch.yml -K [-e "wipe_packages=yes"]
# parameters:
# wipe_packages=yes    removes all packages potentially installed during fworch installation
#                      NB: this might break other applications running on the same system
#
# caveat: run this script with "wipe_packages" switch only if you are on an fworch-exclusive system

- name: stop Podman container
  command: podman stop fworch-api
  ignore_errors: true

- name: remove Podman container
  command: podman rm fworch-api
  ignore_errors: true

- name: stop legacy Docker container
  command: docker stop fworch-api
  ignore_errors: true

- name: remove legacy Docker container
  command: docker rm fworch-api
  ignore_errors: true

- name: include uninstall tasks for current OS family
  include_tasks: "os/uninstall.{{ ansible_facts['os_family'] }}.yml"

- name: find out installed postgres version
  script: "scripts/get_pg_version.sh"
  register: pg_version_result
  changed_when: false

- name: set fact pg_version
  set_fact:
    pg_version: "{{ pg_version_result.stdout }}"
  ignore_errors: true

- set_fact:
    postgresql_dev_package: "{{ postgresql_dev_package_prefix }}-{{ pg_version }}"
  ignore_errors: true

# postgres operations with postgres user and ignoring errors
- block:
    - name: remove database pre pg_version 13
      postgresql_db:
        name: fworchdb
        state: absent
      register: drop_db
      when: pg_version|int < 13

    - name: remove database for pg_version starting from 13
      command: psql -c 'drop database if exists fworchdb with ( force )'
      register: drop_db
      when: pg_version|int >= 13

    - name: check if db still exists
      postgresql_query:
        db: "{{ fworch_db_name }}"
        query: "select exists(SELECT datname FROM pg_catalog.pg_database WHERE lower(datname) = lower('fworchdb'))"
      register: db_exists

    - name: fail when db still exists
      fail:
        msg: database could not be dropped {{ drop_db.msg }}. Try to stop all sessions connected to the database before running uninstall again.
      when: db_exists|bool

    - name: remove db groups
      postgresql_user:
        name: "{{ item }}"
        state: absent
      loop: "{{ database_groups }}"

    - name: remove db users
      postgresql_user:
        name: "{{ item }}"
        state: absent
      loop: "{{ database_users }}"

  become: true
  become_user: postgres
  ignore_errors: true

- name: stop and disable {{ product_name }}-ui
  service:
    name: "{{ product_name }}-ui"
    state: stopped
    enabled: no
  ignore_errors: true

- name: stop and disable {{ product_name }}-middleware
  service:
    name: "{{ product_name }}-middleware"
    state: stopped
    enabled: no
  ignore_errors: true

- name: stop and disable {{ product_name }}-importer-api
  service:
    name: "{{ product_name }}-importer-api"
    state: stopped
    enabled: no
  ignore_errors: true

- name: stop and disable current Hasura API service
  service:
    name: "{{ api_service_name }}"
    state: stopped
    enabled: no
  ignore_errors: true

- name: stop and disable legacy Hasura API services
  service:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop: "{{ api_legacy_service_names | default([]) }}"
  ignore_errors: true

- name: Remove internal CA from Debian trust store
  file:
    path: "/usr/local/share/ca-certificates/{{ internalca_ca_trust_anchor }}"
    state: absent
  register: internalca_debian_ca_anchor_removed
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Remove configured peer CA from Debian trust store
  file:
    path: "/usr/local/share/ca-certificates/{{ internalca_peer_ca_trust_anchor }}"
    state: absent
  register: internalca_debian_peer_ca_anchor_removed
  become: true
  when: ansible_facts['os_family'] == 'Debian'

# --fresh, and unconditional. Deciding this on whether *this* run removed an anchor loses the
# refresh for good as soon as one is removed without it: the extracted copy in /etc/ssl/certs and
# its hash link outlive the anchor they were derived from, the next uninstall finds the source
# already gone and reports no change, and the host is left with a dangling FWO anchor in its trust
# store forever. --fresh is what reconciles the extracted store with the sources rather than only
# adding to it, and on an uninstall there is nothing left to preserve by being incremental.
- name: Refresh Debian CA trust store after removing FWO CA certificates
  command: update-ca-certificates --fresh
  changed_when: false
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Remove internal CA from RedHat trust store
  file:
    path: "/etc/pki/ca-trust/source/anchors/{{ internalca_ca_trust_anchor }}"
    state: absent
  register: internalca_redhat_ca_anchor_removed
  become: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Remove configured peer CA from RedHat trust store
  file:
    path: "/etc/pki/ca-trust/source/anchors/{{ internalca_peer_ca_trust_anchor }}"
    state: absent
  register: internalca_redhat_peer_ca_anchor_removed
  become: true
  when: ansible_facts['os_family'] == 'RedHat'

# Unconditional for the same reason as the Debian refresh above; "extract" already rebuilds the
# whole extracted store from the configured sources, so it needs no equivalent of --fresh.
- name: Refresh RedHat CA trust store after removing FWO CA certificates
  command: update-ca-trust extract
  changed_when: false
  become: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Look for the preserved ldap client defaults
  stat:
    path: "{{ openldap_client_config_backup }}"
  register: openldap_client_config_saved
  become: true

- name: Read the ldap client defaults before removing {{ product_name }}
  slurp:
    src: "{{ openldap_client_config }}"
  register: openldap_client_config_removal_content
  failed_when: false
  become: true

# The rendered file points TLS_CACERT at the trust bundle below {{ fworch_home }}, which this
# uninstall deletes, and libldap treats a CA file it cannot read as fatal - so leaving it behind
# breaks every LDAP TLS client on the host with a bare "No such file or directory", FWO's own or
# not, and no FWO release re-renders the file to repair it. Where the installer preserved the
# distribution's copy it goes back; where it could not, the rendered file is removed and libldap
# falls back to its built-in defaults until the package manager restores the conffile. A file
# without the marker was never FWO's and is left untouched.
- name: Restore the ldap client defaults that predate {{ product_name }}
  copy:
    src: "{{ openldap_client_config_backup }}"
    dest: "{{ openldap_client_config }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  become: true
  when: openldap_client_config_saved.stat.exists

- name: Remove the preserved ldap client defaults once they are restored
  file:
    path: "{{ openldap_client_config_backup }}"
    state: absent
  become: true
  when: openldap_client_config_saved.stat.exists

- name: Remove the ldap client defaults {{ product_name }} rendered
  file:
    path: "{{ openldap_client_config }}"
    state: absent
  become: true
  when:
    - not openldap_client_config_saved.stat.exists
    - openldap_client_config_removal_content.content is defined
    - openldap_client_config_marker in (openldap_client_config_removal_content.content | b64decode)

- name: include uninstall package tasks for current OS family
  include_tasks: "os/uninstall-packages.{{ ansible_facts['os_family'] }}.yml"

- block:
    - name: remove {{ product_name }} dirs and files
      file:
        name: "{{ item }}"
        state: absent
      loop:
        - "{{ fworch_home }}"
        - /etc/{{ product_name }}
        - "{{ http_conf_dir }}{{ product_name }}-ui.conf"
        - "{{ http_conf_dir }}{{ product_name }}-api.conf"
        - "{{ http_conf_dir }}{{ product_name }}-mw.conf"
        - "{{ http_conf_dir }}{{ product_name }}-maintenance.conf"
        - /etc/apache2/sites-enabled/{{ product_name }}-ui.conf
        - /etc/apache2/sites-enabled/{{ product_name }}-api.conf
        - /etc/apache2/sites-enabled/{{ product_name }}-mw.conf
        - /etc/apache2/sites-enabled/{{ product_name }}-maintenance.conf
        - /var/lib/ldap/{{ product_name }}.internal
        - /var/lib/ldap/example.com
        - /var/lib/pgsql/data
        - "{{ api_hasura_cli_bin }}"
        - "{{ api_env_file }}"
        - /var/{{ product_name }}
        - /var/log/{{ product_name }}
      ignore_errors: true

    - name: remove {{ product_name }} systemd unit files
      file:
        path: "{{ item.0 }}/{{ item.1 }}.service"
        state: absent
      loop: "{{ fworch_systemd_unit_search_dirs | product(fworch_systemd_unit_names) | list }}"
      loop_control:
        label: "{{ item.0 }}/{{ item.1 }}.service"
      ignore_errors: true

    - name: remove {{ product_name }} systemd drop-in directories
      file:
        path: "{{ item.0 }}/{{ item.1 }}.service.d"
        state: absent
      loop: "{{ fworch_systemd_unit_search_dirs | product(fworch_systemd_unit_names) | list }}"
      loop_control:
        label: "{{ item.0 }}/{{ item.1 }}.service.d"
      ignore_errors: true

    - name: reload systemd after removing {{ product_name }} unit files
      systemd:
        daemon_reload: true
      ignore_errors: true

    # drops any leftover failed state of the removed units so systemctl stays clean
    - name: clear systemd state of removed {{ product_name }} services
      command: "systemctl reset-failed {{ item }}.service"
      loop: "{{ fworch_systemd_unit_names }}"
      changed_when: false
      failed_when: false

    - name: remove OS users and delete home directories
      user:
        name: "{{ item }}"
        force: yes
        remove: yes
        state: absent
      loop:
        - "{{ fworch_user }}"
        - "fworchsample"

    - name: remove OS group
      group:
        name: "{{ fworch_group }}"
        state: absent

    # ssh-keygen -f "/usr/local/fworch/.ssh/known_hosts" -R "localhost"
    - name: remove known host key
      known_hosts:
        name: "localhost"
        path: "{{ fworch_home }}/.ssh/known_hosts"
        state: absent

  become: yes
