---
# this script will uninstall all fworch components from all hosts in the chosen inventory
# call with:
# sudo ansible-playbook/ scripts/uninstall-fworch.yml -K [-e "wipe_packages=yes"]
# parameters:
# wipe_packages=yes    removes all packages potentially installed during fworch installation
#                      NB: this might break other applications running on the same system
#
# caveat: run this script with "wipe_packages" switch only if you are on an fworch-exclusive system

- name: stop Podman container
  command: podman stop fworch-api
  ignore_errors: true

- name: remove Podman container
  command: podman rm fworch-api
  ignore_errors: true

- name: stop legacy Docker container
  command: docker stop fworch-api
  ignore_errors: true

- name: remove legacy Docker container
  command: docker rm fworch-api
  ignore_errors: true

- name: include uninstall tasks for current OS family
  include_tasks: "os/uninstall.{{ ansible_facts['os_family'] }}.yml"

- name: find out installed postgres version
  script: "scripts/get_pg_version.sh"
  register: pg_version_result
  changed_when: false

- name: set fact pg_version
  set_fact:
    pg_version: "{{ pg_version_result.stdout }}"
  ignore_errors: true

- set_fact:
    postgresql_dev_package: "{{ postgresql_dev_package_prefix }}-{{ pg_version }}"
  ignore_errors: true

# postgres operations with postgres user and ignoring errors
- block:
    - name: remove database pre pg_version 13
      postgresql_db:
        name: fworchdb
        state: absent
      register: drop_db
      when: pg_version|int < 13

    - name: remove database for pg_version starting from 13
      command: psql -c 'drop database if exists fworchdb with ( force )'
      register: drop_db
      when: pg_version|int >= 13

    - name: check if db still exists
      postgresql_query:
        db: "{{ fworch_db_name }}"
        query: "select exists(SELECT datname FROM pg_catalog.pg_database WHERE lower(datname) = lower('fworchdb'))"
      register: db_exists

    - name: fail when db still exists
      fail:
        msg: database could not be dropped {{ drop_db.msg }}. Try to stop all sessions connected to the database before running uninstall again.
      when: db_exists|bool

    - name: remove db groups
      postgresql_user:
        name: "{{ item }}"
        state: absent
      loop: "{{ database_groups }}"

    - name: remove db users
      postgresql_user:
        name: "{{ item }}"
        state: absent
      loop: "{{ database_users }}"

  become: true
  become_user: postgres
  ignore_errors: true

- name: stop and disable {{ product_name }}-ui
  service:
    name: "{{ product_name }}-ui"
    state: stopped
    enabled: no
  ignore_errors: true

- name: stop and disable {{ product_name }}-middleware
  service:
    name: "{{ product_name }}-middleware"
    state: stopped
    enabled: no
  ignore_errors: true

- name: stop and disable {{ product_name }}-importer-api
  service:
    name: "{{ product_name }}-importer-api"
    state: stopped
    enabled: no
  ignore_errors: true

- name: stop and disable current Hasura API service
  service:
    name: "{{ api_service_name }}"
    state: stopped
    enabled: no
  ignore_errors: true

- name: stop and disable legacy Hasura API services
  service:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop: "{{ api_legacy_service_names | default([]) }}"
  ignore_errors: true

- name: include uninstall package tasks for current OS family
  include_tasks: "os/uninstall-packages.{{ ansible_facts['os_family'] }}.yml"

- block:
    # the sdk itself lives in {{ dotnet_script_install_dir }} below {{ fworch_home }} and is
    # removed with it, but the link into it has to be cleaned up separately. a link pointing
    # anywhere else belongs to a package or to a manual installation and is left alone.
    - name: check where {{ dotnet_binary_link }} points
      stat:
        path: "{{ dotnet_binary_link }}"
        follow: false
      register: dotnet_binary_link_check
      ignore_errors: true

    - name: remove the {{ product_name }} dotnet symlink
      file:
        path: "{{ dotnet_binary_link }}"
        state: absent
      when:
        - dotnet_binary_link_check.stat.islnk | default(false)
        - (dotnet_binary_link_check.stat.lnk_target | default('')) == (dotnet_script_install_dir ~ '/dotnet')
      ignore_errors: true

    - name: remove {{ product_name }} dirs and files
      file:
        name: "{{ item }}"
        state: absent
      loop:
        - "{{ fworch_home }}"
        - /etc/{{ product_name }}
        - "{{ http_conf_dir }}{{ product_name }}-ui.conf"
        - "{{ http_conf_dir }}{{ product_name }}-api.conf"
        - "{{ http_conf_dir }}{{ product_name }}-mw.conf"
        - "{{ http_conf_dir }}{{ product_name }}-maintenance.conf"
        - /etc/apache2/sites-enabled/{{ product_name }}-ui.conf
        - /etc/apache2/sites-enabled/{{ product_name }}-api.conf
        - /etc/apache2/sites-enabled/{{ product_name }}-mw.conf
        - /etc/apache2/sites-enabled/{{ product_name }}-maintenance.conf
        - /var/lib/ldap/{{ product_name }}.internal
        - /var/lib/ldap/example.com
        - /var/lib/pgsql/data
        - "{{ api_hasura_cli_bin }}"
        - "{{ api_env_file }}"
        - /var/{{ product_name }}
        - /var/log/{{ product_name }}
      ignore_errors: true

    - name: remove {{ product_name }} systemd unit files
      file:
        path: "{{ item.0 }}/{{ item.1 }}.service"
        state: absent
      loop: "{{ fworch_systemd_unit_search_dirs | product(fworch_systemd_unit_names) | list }}"
      loop_control:
        label: "{{ item.0 }}/{{ item.1 }}.service"
      ignore_errors: true

    - name: remove {{ product_name }} systemd drop-in directories
      file:
        path: "{{ item.0 }}/{{ item.1 }}.service.d"
        state: absent
      loop: "{{ fworch_systemd_unit_search_dirs | product(fworch_systemd_unit_names) | list }}"
      loop_control:
        label: "{{ item.0 }}/{{ item.1 }}.service.d"
      ignore_errors: true

    - name: reload systemd after removing {{ product_name }} unit files
      systemd:
        daemon_reload: true
      ignore_errors: true

    # drops any leftover failed state of the removed units so systemctl stays clean
    - name: clear systemd state of removed {{ product_name }} services
      command: "systemctl reset-failed {{ item }}.service"
      loop: "{{ fworch_systemd_unit_names }}"
      changed_when: false
      failed_when: false

    - name: remove OS users and delete home directories
      user:
        name: "{{ item }}"
        force: yes
        remove: yes
        state: absent
      loop:
        - "{{ fworch_user }}"
        - "fworchsample"

    - name: remove OS group
      group:
        name: "{{ fworch_group }}"
        state: absent

    # ssh-keygen -f "/usr/local/fworch/.ssh/known_hosts" -R "localhost"
    - name: remove known host key
      known_hosts:
        name: "localhost"
        path: "{{ fworch_home }}/.ssh/known_hosts"
        state: absent

  become: yes
