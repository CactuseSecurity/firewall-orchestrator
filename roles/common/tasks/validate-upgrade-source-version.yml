---
# Refuses an upgrade whose source version needs upgrade steps this repository no longer
# carries (see minimum_upgrade_source_version in inventory/group_vars/all.yml):
# - 9.5.0 removed every database upgrade file below 8.0, and
#   roles/database/tasks/upgrade-database.yml selects the files it *finds* above the
#   installed version, not the files that version actually needs. A 7.x source would
#   therefore silently skip the migrations it is still missing, run the 8.x and 9.x ones on
#   top of a schema that never got them, and end up without columns the Hasura metadata and
#   the C# clients read - having already mutated the installation on the way there.
# - the move of the Hasura API from Docker to Podman (9.0.16) is no longer carried out, so a
#   source below 9.0.16 would keep its Docker container on the API port.
# An unsupported source version has to be rejected before the first change, which is why
# this lives in roles/common and not in the database or API role.
#
# In its own file so roles/tests-integration drives this code rather than a copy of it.
#
# Inputs:
#   upgrade_source_version         - the product version currently installed (required)
#   minimum_upgrade_source_version - the oldest version an upgrade may start from
#   minimum_upgrade_source_release - a release that still carries the removed upgrade
#                                    steps, for the two step path
# Output: nothing, or a failure naming the installed version and the way out.

- name: Refuse to upgrade from a product version whose upgrade steps were removed
  fail:
    msg: >-
      This host runs {{ product_name }} {{ upgrade_source_version }}, and an upgrade
      starting below {{ product_name }} {{ minimum_upgrade_source_version }} is not
      supported any more: upgrade steps that {{ upgrade_source_version }} still needs
      (database migrations, the move of the API from Docker to Podman) have been removed,
      so this upgrade would leave the database or the API in a state the
      {{ product_name }} services cannot work with.
      Nothing has been changed - the upgrade stopped before the database role ran.
      Upgrade in two steps instead: check out
      {{ minimum_upgrade_source_release }} ("git checkout {{ minimum_upgrade_source_release }}"),
      upgrade this host with that checkout, then return to this version and upgrade again.
      See documentation/installer/server-upgrade.md.
  when: upgrade_source_version is version(minimum_upgrade_source_version, '<')
