<VirtualHost *:80>
	ServerName {{ ui_server_name }}:80
	ServerAdmin {{ server_admin }}
{% if ui_server_alias | length > 0 %}
	ServerAlias {{ ui_server_alias }}
{% endif %}
	Timeout {{ apache_ui_timeout }}

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^(.*)$
    RewriteCond %{REQUEST_URI} !^/$
    RewriteCond %{REQUEST_URI} !^/men-at-work.png$
    RewriteRule ^(.*)$ / [R=301,L]

	ErrorLog /var/log/{{ webserver_package_name }}/error.log
	TransferLog /var/log/{{ webserver_package_name }}/access.log
</VirtualHost>

# https vhost:
<VirtualHost *:{{ ui_web_port }}>
	ServerName {{ ui_server_name }}:{{ ui_web_port }}
	ServerAdmin {{ server_admin }}
{% if ui_server_alias | length > 0 %}
	ServerAlias {{ ui_server_alias }}
{% endif %}
	Timeout {{ apache_ui_timeout }}
	DocumentRoot /var/www/html

	ErrorLog /var/log/{{ webserver_package_name }}/maint_error.log
	TransferLog /var/log/{{ webserver_package_name }}/maint_access.log
	CustomLog /var/log/{{ webserver_package_name }}/maint_ssl_request_log "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"
	SSLEngine on
	{{ apache_ssl_protocol }}
	{{ apache_ssl_cipher_suite }}
{# Four spaces, not the tab the directives around this one use: roles/internalCA
   rewrites these two lines with lineinfile after ownership detection has selected
   the identity, and writes them with four spaces. Indenting them differently here
   makes that rewrite report a change on every upgrade, and reload Apache for it,
   even when the path it writes is the one already there. #}
    SSLCertificateFile {{ maintenance_apache_certificate }}
    SSLCertificateKeyFile {{ maintenance_apache_private_key }}

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^(.*)$
    RewriteCond %{REQUEST_URI} !^/$
    RewriteCond %{REQUEST_URI} !^/men-at-work.png$
    RewriteRule ^(.*)$ / [R=301,L]

    # --- Security Headers ---
<IfModule mod_headers.c>
{% for header in apache_security_headers %}
    {{ header }}
{% endfor %}
</IfModule>

</VirtualHost>
