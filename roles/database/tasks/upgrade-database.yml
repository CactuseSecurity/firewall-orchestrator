# install all upgrades between running version and version currently being installed

- name: guard - stop when trying anything but an upgrade with existing database
  fail:
      msg: "Error: You chose upgrade on a system without existing database {{ fworch_db_name }}"
  when: db_exists.query_result.0.count == 0

- name: create upgrade dir
  file:
      path: "{{ database_install_dir }}/upgrade"
      state: directory
      owner: "{{ fworch_user }}"
      group: "{{ postgres_group }}"
      # postgres user needs to traverse the dir regardless of system umask
      mode: "0750"
  become: true

- set_fact:
      installed_version: "{{ old_version }}"
      current_version: "{{ product_version }}"
      all_upgrades_available: "{{ lookup('fileglob', 'upgrade/*.sql') }}"
      upgrade_files: []

- name: set list of relevant upgrade files (without extension)
  set_fact:
      upgrade_files: "{{ upgrade_files + [ item | basename | splitext | first | regex_replace('([\\d\\.]+)\\.sql', '\\1') ] }}"
  when: |
      item | basename | splitext | first | regex_replace('([\\d\\.]+)\\.sql', '\\1') is version(installed_version, '>=') 
      and 
      item | basename | splitext | first | regex_replace('([\\d\\.]+)\\.sql', '\\1') is version(current_version, '<=')
  with_fileglob:
      - "upgrade/*.sql"

- debug:
      msg:
          - "installed_version: {{ installed_version }}"
          - "current_version: {{ current_version }}"
          - "all_upgrades_available: {{ all_upgrades_available }}"

- name: Copy relevant upgrade files
  copy:
      src: "upgrade/{{ item }}.sql"
      dest: "{{ database_install_dir }}/upgrade/"
      owner: "{{ fworch_user }}"
      group: "{{ postgres_group }}"
      # postgres user needs to read the sql files regardless of system umask
      mode: "0640"
  loop: "{{ upgrade_files | community.general.version_sort }}"
  become: true

- name: install upgrades
  include_tasks: run-upgrade-file.yml
  loop: "{{ upgrade_files | community.general.version_sort }}"
  loop_control:
      loop_var: upgrade_file

# upgrades keep certificate checking switched off where it was off before (9.7.1), so say which connections are
# still unchecked; the UI shows the same to admins until the checks are switched on
- name: read the certificate checking switches that are off
  community.postgresql.postgresql_query:
      db: "{{ fworch_db_name }}"
      query: >-
          SELECT config_key FROM config
          WHERE config_user = 0 AND config_value = 'False'
            AND config_key IN ('importCheckCertificates', 'extTicketSystemsCheckCertificates', 'emailCheckCertificates')
          ORDER BY config_key
  register: unchecked_certificate_switches
  changed_when: false
  become: true
  become_user: postgres

- name: warn about connections without certificate checking
  debug:
      msg: >-
          SECURITY WARNING: certificate checking is switched off for
          {{ unchecked_certificate_switches.query_result | map(attribute='config_key') | join(', ') }}.
          These connections accept any server certificate, so the credentials FWO sends over them can be
          intercepted. Add the issuing CAs to the trust store of the FWO hosts and switch the checks on in the
          settings, see documentation/certificates.md.
  when: unchecked_certificate_switches.query_result | length > 0
