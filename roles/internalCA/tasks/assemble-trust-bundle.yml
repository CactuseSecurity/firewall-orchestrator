---
# Writes the anchors FWO's own TLS clients validate FWO endpoints against.
#
# The consumers parse the file with X509Certificate2Collection.ImportFromPemFile
# (roles/lib/files/FWO.Config.File/InternalCaCertificate.cs), which reads PEM blocks and
# nothing else. openssl does not: "crl2pkcs7 -nocrl -certfile" exits 0 for an empty file,
# for a file holding no certificate at all and for a DER encoded certificate, so it can
# only prove the file is not malformed - never that it holds the anchors. The checks below
# therefore count PEM blocks, which is exactly what the clients will see.
#
# The paths are overridable so roles/tests-integration can drive this file against
# generated certificates without touching the installed trust bundle.
- name: Resolve the trust bundle inputs
  set_fact:
    internalca_bundle_internal_ca: "{{ internalca_bundle_internal_ca_path | default(internalca_ca_certificate_local, true) }}"
    internalca_bundle_peer_ca: "{{ internalca_bundle_peer_ca_path | default(internalca_peer_ca_certificate, true) }}"
    internalca_bundle_file: "{{ internalca_bundle_path | default(internalca_trust_bundle, true) }}"

- name: Determine whether a peer CA is configured
  set_fact:
    internalca_bundle_has_peer: "{{ internalca_bundle_peer_ca != internalca_bundle_internal_ca }}"

- name: Read the internal CA certificate for the trust bundle
  slurp:
    src: "{{ internalca_bundle_internal_ca }}"
  register: internalca_bundle_internal_ca_content
  become: true

- name: Read the configured peer CA certificate
  slurp:
    src: "{{ internalca_bundle_peer_ca }}"
  register: internalca_bundle_peer_ca_content
  failed_when: false
  become: true
  when: internalca_bundle_has_peer | bool

- name: Fail when the configured peer CA certificate cannot be read
  fail:
    msg: >-
      internalca_peer_ca_certificate is set to {{ internalca_bundle_peer_ca }},
      but that file cannot be read on {{ inventory_hostname }}. Place the issuing root
      CA certificate of the retained Apache certificate at that path on every FWO host,
      or leave the setting at its default to trust the {{ product_name }} internal CA alone.
  when:
    - internalca_bundle_has_peer | bool
    - internalca_bundle_peer_ca_content.content is not defined

- name: Count the PEM certificates in the trust bundle sources
  set_fact:
    internalca_bundle_internal_ca_count: >-
      {{ internalca_bundle_internal_ca_content.content | b64decode
         | regex_findall('-----BEGIN CERTIFICATE-----') | length }}
    internalca_bundle_peer_ca_count: >-
      {{ internalca_bundle_peer_ca_content.content | default('') | b64decode
         | regex_findall('-----BEGIN CERTIFICATE-----') | length }}

- name: Require a PEM certificate in the internal CA copy
  fail:
    msg: >-
      {{ internalca_bundle_internal_ca }} holds no PEM certificate on {{ inventory_hostname }},
      so the {{ product_name }} trust bundle cannot be assembled.
  when: internalca_bundle_internal_ca_count | int == 0

- name: Require a PEM certificate in the configured peer CA
  fail:
    msg: >-
      internalca_peer_ca_certificate is set to {{ internalca_bundle_peer_ca }}, but that file
      holds no PEM certificate on {{ inventory_hostname }}. FWO's TLS clients read the trust
      bundle as PEM, so a DER encoded certificate would be accepted by openssl here and then
      silently ignored at run time, leaving the retained endpoint unvalidatable. Convert it
      with "openssl x509 -inform DER -in <file> -out <file>.pem" and configure the PEM copy.
  when:
    - internalca_bundle_has_peer | bool
    - internalca_bundle_peer_ca_count | int == 0

# Written in one task per case rather than a base file plus an append: the previous
# two-step write reported changed on every run and left the bundle briefly holding only
# the internal CA, which a client reloading it in that window would have pinned to.
- name: Write the FWO trust bundle from the internal CA
  copy:
    content: "{{ internalca_bundle_internal_ca_content.content | b64decode }}"
    dest: "{{ internalca_bundle_file }}"
    owner: root
    group: "{{ fworch_group }}"
    mode: "0644"
  become: true
  when: not internalca_bundle_has_peer | bool

- name: Write the FWO trust bundle from the internal CA and the configured peer CA
  copy:
    # A YAML literal block, so the PEM blocks are separated by real line endings:
    # Ansible renders a '\n' inside a Jinja expression literally, which would glue the
    # closing line of one block to the opening line of the next and void both.
    content: |
      {{ internalca_bundle_internal_ca_content.content | b64decode | trim }}
      {{ internalca_bundle_peer_ca_content.content | b64decode | trim }}
    dest: "{{ internalca_bundle_file }}"
    owner: root
    group: "{{ fworch_group }}"
    mode: "0644"
  become: true
  when: internalca_bundle_has_peer | bool

- name: Read back the assembled FWO trust bundle
  slurp:
    src: "{{ internalca_bundle_file }}"
  register: internalca_bundle_written_content
  become: true

- name: Verify the assembled FWO trust bundle parses
  command:
    argv:
      - openssl
      - crl2pkcs7
      - -nocrl
      - -certfile
      - "{{ internalca_bundle_file }}"
  changed_when: false
  become: true

- name: Verify the assembled FWO trust bundle holds every configured anchor
  assert:
    that:
      - >-
        (internalca_bundle_written_content.content | b64decode
         | regex_findall('-----BEGIN CERTIFICATE-----') | length)
        == (internalca_bundle_internal_ca_count | int) + (internalca_bundle_peer_ca_count | int)
    fail_msg: >-
      {{ internalca_bundle_file }} on {{ inventory_hostname }} holds
      {{ internalca_bundle_written_content.content | b64decode
         | regex_findall('-----BEGIN CERTIFICATE-----') | length }}
      PEM certificates instead of the
      {{ (internalca_bundle_internal_ca_count | int) + (internalca_bundle_peer_ca_count | int) }}
      configured in {{ internalca_bundle_internal_ca }}
      {{ 'and ' ~ internalca_bundle_peer_ca if internalca_bundle_has_peer | bool else '' }}.

- name: Verify the FWO trust bundle contains a CA certificate
  community.crypto.x509_certificate_info:
    path: "{{ internalca_bundle_file }}"
  changed_when: false
  become: true
