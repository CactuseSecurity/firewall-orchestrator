---
# Runs on every host, against the trust anchor that host has just installed, so a
# CA too close to expiry stops the whole run rather than only the issuer's part of
# it. x509_certificate is idempotent and happily leaves an expiring - or expired -
# CA in place, so nothing else in this role would ever notice. A freshly created
# CA is valid for internalca_ca_validity_days and passes every horizon.
- name: Check remaining validity of the internal CA certificate
  community.crypto.x509_certificate_info:
    path: "{{ internalca_ca_certificate_local }}"
    valid_at:
      warning_horizon: "+{{ internalca_ca_expiry_warning_days }}d"
      critical_horizon: "+{{ internalca_ca_expiry_critical_days }}d"
      leaf_horizon: "+{{ internalca_certificate_validity_days }}d"
  register: internalca_ca_validity
  changed_when: false
  become: true

# Two independent reasons to warn. The leaf horizon usually trips first and is
# the one that actually costs something: from that point on the renew-on-upgrade
# guarantee is void, because no leaf can outlive the CA signing it.
- name: Warn when the internal CA is approaching expiry
  debug:
    msg: >-
      WARNING: the {{ internalca_ca_common_name }} certificate expires on
      {{ internalca_ca_validity.not_after }}.
      {{
        'Certificates issued from now on are cut short to that date instead of
         getting their full ' ~ internalca_certificate_validity_days ~ ' days, so
         every FWO host stops trusting its peers on that date however often you
         run the installer.'
        if not internalca_ca_validity.valid_at.leaf_horizon
        else 'Issued certificates still get their full validity for now.'
      }}
      Plan a CA rotation, see documentation/certificates.md.
  when:
    - not internalca_ca_validity.valid_at.warning_horizon
      or not internalca_ca_validity.valid_at.leaf_horizon
    - internalca_ca_validity.valid_at.critical_horizon

- name: Fail when the internal CA is about to expire
  fail:
    msg: >-
      The {{ internalca_ca_common_name }} certificate expires on
      {{ internalca_ca_validity.not_after }}, in under
      {{ internalca_ca_expiry_critical_days }} days, and every certificate issued
      for {{ inventory_hostname }} would expire with it. Rotate the CA before
      continuing, see documentation/certificates.md. To complete this run anyway -
      which does not extend any certificate - set internalca_ignore_ca_expiry=true.
  when:
    - not internalca_ca_validity.valid_at.critical_horizon
    - not internalca_ignore_ca_expiry | bool

- name: Warn when continuing with an expiring internal CA
  debug:
    msg: >-
      WARNING: continuing with an internal CA that expires on
      {{ internalca_ca_validity.not_after }} because internalca_ignore_ca_expiry
      is set. Certificates issued by this run expire on that date.
  when:
    - not internalca_ca_validity.valid_at.critical_horizon
    - internalca_ignore_ca_expiry | bool
