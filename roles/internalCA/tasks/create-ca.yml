---
- name: Create internal CA directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ internalca_ca_dir }}"
    - "{{ internalca_ca_issued_dir }}"
  become: true

# An existing CA is an installation's trust anchor. Its subject must remain unchanged
# on upgrade, including for installations created before CA names gained a unique
# suffix, because changing it would replace the certificate trusted by external clients.
- name: Check for an existing internal CA certificate
  stat:
    path: "{{ internalca_ca_certificate }}"
  register: internalca_existing_ca_certificate
  become: true

# failed_when, so that an unreadable certificate is answered by the message below rather
# than by the module's bare parse error. Before the subject was read back, this state
# repaired itself silently: x509_certificate regenerated an unparseable ca.crt from the
# retained key under the fixed name, so subject and key were unchanged and every
# certificate already issued still chained to it. A regenerated CA now carries a new
# unique name instead. That does not orphan the leaves of the hosts in the run - an
# issuer that no longer matches the ownca subject is a regeneration trigger, so
# issue-certificates.yml reissues them - but it does replace the anchor everything
# outside the installer's reach was given: a browser or trust store holding the old CA,
# an exported client bundle, and any host this run does not touch, which keeps a leaf
# the new CA did not sign. Replacing an installation's trust anchor is not something to
# do silently, so the run stops here, the way every other unreadable certificate in this
# role does: naming the file, not guessing.
# Keyed on the returned subject rather than on the task result: failed_when overrides the
# module's own failure, so an unreadable certificate still reports failed = false.
- name: Read the existing internal CA identity
  community.crypto.x509_certificate_info:
    path: "{{ internalca_ca_certificate }}"
  register: internalca_existing_ca_certificate_info
  failed_when: false
  become: true
  when: internalca_existing_ca_certificate.stat.exists

- name: Stop when the retained internal CA certificate cannot be read
  fail:
    msg: >-
      The internal CA certificate {{ internalca_ca_certificate }} exists on
      {{ inventory_hostname }} but cannot be read
      ({{ internalca_existing_ca_certificate_info.msg | default('no reason reported') }}).
      Its subject is the issuer of every certificate this installation has issued, so the
      installer cannot replace it without invalidating all of them. Restore the file from a
      backup, or - when no issued certificate has to survive - remove {{ internalca_ca_dir }}
      to have the CA and every identity reissued.
  when:
    - internalca_existing_ca_certificate.stat.exists
    - internalca_existing_ca_certificate_info.subject is not defined
    - not (internalca_reset_certificates | bool)

# An unreadable CA is fatal above unless a reset is replacing it anyway. In that case its
# subject cannot be read either, so the name every leaf of this installation carries as
# its issuer would be lost. Recover it from the client identity instead: that leaf sits at
# an FWO-owned path on this host, so whoever signed it was this installation's CA.
- name: Read the client identity issued by the CA being replaced
  community.crypto.x509_certificate_info:
    path: "{{ internalca_client_certificate }}"
  register: internalca_replaced_client_certificate_info
  failed_when: false
  changed_when: false
  become: true
  when:
    - internalca_reset_certificates | bool
    - internalca_existing_ca_certificate.stat.exists
    - internalca_existing_ca_certificate_info.subject is not defined

# Read from the CA itself where that works, from the client leaf's issuer where it does
# not. Resolved once, because both the record below and the warning after it need it.
- name: Determine the internal CA name this reset retires
  set_fact:
    internalca_retired_ca_common_name: >-
      {{
        internalca_existing_ca_certificate_info.subject.get('commonName', '')
        if internalca_existing_ca_certificate_info.subject is defined
        else (internalca_replaced_client_certificate_info.issuer | default({}, true)).get('commonName', '')
      }}
  when:
    - internalca_reset_certificates | bool
    - internalca_existing_ca_certificate.stat.exists

# Appended before the CA is replaced, so the name survives the run. The classifier must
# still recognise leaves signed by it on every later upgrade, not only while the reset is
# crossing from the old CA to the new one - a host that misses the reset is upgraded with
# its old leaf still in place and must not have it taken for a customer certificate.
- name: Record the internal CA name this reset retires
  lineinfile:
    path: "{{ internalca_retired_ca_names }}"
    line: "{{ internalca_retired_ca_common_name }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  become: true
  when: internalca_retired_ca_common_name | default('') | length > 0

# Warned rather than failed: the reset is the documented repair for a corrupted CA, so it
# has to be able to run. Every host this run does reach is reissued regardless, because
# the reset forces issuance; only a host it does not reach is left with a leaf whose
# issuer nothing can place any more.
- name: Report that the retired internal CA name could not be determined
  debug:
    msg: >-
      The internal CA on {{ inventory_hostname }} could not be read and no client identity
      names its issuer, so the subject it signed its leaves under is unknown and cannot be
      recorded in {{ internalca_retired_ca_names }}. Every host in this run is reissued
      anyway. A host this run does not reach keeps a leaf whose issuer a later upgrade
      cannot recognise, and its Apache and OpenLDAP identities would be taken for customer
      certificates there: move them out of the paths the installed vhost and
      {{ internalca_ldap_cert_dir }} name, so {{ product_name }} issues both again.
  when:
    - internalca_reset_certificates | bool
    - internalca_existing_ca_certificate.stat.exists
    - internalca_retired_ca_common_name | default('') | length == 0

- name: Read the internal CA names this installation has retired
  slurp:
    src: "{{ internalca_retired_ca_names }}"
  register: internalca_retired_ca_names_content
  failed_when: false
  changed_when: false
  become: true

- name: Remember the internal CA names this installation has retired
  set_fact:
    internalca_previous_ca_common_names: >-
      {{
        (internalca_retired_ca_names_content.content | default('') | b64decode).split('\n')
        | map('trim') | reject('equalto', '') | unique | list
      }}

- name: Generate internal CA private key
  community.crypto.openssl_privatekey:
    path: "{{ internalca_ca_private_key }}"
    size: "{{ internalca_key_size if internalca_key_type == 'RSA' else omit }}"
    type: "{{ internalca_key_type }}"
    curve: "{{ internalca_key_curve if internalca_key_type == 'ECC' else omit }}"
    force: "{{ internalca_reset_certificates | bool }}"
    mode: "0600"
  become: true
  no_log: true

- name: Read the internal CA public key fingerprint
  community.crypto.openssl_privatekey_info:
    path: "{{ internalca_ca_private_key }}"
  register: internalca_ca_private_key_info
  become: true
  no_log: true

# The key is generated from cryptographically secure randomness. Its fingerprint makes
# the name unique without separate mutable state, and stays stable on repeated runs.
- name: Select the internal CA common name
  set_fact:
    internalca_ca_common_name: >-
      {{
        internalca_existing_ca_certificate_info.subject.commonName
        if internalca_existing_ca_certificate.stat.exists
           and not (internalca_reset_certificates | bool)
        else internalca_ca_common_name_prefix ~ ' '
          ~ (internalca_ca_private_key_info.public_key_fingerprints.sha256
             | replace(':', '') | lower)[:16]
      }}

# RFC 5280 4.2.1.9 requires a conforming CA to mark basicConstraints critical in
# a CA certificate whose key signs other certificates, and 4.2.1.3 says the same
# for keyUsage where it is present. community.crypto defaults both flags to false,
# so they are set here: without them a strict validator - a TLS inspection
# appliance or an embedded stack - may refuse this anchor, which is precisely the
# kind of peer internalca_key_type exists to accommodate.
- name: Generate internal CA signing request
  community.crypto.openssl_csr:
    path: "{{ internalca_ca_csr }}"
    privatekey_path: "{{ internalca_ca_private_key }}"
    common_name: "{{ internalca_ca_common_name }}"
    basic_constraints:
      - CA:TRUE
    basic_constraints_critical: true
    key_usage:
      - keyCertSign
      - cRLSign
    key_usage_critical: true
  become: true

- name: Generate internal CA certificate
  community.crypto.x509_certificate:
    path: "{{ internalca_ca_certificate }}"
    privatekey_path: "{{ internalca_ca_private_key }}"
    csr_path: "{{ internalca_ca_csr }}"
    provider: selfsigned
    selfsigned_not_after: "+{{ internalca_ca_validity_days }}d"
    selfsigned_digest: sha256
    force: "{{ internalca_reset_certificates | bool }}"
    mode: "0644"
  become: true
