---
# Self-signs a CA certificate for an existing private key. Used for the CA in force
# (create-ca.yml) and for the CA a rotation stages (stage-next-ca.yml), so both are
# built identically.
#
# RFC 5280 4.2.1.9 requires a conforming CA to mark basicConstraints critical in
# a CA certificate whose key signs other certificates, and 4.2.1.3 says the same
# for keyUsage where it is present. community.crypto defaults both flags to false,
# so they are set here: without them a strict validator - a TLS inspection
# appliance or an embedded stack - may refuse this anchor, which is precisely the
# kind of peer internalca_key_type exists to accommodate.
- name: Generate internal CA signing request
  community.crypto.openssl_csr:
    path: "{{ internalca_generate_ca_csr }}"
    privatekey_path: "{{ internalca_generate_ca_private_key }}"
    common_name: "{{ internalca_generate_ca_common_name }}"
    basic_constraints:
      - CA:TRUE
    basic_constraints_critical: true
    key_usage:
      - keyCertSign
      - cRLSign
    key_usage_critical: true
  become: true

- name: Generate internal CA certificate
  community.crypto.x509_certificate:
    path: "{{ internalca_generate_ca_certificate }}"
    privatekey_path: "{{ internalca_generate_ca_private_key }}"
    csr_path: "{{ internalca_generate_ca_csr }}"
    provider: selfsigned
    selfsigned_not_after: "+{{ internalca_ca_validity_days }}d"
    selfsigned_digest: sha256
    force: "{{ internalca_generate_ca_force | bool }}"
    mode: "0644"
  become: true
