---
- name: Create internal CA certificate directories
  file:
    path: "{{ item.private_key | dirname }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0750"
  loop: "{{ internalca_certificate_profiles }}"
  become: true

- name: Generate internal CA certificate private keys
  community.crypto.openssl_privatekey:
    path: "{{ item.private_key }}"
    size: "{{ internalca_key_size if internalca_key_type == 'RSA' else omit }}"
    type: "{{ internalca_key_type }}"
    curve: "{{ internalca_key_curve if internalca_key_type == 'ECC' else omit }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0640"
  loop: "{{ internalca_certificate_profiles }}"
  become: true
  no_log: true

- name: Generate internal CA certificate signing requests
  community.crypto.openssl_csr:
    path: "{{ item.csr }}"
    privatekey_path: "{{ item.private_key }}"
    common_name: "{{ item.common_name }}"
    subject_alt_name: "{{ item.subject_alt_name | default(omit) }}"
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage: "{{ item.extended_key_usage }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0640"
  loop: "{{ internalca_certificate_profiles }}"
  become: true

- name: Read internal CA certificate signing requests
  slurp:
    src: "{{ item.csr }}"
  loop: "{{ internalca_certificate_profiles }}"
  register: internalca_certificate_csrs
  become: true

- name: Create issuer directories for host certificates
  file:
    path: "{{ internalca_ca_issued_dir }}/{{ inventory_hostname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  delegate_to: "{{ internalca_ca_host }}"
  become: true

# x509_certificate is idempotent and would keep an expired certificate in place,
# so an installer run inside the renewal window re-signs the CSR explicitly. The
# host names the certificate has to carry are read here for the same reason, see
# internalca_certificate_names_missing below.
- name: Check the already issued host certificates
  community.crypto.x509_certificate_info:
    path: "{{ internalca_ca_issued_dir }}/{{ inventory_hostname }}/{{ item.name }}.crt"
    valid_at:
      renewal_window: "+{{ internalca_renewal_threshold_days }}d"
  loop: "{{ internalca_certificate_profiles }}"
  register: internalca_issued_certificate_info
  failed_when: false
  changed_when: false
  delegate_to: "{{ internalca_ca_host }}"
  become: true

- name: Sign host certificates with the internal CA
  community.crypto.x509_certificate:
    path: "{{ internalca_ca_issued_dir }}/{{ inventory_hostname }}/{{ item.item.name }}.crt"
    csr_content: "{{ item.content | b64decode }}"
    ownca_path: "{{ internalca_ca_certificate }}"
    ownca_privatekey_path: "{{ internalca_ca_private_key }}"
    provider: ownca
    ownca_not_after: "+{{ internalca_certificate_validity_days }}d"
    ownca_digest: sha256
    force: "{{ internalca_certificate_is_expiring | bool or internalca_certificate_names_missing | length > 0 }}"
    mode: "0644"
  vars:
    internalca_issued_certificate: "{{ internalca_issued_certificate_info.results[internalca_profile_index] }}"
    # valid_at is absent when no certificate has been issued yet, so guard the
    # lookup instead of chaining onto an undefined value.
    internalca_certificate_is_expiring: >-
      {{ not (internalca_issued_certificate.valid_at | default({}, true)).get('renewal_window', false) }}
    # The names this profile asks for that the already issued certificate does not
    # carry. An endpoint renamed since the last run - and an upgrade to a release
    # that derives an endpoint name differently, which is what fwo_endpoint_hostname
    # made possible - changes the certificate signing request but not the expiry
    # date, and the certificate is only replaced here. Without this the endpoint
    # keeps serving an identity that no longer covers the name its own fworch.json
    # addresses it under, and every FWO client verifying that endpoint fails on a
    # host name mismatch. Compared in one direction only: openssl_csr adds the
    # common name as a subjectAltName entry of its own, so an issued certificate
    # legitimately carries entries no profile ever listed.
    internalca_certificate_names_missing: >-
      {{ item.item.subject_alt_name | default([], true)
         | difference(internalca_issued_certificate.subject_alt_name | default([], true)) }}
  loop: "{{ internalca_certificate_csrs.results }}"
  loop_control:
    index_var: internalca_profile_index
  delegate_to: "{{ internalca_ca_host }}"
  become: true

- name: Read signed host certificates from issuer
  slurp:
    src: "{{ internalca_ca_issued_dir }}/{{ inventory_hostname }}/{{ item.name }}.crt"
  loop: "{{ internalca_certificate_profiles }}"
  delegate_to: "{{ internalca_ca_host }}"
  register: internalca_signed_certificates
  become: true

- name: Install internal CA signed host certificates
  copy:
    content: "{{ item.content | b64decode }}"
    dest: "{{ item.item.certificate }}"
    owner: "{{ item.item.owner }}"
    group: "{{ item.item.group }}"
    mode: "0644"
  loop: "{{ internalca_signed_certificates.results }}"
  register: internalca_installed_certificates
  become: true

# Services that hold their identity for the process lifetime have to be restarted
# when it is reissued. The consumers are in other roles, so these are facts rather
# than handlers: handlers do not survive across plays.
- name: Record renewal of the client identity
  set_fact:
    internalca_client_identity_changed: >-
      {{
        internalca_installed_certificates.results
        | selectattr('item.item.name', 'equalto', 'client')
        | selectattr('changed')
        | list
        | length > 0
      }}

- name: Record renewal of the Apache server identity
  set_fact:
    internalca_apache_identity_changed: >-
      {{
        internalca_installed_certificates.results
        | selectattr('item.item.name', 'equalto', 'apache-server')
        | selectattr('changed')
        | list
        | length > 0
      }}

- name: Record renewal of the LDAP server identity
  set_fact:
    internalca_ldap_identity_changed: >-
      {{
        internalca_installed_certificates.results
        | selectattr('item.item.name', 'equalto', 'ldap-server')
        | selectattr('changed')
        | list
        | length > 0
      }}
