---
- name: Create internal CA on the designated issuer host
  include_tasks: create-ca.yml
  when:
    - internalca_enabled | bool
    - inventory_hostname == internalca_ca_host

- name: Read internal CA certificate from issuer
  slurp:
    src: "{{ internalca_ca_certificate }}"
  delegate_to: "{{ internalca_ca_host }}"
  register: internalca_ca_certificate_content
  run_once: true
  when: internalca_enabled | bool

- name: Store internal CA certificate for all hosts
  set_fact:
    internalca_ca_certificate_pem: "{{ internalca_ca_certificate_content.content }}"
  delegate_to: "{{ internalca_ca_host }}"
  delegate_facts: true
  run_once: true
  when: internalca_enabled | bool

- name: Install internal CA trust anchor
  include_tasks: install-trust.yml
  when: internalca_enabled | bool

- name: Detect customer managed certificates during upgrade
  include_tasks: detect-existing-certificates.yml
  when:
    - internalca_enabled | bool
    - installation_mode == 'upgrade'

- name: Build internal CA certificate profiles for this host
  set_fact:
    internalca_certificate_profiles: >-
      {{
        [
          {
            'name': 'client',
            'certificate': internalca_client_certificate,
            'private_key': internalca_client_private_key,
            'csr': internalca_client_csr,
            'owner': fworch_user,
            'group': fworch_group,
            'common_name': product_name ~ '-' ~ inventory_hostname ~ '-client',
            'extended_key_usage': ['clientAuth']
          }
        ]
        + (
          [
            {
              'name': 'apache-server',
              'certificate': internalca_apache_certificate,
              'private_key': internalca_apache_private_key,
              'csr': internalca_apache_csr,
              'owner': 'root',
              'group': 'root',
              'common_name': inventory_hostname,
              'subject_alt_name': internalca_apache_subject_alt_names,
              'extended_key_usage': ['serverAuth']
            }
          ] if internalca_issue_apache_certificate | bool and ('apiserver' in group_names or 'middlewareserver' in group_names or 'frontends' in group_names) else []
        )
        + (
          [
            {
              'name': 'ldap-server',
              'certificate': internalca_ldap_certificate,
              'private_key': internalca_ldap_private_key,
              'csr': internalca_ldap_csr,
              'owner': 'root',
              'group': 'root',
              'common_name': openldap_server,
              'subject_alt_name': ['DNS:' ~ openldap_server, 'IP:127.0.0.1'],
              'extended_key_usage': ['serverAuth']
            }
          ] if 'middlewareserver' in group_names and not (internalca_preserve_ldap_certificate | default(false) | bool) else []
        )
      }}
  vars:
    # Block scalars keep backslashes verbatim, so this pattern uses single
    # backslashes. Doubling them makes every IP literal fail the test and drops
    # the IP SAN entries that api_uri is built from.
    internalca_ipv4_pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
    # Every FWO Apache endpoint is also reached over loopback by local admin
    # tooling, so localhost is always part of the host identity.
    internalca_apache_subject_alt_names: >-
      {{
        (
          ['DNS:' ~ inventory_hostname, 'DNS:' ~ ansible_facts['hostname'], 'DNS:localhost', 'IP:127.0.0.1']
          + (['DNS:' ~ api_hostname] if 'apiserver' in group_names else [])
          + (['IP:' ~ api_network_listening_ip_address] if 'apiserver' in group_names and api_network_listening_ip_address is match(internalca_ipv4_pattern) else [])
          + (['DNS:' ~ middleware_hostname] if 'middlewareserver' in group_names else [])
          + (['DNS:' ~ ui_hostname, 'DNS:' ~ ui_server_name, 'DNS:' ~ ui_server_alias] if 'frontends' in group_names else [])
          + (['IP:' ~ ui_hostname] if 'frontends' in group_names and ui_hostname is match(internalca_ipv4_pattern) else [])
        ) | unique
      }}
  when: internalca_enabled | bool

- name: Issue internal CA certificates for this host
  include_tasks: issue-certificates.yml
  when: internalca_enabled | bool
