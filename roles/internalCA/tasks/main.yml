---
# community.crypto needs the cryptography python library on the target, and this
# role runs on every host - including importer- and database-only nodes, which no
# other role installs it for. It also has to be present before the first
# community.crypto task rather than in a later play, because certificates are
# issued here.
- name: Install the python library community.crypto needs
  package:
    name: "{{ internalca_crypto_packages }}"
    state: present
  become: true
  environment: "{{ proxy_env }}"

- name: Create internal CA on the designated issuer host
  include_tasks: create-ca.yml
  when: inventory_hostname == internalca_ca_host

- name: Read internal CA certificate from issuer
  slurp:
    src: "{{ internalca_ca_certificate }}"
  delegate_to: "{{ internalca_ca_host }}"
  register: internalca_ca_certificate_content
  run_once: true
  become: true

- name: Store internal CA certificate for all hosts
  set_fact:
    internalca_ca_certificate_pem: "{{ internalca_ca_certificate_content.content }}"
  delegate_to: "{{ internalca_ca_host }}"
  delegate_facts: true
  run_once: true

- name: Install internal CA trust anchor
  include_tasks: install-trust.yml

# Deliberately every host, not just the issuer. Leaves are signed with
# delegate_to, which runs on the CA host regardless of whether that host failed
# its own tasks earlier in the play - so a guard that only ran on the issuer
# would not actually stop anyone from issuing. Each host checks the anchor it
# has just installed and stops itself.
- name: Guard against an expiring internal CA
  include_tasks: check-ca-expiry.yml

- name: Detect customer managed certificates during upgrade
  include_tasks: detect-existing-certificates.yml
  when: installation_mode == 'upgrade'

# slapd reads its key as its own service account, so the identity has to be issued
# to that account rather than to root and chowned afterwards by the openldap-server
# role: the chown made every later internalCA run change the ownership back, which
# reported the identity as renewed on every run and restarted slapd for nothing, and
# it does not run at all for "--tags certificates", which would leave slapd a key it
# cannot read. On a fresh installation slapd is not installed yet and the account
# does not exist, so root is used and the openldap-server role does the first chown.
- name: Look up the slapd service account
  getent:
    database: passwd
    key: "{{ openldap_server_user }}"
  register: internalca_ldap_user_lookup
  failed_when: false
  changed_when: false
  when:
    - "'middlewareserver' in group_names"
    - not (internalca_preserve_ldap_certificate | default(false) | bool)

- name: Build internal CA certificate profiles for this host
  set_fact:
    internalca_certificate_profiles: >-
      {{
        [
          {
            'name': 'client',
            'certificate': internalca_client_certificate,
            'private_key': internalca_client_private_key,
            'csr': internalca_client_csr,
            'owner': fworch_user,
            'group': fworch_group,
            'common_name': product_name ~ '-' ~ inventory_hostname ~ '-client',
            'extended_key_usage': ['clientAuth']
          }
        ]
        + (
          [
            {
              'name': 'apache-server',
              'certificate': internalca_apache_certificate,
              'private_key': internalca_apache_private_key,
              'csr': internalca_apache_csr,
              'owner': 'root',
              'group': 'root',
              'common_name': inventory_hostname,
              'subject_alt_name': internalca_apache_subject_alt_names,
              'extended_key_usage': ['serverAuth']
            }
          ] if internalca_issue_apache_certificate | bool and ('apiserver' in group_names or 'middlewareserver' in group_names or 'frontends' in group_names) else []
        )
        + (
          [
            {
              'name': 'ldap-server',
              'certificate': internalca_ldap_certificate,
              'private_key': internalca_ldap_private_key,
              'csr': internalca_ldap_csr,
              'owner': internalca_ldap_identity_owner,
              'group': internalca_ldap_identity_owner,
              'common_name': openldap_server,
              'subject_alt_name': internalca_ldap_subject_alt_names,
              'extended_key_usage': ['serverAuth']
            }
          ] if 'middlewareserver' in group_names and not (internalca_preserve_ldap_certificate | default(false) | bool) else []
        )
      }}
  vars:
    # The slapd account when it already exists on this host, root otherwise (the fresh
    # installation case, where the package creating it is installed later). Keyed on the
    # returned passwd entry, not on the task result: failed_when overrides the module's
    # own failure, so a missing account still reports failed = false.
    internalca_ldap_identity_owner: >-
      {{
        openldap_server_user
        if openldap_server_user in
           (internalca_ldap_user_lookup.ansible_facts.getent_passwd | default({}, true))
        else 'root'
      }}
    # Block scalars keep backslashes verbatim, so this pattern uses single
    # backslashes. Doubling them makes every IP literal fail the test and drops
    # the IP SAN entries that api_uri is built from.
    internalca_ipv4_pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
    # LDAP clients now verify the host name (TLS_REQCERT demand), and openldap_server
    # is usually an IP literal, which only matches an iPAddress SAN - a dNSName
    # holding the same digits does not. Loopback stays in regardless, because slapd
    # is always also reachable there.
    internalca_ldap_subject_alt_names: >-
      {{
        (
          ['DNS:' ~ openldap_server, 'IP:127.0.0.1']
          + (['IP:' ~ openldap_server] if openldap_server is match(internalca_ipv4_pattern) else [])
        ) | unique
      }}
    # The names Apache serves as ServerName/ServerAlias, minus the demo
    # placeholders an untouched installation still carries. ServerAlias may hold
    # several space separated names, and each needs its own SAN entry - emitting
    # the raw value would produce one malformed entry covering nothing.
    internalca_ui_host_names: >-
      {{
        ((ui_server_name | default('')) ~ ' ' ~ (ui_server_alias | default('')))
        | split
        | reject('in', internalca_placeholder_host_names)
        | list
      }}
    # Every name this host's FWO endpoints are addressed under, as plain host names.
    # Collected from the same variables the endpoints themselves are built from -
    # api_uri from api_network_listening_ip_address, middleware_uri from
    # middleware_hostname, the ui tests from ui_hostname - so a name that reaches
    # fworch.json, an integration test or a browser cannot be missing from the
    # certificate. Every FWO Apache endpoint is also reached over loopback by local
    # admin tooling, so localhost is always part of the host identity.
    internalca_apache_host_names: >-
      {{
        (
          [inventory_hostname, ansible_facts['hostname'], 'localhost', ipv4_loopback_address]
          + ([api_hostname, api_network_listening_ip_address] if 'apiserver' in group_names else [])
          + ([middleware_hostname] if 'middlewareserver' in group_names else [])
          + ([ui_hostname] + internalca_ui_host_names if 'frontends' in group_names else [])
        ) | reject('equalto', '') | unique
      }}
    # An IP literal is only matched by an iPAddress SAN - a dNSName holding the same
    # digits is not - so each collected name is emitted as the entry type it can
    # actually be matched by. Deciding it here rather than at every call site is what
    # lets a name be put into the inventory without also knowing which kind it is.
    internalca_apache_subject_alt_names: >-
      {{
        (internalca_apache_host_names | select('match', internalca_ipv4_pattern)
          | map('regex_replace', '^', 'IP:') | list)
        + (internalca_apache_host_names | reject('match', internalca_ipv4_pattern)
          | map('regex_replace', '^', 'DNS:') | list)
      }}

- name: Issue internal CA certificates for this host
  include_tasks: issue-certificates.yml

- name: Validate the configured Apache intermediate certificate chain
  include_tasks: validate-apache-intermediates.yml
  when:
    - internalca_apache_intermediate_certificates | length > 0
    - "['apiserver', 'middlewareserver', 'frontends'] | intersect(group_names) | length > 0"

# Only on an existing installation: on a fresh one the services do not exist yet and
# the roles installing them start them with the identity issued above.
- name: Restart the services whose identity was renewed
  include_tasks: restart-consumers.yml
  when: installation_mode != 'new'
