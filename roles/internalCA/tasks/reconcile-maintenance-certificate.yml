---
# A certificate-only recovery run does not execute roles/common, so an enabled
# maintenance vhost may still name the pre-9.5.0 /etc/apache*/ssl identity. Repoint
# only its two identity directives after ownership detection and issuance have selected
# either the newly generated FWO pair or the untouched customer pair.
- name: Check for an installed maintenance Apache configuration
  stat:
    path: "{{ internalca_maintenance_configuration_file }}"
  register: internalca_maintenance_configuration
  become: true

# With internalca_issue_apache_certificate set to false the selected identity is the
# operator's own, and FWO has issued nothing - so for the first time these two paths can
# name files that are not there. Writing them into the vhost anyway and then reloading
# Apache in restart-consumers.yml fails the configuration test and takes the web server
# down while the maintenance site is the only thing still enabled. roles/common already
# refuses to restart Apache into an identity that is not on disk; the deferred restart
# this task feeds has to apply the same rule rather than undo it.
- name: Check the Apache identity the maintenance site is to serve
  stat:
    path: "{{ item }}"
  loop:
    - "{{ internalca_apache_certificate }}"
    - "{{ internalca_apache_private_key }}"
  register: internalca_maintenance_target_identity
  become: true
  when: internalca_maintenance_configuration.stat.exists

- name: Record whether the maintenance Apache identity can be served
  set_fact:
    internalca_maintenance_identity_available: >-
      {{
        internalca_maintenance_configuration.stat.exists
        and internalca_maintenance_target_identity.results | default([], true)
            | selectattr('stat.exists') | list | length == 2
      }}

- name: Leave the maintenance site alone while its identity is absent
  debug:
    msg: >-
      {{ internalca_maintenance_configuration_file }} names a maintenance site, but
      {{ internalca_apache_certificate }} and {{ internalca_apache_private_key }} are not
      both present - with internalca_issue_apache_certificate set to false FWO does not
      create them. The vhost is left naming the identity Apache is already serving, and
      Apache is not restarted, so this host stays exactly as it was.
  when:
    - internalca_maintenance_configuration.stat.exists
    - not (internalca_maintenance_identity_available | bool)

# insertafter anchors the replacement inside the TLS vhost. Without it lineinfile appends
# a directive it cannot find to the end of the file, which lands outside <VirtualHost>
# and silently sets the identity for the whole server instead of for this site. The
# anchor is the https vhost line the maintenance template emits, and this file has a
# plain :80 vhost above it that must not be the one that gets an identity.
- name: Reconcile maintenance Apache certificate paths
  lineinfile:
    path: "{{ internalca_maintenance_configuration_file }}"
    regexp: "^\\s*{{ item.directive }}\\s+"
    insertafter: "^\\s*<VirtualHost\\s[^>]*:{{ ui_web_port }}>"
    # Four spaces, matching roles/common/templates/httpd-maintenance.conf, which writes
    # these same two directives on every run before this task reconciles them. Indent
    # them differently there and lineinfile rewrites both lines on every upgrade purely
    # over the whitespace, reporting a change that reloads Apache for nothing and making
    # internalca_maintenance_identity_changed mean "templated again" rather than "the
    # identity moved". The integration fixtures reproduce this line exactly.
    line: "    {{ item.directive }} {{ item.path }}"
  loop:
    - directive: SSLCertificateFile
      path: "{{ internalca_apache_certificate }}"
    - directive: SSLCertificateKeyFile
      path: "{{ internalca_apache_private_key }}"
  register: internalca_maintenance_identity_reconciliation
  become: true
  when: internalca_maintenance_identity_available | bool

- name: Record maintenance Apache identity reconciliation
  set_fact:
    internalca_maintenance_identity_changed: >-
      {{
        internalca_maintenance_identity_reconciliation.results
        | rejectattr('skipped', 'defined')
        | selectattr('changed')
        | list
        | length > 0
      }}
