---
# Refuses to build FWO endpoints that a retained administrator-managed Apache
# certificate does not cover. A retained certificate is the operator's, so FWO cannot
# widen its subjectAltName - it can only decline to point its own components at names
# the certificate will make them reject.
#
# In its own file so that roles/tests-integration drives this code rather than a copy of
# it. Inputs: internalca_existing_apache_certificate (path, for the message),
# internalca_existing_apache_certificate_info (a registered x509_certificate_info
# result) and internalca_endpoint_host_names. The caller gates the include on
# internalca_preserve_apache_certificate.
- name: Collect the endpoint names a retained Apache certificate does not cover
  set_fact:
    internalca_retained_apache_subject_alt_names: "{{ retained_subject_alt_names }}"
    internalca_uncovered_endpoint_host_names: "{{ uncovered_host_names | split }}"
  vars:
    # Absent and empty are the same answer here, and x509_certificate_info reports the
    # first as None rather than as a missing key, hence the boolean default.
    retained_subject_alt_names: >-
      {{ internalca_existing_apache_certificate_info.subject_alt_name | default([], true) }}
    # DNS names are compared case insensitively because the resolver is; IP entries are
    # compared verbatim, since an iPAddress SAN is the only entry an IP literal matches.
    retained_dns_names: >-
      {{
        retained_subject_alt_names | select('match', '^DNS:')
        | map('regex_replace', '^DNS:', '') | map('lower') | list
      }}
    retained_ip_names: >-
      {{
        retained_subject_alt_names | select('match', '^IP:')
        | map('regex_replace', '^IP:', '') | list
      }}
    # A wildcard covers exactly one label, so a name is also accepted when its parent
    # domain appears as *.parent - customer certificates are commonly issued that way,
    # and failing the upgrade over one would be worse than not checking at all. Names
    # are joined into a string because a host name can never contain whitespace; the
    # consumer above splits it back into a list.
    uncovered_host_names: >-
      {%- set uncovered = [] -%}
      {%- for host_name in internalca_endpoint_host_names -%}
        {%- if host_name is match(internalca_ipv4_pattern) -%}
          {%- if host_name not in retained_ip_names -%}
            {%- set _ = uncovered.append(host_name) -%}
          {%- endif -%}
        {%- elif host_name | lower not in retained_dns_names
                 and host_name | lower | regex_replace('^[^.]+\.', '*.') not in retained_dns_names -%}
          {%- set _ = uncovered.append(host_name) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ uncovered | join(' ') }}

- name: Fail on an endpoint name the retained Apache certificate does not cover
  fail:
    msg: >-
      The customer managed Apache certificate kept on {{ inventory_hostname }}
      ({{ internalca_existing_apache_certificate }}) has no subjectAltName entry for
      {{ internalca_uncovered_endpoint_host_names | join(', ') }}, but {{ product_name }}
      addresses this host under exactly {{ 'that name' if internalca_uncovered_endpoint_host_names | length == 1 else 'those names' }},
      so its own components would reject the certificate they are being pointed at.
      The certificate covers
      {{ internalca_retained_apache_subject_alt_names | join(', ') | default('nothing - it carries no subjectAltName extension', true) }}.
      Set fwo_endpoint_hostname in /etc/{{ product_name }}/fwo-install-settings.yml to a
      name the certificate covers, or have the certificate reissued with the missing
      {{ 'entry' if internalca_uncovered_endpoint_host_names | length == 1 else 'entries' }}.
  when: internalca_uncovered_endpoint_host_names | default([]) | length > 0
