---
# Proves that a retained administrator-managed certificate can actually be validated by
# the FWO clients that will be pointed at it, by building it to an anchor in the trust
# bundle exactly the way those clients do.
#
# Needed because covering the endpoint names is only half the question. The bundle holds
# CA certificates, and a leaf reaches one of them only if every intermediate on the way
# is served alongside the leaf. A retained certificate file that carries the leaf alone,
# or one issued by a root other than the configured internalca_peer_ca_certificate,
# therefore cannot be validated - and the peer CA guard establishes only that the setting
# is off its default, never that the configured root is this certificate's issuer.
#
# Checked here rather than at the first handshake: without it the run continues into the
# service roles and dies on a bare "Can't contact LDAP server" from the first ldapmodify,
# with nothing naming the certificate. The internalCA play is any_errors_fatal, so a
# refusal here aborts the run for every host before the database is migrated - on a
# distributed installation as well, where only the middleware host reaches this check.
# What it cannot undo is the switch to the maintenance site, which roles/common performs
# earlier in the run; the endpoints stay on it until an upgrade completes.
#
# community.crypto cannot answer this - x509_certificate_info reads one certificate and
# does not build chains - so openssl verify is used, as in validate-apache-intermediates.yml.
#
# openssl refuses for more reasons than a broken chain, and the advice differs, so the
# caller passes two remedies and this file answers the third case itself:
#   no anchor reached      -> retained_chain_remedy
#   outside its validity   -> retained_chain_replacement_remedy (falls back to the above)
#   input openssl can't read -> answered here, naming the certificate and the anchor file
# Handing one remedy to every verdict is what made the first version of this check tell
# the operator of an expired certificate to configure its issuing root.
#
# Inputs, all required except the last two:
#   retained_chain_subject      - what is being checked, e.g. "OpenLDAP" (for the message)
#   retained_chain_certificate  - path to the certificate file the endpoint serves
#   retained_chain_remedy       - the caller's advice for a chain that reaches no anchor
# Optional:
#   retained_chain_replacement_remedy - the caller's advice for a certificate that cannot
#                                 be used at all; falls back to retained_chain_remedy
#   retained_chain_trust_bundle - anchors to build against; the installed trust bundle by
#                                 default, overridable so roles/tests-integration can
#                                 drive this file against generated certificates
- name: Verify the retained {{ retained_chain_subject }} certificate reaches a trusted anchor
  # The certificate file is passed as -untrusted as well, deliberately: that file is the
  # whole chain the server presents, so a leaf accompanied by its intermediate is accepted
  # while a leaf on its own is not - which is precisely what the client will conclude.
  command:
    argv:
      - openssl
      - verify
      - -CAfile
      - "{{ retained_chain_trust_bundle | default(internalca_trust_bundle, true) }}"
      - -untrusted
      - "{{ retained_chain_certificate }}"
      - "{{ retained_chain_certificate }}"
  register: internalca_retained_chain_verification
  changed_when: false
  failed_when: false
  become: true

- name: Fail when the retained {{ retained_chain_subject }} certificate cannot be validated
  vars:
    # openssl reports the depth, the reason and the file on separate lines. Joined into
    # one sentence because a fail message must not carry a raw newline: it is assembled
    # from folded scalars, and an embedded line break turns the operator's message into
    # something no log line shows whole.
    #
    # Double quoted, not a folded block: YAML decodes \n to a real newline before Jinja
    # sees the expression, while a folded scalar hands Jinja the two characters
    # backslash-n, which split() then never matches - measured, and it left every line
    # break in the message. The line breaks inside the quotes fold to spaces.
    internalca_retained_chain_report: "{{
      (internalca_retained_chain_verification.stderr
        | default(internalca_retained_chain_verification.stdout, true))
      | split('\n') | map('trim') | reject('equalto', '') | join('; ') }}"
    # Three outcomes need three answers, and openssl only says which one it is in prose.
    #
    # Whether it got as far as verifying anything is decided structurally, on the depth
    # line every verification verdict carries ("error 20 at 0 depth lookup: ..."), because
    # a file openssl cannot read never produces one - nothing was compared. The wording of
    # a read failure is deliberately *not* used: it differs per openssl generation, and
    # keying on it is what let this branch fall through once. Measured, all for the same
    # unparseable certificate file - 3.0.13: "Could not read any untrusted certificates
    # from <path>"; 3.5: "Could not find untrusted certificates from <path>"; 1.x: "unable
    # to load certificate". An unmatched read failure lands in the no-anchor branch and
    # blames a missing or garbage file on the issuing CA, which is what the integration
    # test caught on a newer openssl than the one it was written against.
    #
    # The two validity-period phrases are the X509_verify_cert_error_string texts of
    # errors 9 and 10 and have been stable across those same generations, so they stay
    # phrase based - and they are only consulted once openssl has actually verified.
    internalca_retained_chain_verified: >-
      {{ internalca_retained_chain_report is search('error [0-9]+ at [0-9]+ depth') }}
    internalca_retained_chain_input_error: >-
      {{ not (internalca_retained_chain_verified | bool) }}
    internalca_retained_chain_invalid_period: >-
      {{
        internalca_retained_chain_verified | bool
        and (
          internalca_retained_chain_report is search('has expired')
          or internalca_retained_chain_report is search('is not yet valid')
        )
      }}
    # Only the last of the three can be blamed on the trust configuration. A certificate
    # outside its validity period would be refused whatever the anchors are, and an input
    # openssl could not read was never compared to an anchor at all - calling either of
    # them "reaches no anchor" sends the operator to the peer CA setting for nothing.
    #
    # Separate folded scalars and a ternary rather than one expression: adjacent string
    # literals are not concatenated in Jinja, and a folded scalar keeps a backslash
    # verbatim, so an apostrophe inside a Jinja string literal here is a trap.
    internalca_retained_chain_input_verdict: >-
      could not be checked at all - openssl could not read the certificate or the anchors
      it was pointed at, so make both readable and rerun
    internalca_retained_chain_period_verdict: >-
      cannot be used at all - openssl refused it before any anchor was reached
    internalca_retained_chain_anchor_verdict: >-
      cannot be built to any anchor in
      {{ retained_chain_trust_bundle | default(internalca_trust_bundle, true) }}, so the
      {{ product_name }} components that read that bundle - the ldapsearch and ldapmodify
      calls of the installer among them - would reject it. The middleware additionally
      accepts whatever the host itself trusts, so logins may still be working; that does
      not let this upgrade continue
    internalca_retained_chain_verdict: >-
      {{
        internalca_retained_chain_input_verdict
        if internalca_retained_chain_input_error | bool
        else internalca_retained_chain_period_verdict
        if internalca_retained_chain_invalid_period | bool
        else internalca_retained_chain_anchor_verdict
      }}
    # No caller remedy fits a file openssl could not read: neither reissuing the
    # certificate nor naming another root makes an unreadable file readable. The two paths
    # involved are known here, so this branch answers for itself.
    internalca_retained_chain_input_remedy: >-
      The two files are {{ retained_chain_certificate }} and
      {{ retained_chain_trust_bundle | default(internalca_trust_bundle, true) }}. OpenSSL
      names the one it stumbled over above; check that it exists, is readable by root and
      holds PEM certificates.
    internalca_retained_chain_advice: >-
      {{
        internalca_retained_chain_input_remedy
        if internalca_retained_chain_input_error | bool
        else (retained_chain_replacement_remedy | default(retained_chain_remedy, true))
        if internalca_retained_chain_invalid_period | bool
        else retained_chain_remedy
      }}
  fail:
    msg: >-
      The customer managed {{ retained_chain_subject }} certificate kept on
      {{ inventory_hostname }} ({{ retained_chain_certificate }})
      {{ internalca_retained_chain_verdict }}.
      OpenSSL reported: {{ internalca_retained_chain_report }}.
      {{ internalca_retained_chain_advice }}
  when: internalca_retained_chain_verification.rc != 0
