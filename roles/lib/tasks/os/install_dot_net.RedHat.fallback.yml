# fallbacks for install_dot_net.RedHat.yml, entered when the dotnet sdk package could not be
# installed from the configured repos. they are tried in this order:
#   1. drop the dnf cache and retry the configured repos
#   2. add the microsoft package repo and install from there - only with allowRepoChangesForRedhat
#   3. download and run the dotnet-install script - only with allowDotnetScriptInstallForRedhat
- block:
    - name: retry the dotnet installation from the configured repos on RedHat
      block:
        # a partially downloaded rpm, or metadata still advertising builds the mirrors have
        # already replaced, makes every mirror fail; dropping the cache forces both to be
        # refetched and the retries cover transient mirror or proxy hiccups
        - name: drop the dnf cache on RedHat
          command: dnf clean all
          changed_when: false

        - name: install {{ dotnet_package_name }} after dropping the dnf cache on RedHat
          ansible.builtin.dnf:
            name: "{{ dotnet_package_name }}"
            state: present
            update_cache: true
          register: dotnet_install_after_cache_drop_redhat
          until: dotnet_install_after_cache_drop_redhat is succeeded
          retries: 3
          delay: 5
      rescue:
        - name: remember the dotnet installation error after dropping the dnf cache on RedHat
          set_fact:
            dotnet_install_last_error: "{{ ansible_failed_result.msg | default('unknown error') }}"

        - name: report failed dotnet installation after dropping the dnf cache on RedHat
          debug:
            msg:
              - "{{ dotnet_package_name }} could not be installed after dropping the dnf cache: {{ dotnet_install_last_error }}"

        # adding the microsoft repo and its gpg key changes the package sources of the host.
        # hardened setups keep the package sources under the control of their OS team and
        # expect every package to come from the local repo, so it needs to be requested
        - name: skip the microsoft package repo on RedHat
          debug:
            msg:
              - "The microsoft package repo is not added because allowRepoChangesForRedhat is false."
              - "Set -e allowRepoChangesForRedhat=true to allow the {{ product_name }} installer to add it."
          when: not (allowRepoChangesForRedhat | default(false) | bool)

        - name: install dotnet sdk {{ dotnet_version }} from the microsoft repo on RedHat
          when: allowRepoChangesForRedhat | default(false) | bool
          block:
            - name: get package list from microsoft for RedHat
              get_url:
                url: "https://packages.microsoft.com/config/rhel/{{ distribution_version }}/{{ dotnet_rpm_name }}"
                dest: "{{ lib_tmp_dir }}/{{ dotnet_rpm_name }}"
                mode: "0644"
              register: dotnet_ms_repo_download_redhat
              until: dotnet_ms_repo_download_redhat is succeeded
              retries: 3
              delay: 5

            - name: import Microsoft RPM GPG key for RedHat
              rpm_key:
                state: present
                key: "https://packages.microsoft.com/keys/microsoft.asc"

            - name: install ms package list for RedHat
              yum:
                name: "{{ lib_tmp_dir }}/{{ dotnet_rpm_name }}"
                state: present

            - name: remove package list file for RedHat
              file:
                dest: "{{ lib_tmp_dir }}/{{ dotnet_rpm_name }}"
                state: absent

            - name: check for the microsoft repo definition on RedHat
              stat:
                path: "{{ dotnet_ms_repo_file }}"
              register: dotnet_ms_repo_file_check

            # without this the dotnet packages of the configured repos usually win the version
            # comparison against the microsoft ones and the transaction fails again
            - name: prefer microsoft packages for dotnet on RedHat
              ini_file:
                path: "{{ dotnet_ms_repo_file }}"
                section: "{{ dotnet_ms_repo_id }}"
                option: "{{ item.option }}"
                value: "{{ item.value }}"
                mode: "0644"
              loop: "{{ dotnet_ms_repo_preferences }}"
              when: dotnet_ms_repo_file_check.stat.exists

            - name: install {{ dotnet_package_name }} from the microsoft repo on RedHat
              package:
                name: "{{ dotnet_package_name }}"
                state: present
          rescue:
            - name: remember the dotnet installation error of the microsoft repo on RedHat
              set_fact:
                dotnet_install_last_error: "{{ ansible_failed_result.msg | default('unknown error') }}"

            - name: report failed dotnet installation from the microsoft repo on RedHat
              debug:
                msg:
                  - "{{ dotnet_package_name }} could not be installed from the microsoft repo: {{ dotnet_install_last_error }}"

            - name: install dotnet sdk {{ dotnet_version }} with the dotnet-install script on RedHat
              include_tasks: os/install_dot_net.RedHat.script.yml

        - name: install dotnet sdk {{ dotnet_version }} with the dotnet-install script on RedHat
          include_tasks: os/install_dot_net.RedHat.script.yml
          when: not (allowRepoChangesForRedhat | default(false) | bool)

  become: true
  environment: "{{ proxy_env }}"
