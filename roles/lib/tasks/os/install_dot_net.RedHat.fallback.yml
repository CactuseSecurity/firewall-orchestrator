# fallbacks for install_dot_net.RedHat.yml, entered when the dotnet sdk package could not be
# installed from the configured repos. they are tried in this order:
#   1. drop the cached rpms and retry the repos that offer the package
#   2. add the microsoft package repo and install from there - only with allowRepoChangesForRedhat
#   3. download and run the dotnet-install script - only with allowDotnetScriptInstallForRedhat
- block:
    - name: retry the dotnet installation from the configured repos on RedHat
      block:
        # the retry is pinned to the repos that actually offer the package. a third party repo
        # whose metadata cannot be refreshed fails the whole transaction otherwise, although it
        # has nothing to do with dotnet, and its error then hides the real one
        - name: find the repos offering {{ dotnet_package_name }} on RedHat
          command: >-
            dnf --quiet repoquery --queryformat %{repoid}
            --setopt=*.skip_if_unavailable=1 {{ dotnet_package_name }}
          register: dotnet_repoquery_redhat
          changed_when: false
          failed_when: false

        - name: set the repos used for the dotnet retry on RedHat
          set_fact:
            dotnet_retry_repos: "{{ dotnet_repoquery_redhat.stdout_lines | default([]) | map('trim') | select | unique | list }}"

        # a truncated rpm left behind by the failed attempt makes every mirror fail again. only
        # the cached rpms are dropped: "dnf clean all" takes the metadata of every repo with it
        # and leaves the host unable to run dnf at all until each of them is reachable again
        - name: drop the cached rpms on RedHat
          command: dnf clean packages
          changed_when: true

        # metadata still advertising builds the mirrors have already replaced fails the same way,
        # so the metadata is refreshed too - but only for the repos the retry is pinned to
        - name: install {{ dotnet_package_name }} after dropping the cached rpms on RedHat
          ansible.builtin.dnf:
            name: "{{ dotnet_package_name }}"
            state: present
            disablerepo: "{{ '*' if dotnet_retry_repos | length > 0 else omit }}"
            enablerepo: "{{ dotnet_retry_repos if dotnet_retry_repos | length > 0 else omit }}"
            update_cache: "{{ dotnet_retry_repos | length > 0 }}"
          register: dotnet_install_after_cache_drop_redhat
          # a permanent refusal - "all mirrors were already tried", a 403 or a 404 - answers every
          # attempt the same way, so only transient errors are worth the retries
          until: >-
            dotnet_install_after_cache_drop_redhat is succeeded
            or ([dotnet_install_after_cache_drop_redhat.msg | default('')] | flatten | join(' ')) is not search(redhat_repo_transient_failure_pattern)
          retries: 3
          delay: 5
      rescue:
        - name: remember the dotnet installation error after dropping the cached rpms on RedHat
          set_fact:
            dotnet_install_last_error: "{{ ([ansible_failed_result.msg | default('unknown error')] | flatten | join(' ')) }}"
            dotnet_install_first_error: "{{ dotnet_install_first_error | default(([ansible_failed_result.msg | default('unknown error')] | flatten | join(' ')), true) }}"
            dotnet_install_error_chain: "{{ (dotnet_install_error_chain | default([])) + ['after dropping the cached rpms: ' ~ ([ansible_failed_result.msg | default('unknown error')] | flatten | join(' '))] }}"

        # the point release hint may only be shown when this retry really got as far as the
        # packages, which it did not when it already failed on the metadata of a repo
        - name: remember whether the dotnet retry reached the packages on RedHat
          set_fact:
            dotnet_install_cache_retry_reached_packages: >-
              {{ dotnet_install_last_error is search(redhat_repo_download_failure_pattern)
                 and dotnet_install_last_error is not search(redhat_repo_metadata_failure_pattern) }}

        - name: report failed dotnet installation after dropping the cached rpms on RedHat
          debug:
            msg:
              - "{{ dotnet_package_name }} could not be installed after dropping the cached rpms: {{ dotnet_install_last_error }}"

        # adding the microsoft repo and its gpg key changes the package sources of the host.
        # hardened setups keep the package sources under the control of their OS team and
        # expect every package to come from the local repo, so it needs to be requested
        - name: skip the microsoft package repo on RedHat
          debug:
            msg:
              - "The microsoft package repo is not added because allowRepoChangesForRedhat is false."
              - "Set -e allowRepoChangesForRedhat=true to allow the {{ product_name }} installer to add it."
          when: not (allowRepoChangesForRedhat | default(false) | bool)

        - name: install dotnet sdk {{ dotnet_version }} from the microsoft repo on RedHat
          when: allowRepoChangesForRedhat | default(false) | bool
          block:
            - name: get package list from microsoft for RedHat
              get_url:
                url: "https://packages.microsoft.com/config/rhel/{{ distribution_version }}/{{ dotnet_rpm_name }}"
                dest: "{{ lib_tmp_dir }}/{{ dotnet_rpm_name }}"
                mode: "0644"
              register: dotnet_ms_repo_download_redhat
              until: dotnet_ms_repo_download_redhat is succeeded
              retries: 3
              delay: 5

            - name: import Microsoft RPM GPG key for RedHat
              rpm_key:
                state: present
                key: "https://packages.microsoft.com/keys/microsoft.asc"

            - name: install ms package list for RedHat
              yum:
                name: "{{ lib_tmp_dir }}/{{ dotnet_rpm_name }}"
                state: present

            - name: remove package list file for RedHat
              file:
                dest: "{{ lib_tmp_dir }}/{{ dotnet_rpm_name }}"
                state: absent

            - name: check for the microsoft repo definition on RedHat
              stat:
                path: "{{ dotnet_ms_repo_file }}"
              register: dotnet_ms_repo_file_check

            # without this the dotnet packages of the configured repos usually win the version
            # comparison against the microsoft ones and the transaction fails again
            - name: prefer microsoft packages for dotnet on RedHat
              ini_file:
                path: "{{ dotnet_ms_repo_file }}"
                section: "{{ dotnet_ms_repo_id }}"
                option: "{{ item.option }}"
                value: "{{ item.value }}"
                mode: "0644"
              loop: "{{ dotnet_ms_repo_preferences }}"
              when: dotnet_ms_repo_file_check.stat.exists

            - name: install {{ dotnet_package_name }} from the microsoft repo on RedHat
              package:
                name: "{{ dotnet_package_name }}"
                state: present
          rescue:
            - name: remember the dotnet installation error of the microsoft repo on RedHat
              set_fact:
                dotnet_install_last_error: "{{ ([ansible_failed_result.msg | default('unknown error')] | flatten | join(' ')) }}"
                dotnet_install_first_error: "{{ dotnet_install_first_error | default(([ansible_failed_result.msg | default('unknown error')] | flatten | join(' ')), true) }}"
                dotnet_install_error_chain: "{{ (dotnet_install_error_chain | default([])) + ['microsoft repo: ' ~ ([ansible_failed_result.msg | default('unknown error')] | flatten | join(' '))] }}"

            - name: report failed dotnet installation from the microsoft repo on RedHat
              debug:
                msg:
                  - "{{ dotnet_package_name }} could not be installed from the microsoft repo: {{ dotnet_install_last_error }}"

            - name: install dotnet sdk {{ dotnet_version }} with the dotnet-install script on RedHat
              include_tasks: os/install_dot_net.RedHat.script.yml

        - name: install dotnet sdk {{ dotnet_version }} with the dotnet-install script on RedHat
          include_tasks: os/install_dot_net.RedHat.script.yml
          when: not (allowRepoChangesForRedhat | default(false) | bool)

  become: true
  environment: "{{ proxy_env }}"
