- block:
    - name: set RedHat distribution version
      set_fact:
        distribution_version: "{{ ansible_facts['distribution_major_version'] }}"

    - name: set dotnet package name
      set_fact:
        dotnet_package_name: "dotnet-sdk-{{ dotnet_version }}"

    - name: check for an already installed dotnet sdk {{ dotnet_version }} on RedHat
      command: dotnet --list-sdks
      register: dotnet_sdks_installed_redhat
      changed_when: false
      failed_when: false

    - name: set dotnet sdk installation state fact for RedHat
      set_fact:
        dotnet_sdk_already_installed: "{{ (dotnet_sdks_installed_redhat.stdout | default('')) is search('(?m)^' ~ (dotnet_version | regex_escape) ~ '\\.') }}"

    - name: skip dotnet installation because dotnet sdk {{ dotnet_version }} is already present
      debug:
        msg: "dotnet sdk {{ dotnet_version }} is already installed, skipping installation."
      when: dotnet_sdk_already_installed | bool

    - name: install dotnet sdk {{ dotnet_version }} on RedHat
      when:
        - ansible_architecture == "x86_64"
        - not dotnet_sdk_already_installed | bool
      block:
        - name: install {{ dotnet_package_name }} from the configured repos on RedHat
          package:
            name: "{{ dotnet_package_name }}"
            state: present
      rescue:
        # the configured repos may know the package from their metadata but still be unable to
        # deliver it (expired entitlement, lazily synced satellite/capsule mirror, blocking proxy),
        # so falling back to the microsoft repo is needed even when the package was listed as available
        - name: report failed dotnet installation from the configured repos on RedHat
          debug:
            msg:
              - "{{ dotnet_package_name }} could not be installed from the configured repos: {{ ansible_failed_result.msg | default('unknown error') }}"
              - "Falling back to the microsoft package repo."

        - name: get package list from microsoft for RedHat
          get_url:
            url: "https://packages.microsoft.com/config/rhel/{{ distribution_version }}/{{ dotnet_rpm_name }}"
            dest: "{{ lib_tmp_dir }}/{{ dotnet_rpm_name }}"
            mode: "0644"
          register: dotnet_ms_repo_download_redhat
          until: dotnet_ms_repo_download_redhat is succeeded
          retries: 3
          delay: 5

        - name: import Microsoft RPM GPG key for RedHat
          rpm_key:
            state: present
            key: "https://packages.microsoft.com/keys/microsoft.asc"

        - name: install ms package list for RedHat
          yum:
            name: "{{ lib_tmp_dir }}/{{ dotnet_rpm_name }}"
            state: present

        - name: remove package list file for RedHat
          file:
            dest: "{{ lib_tmp_dir }}/{{ dotnet_rpm_name }}"
            state: absent

        - name: check for the microsoft repo definition on RedHat
          stat:
            path: "{{ dotnet_ms_repo_file }}"
          register: dotnet_ms_repo_file_check

        # without this the dotnet packages of the configured repos usually win the version
        # comparison against the microsoft ones and the transaction fails again
        - name: prefer microsoft packages for dotnet on RedHat
          ini_file:
            path: "{{ dotnet_ms_repo_file }}"
            section: "{{ dotnet_ms_repo_id }}"
            option: "{{ item.option }}"
            value: "{{ item.value }}"
            mode: "0644"
          loop: "{{ dotnet_ms_repo_preferences }}"
          when: dotnet_ms_repo_file_check.stat.exists

        - name: install dotnet sdk {{ dotnet_version }} from the microsoft repo on RedHat
          block:
            - name: install {{ dotnet_package_name }} from the microsoft repo on RedHat
              package:
                name: "{{ dotnet_package_name }}"
                state: present
          rescue:
            - name: report failed dotnet installation from the microsoft repo on RedHat
              debug:
                msg:
                  - "{{ dotnet_package_name }} could not be installed from the microsoft repo: {{ ansible_failed_result.msg | default('unknown error') }}"
                  - "Falling back to the dotnet install script."

            # the script is fetched from the internet and executed as root, and it installs
            # outside package management, so it stays opt-in on RedHat where the configured
            # repos and the microsoft repo are the supported ways to get the sdk
            - name: fail when the dotnet install script is not allowed on RedHat
              fail:
                msg:
                  - "{{ dotnet_package_name }} could not be installed from the configured repos or from the microsoft repo."
                  - "The remaining fallback downloads {{ dotnet_install_script_url }} and executes it as root, which is not done unless it is requested."
                  - "Either install the dotnet SDK {{ dotnet_version }} manually before running the installer, or set -e allowDotnetScriptInstallForRedhat=true to allow the FWORCH installer to use the dotnet install script."
              when: not (allowDotnetScriptInstallForRedhat | default(false) | bool)

            - name: download dotnet-install script for RedHat
              get_url:
                url: "{{ dotnet_install_script_url }}"
                dest: "{{ lib_tmp_dir }}/dotnet-install.sh"
                mode: "0755"
                checksum: "{{ dotnet_install_script_checksum | default(omit, true) }}"
              register: dotnet_install_script_download_redhat
              until: dotnet_install_script_download_redhat is succeeded
              retries: 3
              delay: 5

            - name: install dotnet sdk {{ dotnet_version }} with dotnet-install script on RedHat
              command: "{{ lib_tmp_dir }}/dotnet-install.sh --channel {{ dotnet_version }} --quality ga --install-dir {{ dotnet_script_install_dir }}"

            - name: mark the dotnet installation as script based on RedHat
              copy:
                dest: "{{ dotnet_script_install_marker }}"
                content: |
                  Installed by the {{ product_name }} installer with {{ dotnet_install_script_url }},
                  outside of package management. {{ dotnet_script_install_dir }} and
                  {{ dotnet_binary_link }} are removed by the {{ product_name }} uninstall.
                mode: "0644"

            - name: ensure dotnet symlink exists on RedHat
              file:
                src: "{{ dotnet_script_install_dir }}/dotnet"
                dest: "{{ dotnet_binary_link }}"
                state: link
                force: true

    - name: verify dotnet sdk {{ dotnet_version }} is installed on RedHat
      command: dotnet --list-sdks
      register: dotnet_sdks_after_install_redhat
      changed_when: false
      failed_when: (dotnet_sdks_after_install_redhat.stdout | default('')) is not search('(?m)^' ~ (dotnet_version | regex_escape) ~ '\\.')
      when: ansible_architecture == "x86_64"

    - debug:
        msg:
          - "NOTE: you need to install dotnet yourself for architectures other than x86_64 before running FWO installer"
      when: ansible_architecture != "x86_64"

  become: true
  environment: "{{ proxy_env }}"
