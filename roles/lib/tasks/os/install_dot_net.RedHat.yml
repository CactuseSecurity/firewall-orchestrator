- block:
    - name: set RedHat distribution version
      set_fact:
        distribution_version: "{{ ansible_facts['distribution_major_version'] }}"

    - name: set dotnet package name
      set_fact:
        dotnet_package_name: "dotnet-sdk-{{ dotnet_version }}"

    - name: check whether {{ dotnet_package_name }} is available from configured repos
      command: "dnf list {{ dotnet_package_name }}"
      register: dotnet_local_repo_check
      changed_when: false
      failed_when: false

    - name: add microsoft package repo only when {{ dotnet_package_name }} is not available locally
      when: dotnet_local_repo_check.rc != 0
      block:
        - name: get package list from microsoft for RedHat
          get_url:
            url: "https://packages.microsoft.com/config/rhel/{{ distribution_version }}/{{ dotnet_rpm_name }}"
            dest: "{{ lib_tmp_dir }}/{{ dotnet_rpm_name }}"
            mode: "0644"
          register: dotnet_ms_repo_download_redhat
          until: dotnet_ms_repo_download_redhat is succeeded
          retries: 3
          delay: 5

        - name: require a pinned Microsoft signing key for RedHat {{ distribution_version }}
          assert:
            that: dotnet_ms_signing_keys[distribution_version | string] is defined
            fail_msg: >-
              No Microsoft signing key is pinned for Red Hat {{ distribution_version }}: add its url and fingerprint to
              dotnet_ms_signing_keys in inventory/group_vars/all.yml.

        - name: import Microsoft RPM GPG key for RedHat
          rpm_key:
            state: present
            key: "{{ dotnet_ms_signing_keys[distribution_version | string].url }}"
            fingerprint: "{{ dotnet_ms_signing_keys[distribution_version | string].fingerprint }}"

        # the package runs scripts as root on installation, so it is only installed with a valid signature
        - name: verify the signature of the ms package list for RedHat
          command:
            argv:
              - rpmkeys
              - --checksig
              - "{{ lib_tmp_dir }}/{{ dotnet_rpm_name }}"
          register: dotnet_ms_repo_signature_redhat
          changed_when: false
          failed_when: dotnet_ms_repo_signature_redhat.rc != 0 or 'signatures OK' not in dotnet_ms_repo_signature_redhat.stdout

        - name: install ms package list for RedHat
          yum:
            name: "{{ lib_tmp_dir }}/{{ dotnet_rpm_name }}"
            state: present

        - name: remove package list file for RedHat
          file:
            dest: "{{ lib_tmp_dir }}/{{ dotnet_rpm_name }}"
            state: absent

    - name: Install dotnet-sdk-{{ dotnet_version }} on RedHat
      package:
        name: "{{ dotnet_package_name }}"
        state: present
      when: ansible_facts['architecture'] == "x86_64"

    - debug:
        msg:
          - "NOTE: you need to install dotnet yourself for architectures other than x86_64 before running FWO installer"
      when: ansible_facts['architecture'] != "x86_64"

  become: true
  environment: "{{ proxy_env }}"
