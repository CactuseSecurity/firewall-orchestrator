- block:
    - name: set RedHat distribution version
      set_fact:
        distribution_version: "{{ ansible_facts['distribution_major_version'] }}"

    - name: set dotnet package name
      set_fact:
        dotnet_package_name: "dotnet-sdk-{{ dotnet_version }}"

    - name: check for an already installed dotnet sdk {{ dotnet_version }} on RedHat
      command: dotnet --list-sdks
      register: dotnet_sdks_installed_redhat
      changed_when: false
      failed_when: false

    - name: set dotnet sdk installation state fact for RedHat
      set_fact:
        dotnet_sdk_already_installed: "{{ (dotnet_sdks_installed_redhat.stdout | default('')) is search('(?m)^' ~ (dotnet_version | regex_escape) ~ '\\.') }}"

    - name: skip dotnet installation because dotnet sdk {{ dotnet_version }} is already present
      debug:
        msg: "dotnet sdk {{ dotnet_version }} is already installed, skipping installation."
      when: dotnet_sdk_already_installed | bool

    - name: install dotnet sdk {{ dotnet_version }} on RedHat
      when:
        - ansible_architecture == "x86_64"
        - not dotnet_sdk_already_installed | bool
      block:
        - name: install {{ dotnet_package_name }} from the configured repos on RedHat
          package:
            name: "{{ dotnet_package_name }}"
            state: present
      rescue:
        # the configured repos may know the package from their metadata but still be unable to
        # deliver it (expired entitlement, lazily synced satellite/capsule mirror, blocking proxy),
        # so the fallbacks are needed even when the package was listed as available
        # the fallbacks and the final error message need the original dnf error, and every
        # nested rescue overwrites ansible_failed_result, so it is kept in facts of its own.
        # every attempt can fail for a reason of its own, so all of them are collected: the first
        # error is the one that describes the dotnet problem and selects the hints, while the
        # later ones can be about a repository that has nothing to do with the dotnet packages
        - name: remember the dotnet installation error of the configured repos on RedHat
          set_fact:
            dotnet_install_last_error: "{{ ([ansible_failed_result.msg | default('unknown error'), ansible_failed_result.failures | default([]), ansible_failed_result.results | default([])] | flatten | join(' ')) }}"
            dotnet_install_first_error: "{{ dotnet_install_first_error | default(([ansible_failed_result.msg | default('unknown error'), ansible_failed_result.failures | default([]), ansible_failed_result.results | default([])] | flatten | join(' ')), true) }}"
            dotnet_install_error_chain: "{{ (dotnet_install_error_chain | default([])) + ['configured repos: ' ~ ([ansible_failed_result.msg | default('unknown error'), ansible_failed_result.failures | default([]), ansible_failed_result.results | default([])] | flatten | join(' '))] }}"

        - name: report failed dotnet installation from the configured repos on RedHat
          debug:
            msg:
              - "{{ dotnet_package_name }} could not be installed from the configured repos: {{ dotnet_install_last_error }}"
              - "Dropping the cached rpms and retrying the repos that offer it, then falling back to the microsoft package repo."

        # the fallbacks are three attempts nested into each other, so they live in a file of
        # their own instead of indenting the whole chain into this rescue
        - name: run the dotnet installation fallbacks on RedHat
          include_tasks: os/install_dot_net.RedHat.fallback.yml

    - name: verify dotnet sdk {{ dotnet_version }} is installed on RedHat
      command: dotnet --list-sdks
      register: dotnet_sdks_after_install_redhat
      changed_when: false
      failed_when: (dotnet_sdks_after_install_redhat.stdout | default('')) is not search('(?m)^' ~ (dotnet_version | regex_escape) ~ '\\.')
      when: ansible_architecture == "x86_64"

    - debug:
        msg:
          - "NOTE: you need to install dotnet yourself for architectures other than x86_64 before running FWO installer"
      when: ansible_architecture != "x86_64"

  become: true
  environment: "{{ proxy_env | combine({'LANG': 'C', 'LC_ALL': 'C'}) }}"
