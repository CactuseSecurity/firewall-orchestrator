---
- name: install Podman runtime
  package:
    name: podman
    state: present
  become: true

- name: disable rootless Podman user socket globally
  ansible.builtin.systemd:
    name: podman.socket
    scope: global
    enabled: false
  become: true

- name: mask rootless Podman user socket globally
  ansible.builtin.systemd:
    name: podman.socket
    scope: global
    masked: true
  become: true
