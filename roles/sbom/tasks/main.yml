---
- name: warn when SBOM reference platform is not Debian testing
  debug:
    msg:
      - "SBOM reference platform is {{ sbom_reference_platform }}."
      - "Issue #2919 expects Debian testing/Trixie for the exact installed SBOM."
  when: sbom_reference_platform != 'debian-testing'

- name: ensure SBOM output directory exists
  file:
    path: "{{ sbom_output_dir }}"
    state: directory
    owner: "{{ fworch_user }}"
    group: "{{ fworch_group }}"
    mode: "0750"
  become: true

- name: remove existing combined target SBOM
  file:
    path: "{{ sbom_output_dir }}/fwo-combined.cdx.json"
    state: absent
  become: true

- name: remove existing detailed target SBOM files
  file:
    path: "{{ sbom_output_dir }}/fwo-sbom-details"
    state: absent
  become: true

- name: ensure detailed target SBOM directory exists
  file:
    path: "{{ sbom_output_dir }}/fwo-sbom-details"
    state: directory
    owner: "{{ fworch_user }}"
    group: "{{ fworch_group }}"
    mode: "0750"
  become: true

- name: reset controller source SBOM staging directory
  file:
    path: "{{ sbom_controller_source_dir }}/{{ inventory_hostname }}"
    state: absent
  delegate_to: localhost
  become: false

- name: ensure controller source SBOM staging directory exists
  file:
    path: "{{ sbom_controller_source_dir }}/{{ inventory_hostname }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  become: false

- name: generate source SBOMs on controller
  command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/scripts/sbom/generate_sbom.py"
      - "--mode"
      - "source"
      - "--repo-root"
      - "{{ playbook_dir }}"
      - "--output-dir"
      - "{{ sbom_controller_source_dir }}/{{ inventory_hostname }}"
      - "--reference-platform"
      - "{{ sbom_reference_platform }}"
  delegate_to: localhost
  become: false
  changed_when: true

- name: find generated controller source SBOM files
  find:
    paths: "{{ sbom_controller_source_dir }}/{{ inventory_hostname }}"
    patterns: "*.cdx.json"
    file_type: file
  delegate_to: localhost
  become: false
  register: sbom_source_files

- name: copy source SBOM files to target
  copy:
    src: "{{ item.path }}"
    dest: "{{ sbom_output_dir }}/fwo-sbom-details/"
    owner: "{{ fworch_user }}"
    group: "{{ fworch_group }}"
    mode: "0640"
  loop: "{{ sbom_source_files.files }}"
  become: true

- name: generate installed SBOMs and combined SBOM for this host
  script:
    cmd: >-
      {{ playbook_dir }}/scripts/sbom/generate_sbom.py
      --mode installed
      --output-dir {{ sbom_output_dir | quote }}
      --reference-platform {{ sbom_reference_platform | quote }}
      --container {{ api_container_name | quote }}
      --merge
      --merge-existing
    executable: "{{ ansible_python_interpreter }}"
  become: true
  changed_when: true

- name: ensure local SBOM collection directory exists
  file:
    path: "{{ sbom_controller_output_dir }}/{{ inventory_hostname }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  become: false
  when: sbom_fetch_to_controller|bool

- name: find generated combined SBOM file
  find:
    paths: "{{ sbom_output_dir }}"
    patterns: "fwo-combined.cdx.json"
    file_type: file
  register: sbom_generated_files
  when: sbom_fetch_to_controller|bool

- name: fetch combined SBOM file to controller
  fetch:
    src: "{{ item.path }}"
    dest: "{{ sbom_controller_output_dir }}/{{ inventory_hostname }}/"
    flat: true
  loop: "{{ sbom_generated_files.files }}"
  when: sbom_fetch_to_controller|bool

- name: ensure local detailed SBOM collection directory exists
  file:
    path: "{{ sbom_controller_output_dir }}/{{ inventory_hostname }}/fwo-sbom-details"
    state: directory
    mode: "0750"
  delegate_to: localhost
  become: false
  when: sbom_fetch_to_controller|bool

- name: find generated detailed SBOM files
  find:
    paths: "{{ sbom_output_dir }}/fwo-sbom-details"
    patterns: "*.cdx.json"
    file_type: file
  register: sbom_generated_detail_files
  when: sbom_fetch_to_controller|bool

- name: fetch detailed SBOM files to controller
  fetch:
    src: "{{ item.path }}"
    dest: "{{ sbom_controller_output_dir }}/{{ inventory_hostname }}/fwo-sbom-details/"
    flat: true
  loop: "{{ sbom_generated_detail_files.files }}"
  when: sbom_fetch_to_controller|bool
