
- name: install packages necessary for testing
  package:
    name: "{{ item }}"
    state: present
  loop: "{{ test_packages }}"
  become: true
  environment: "{{ proxy_env }}"

- name: Read the configured middleware URI
  ansible.builtin.slurp:
    src: "{{ fworch_conf_file }}"
  register: test_fwo_config_file
  become: true

- name: Parse the configured middleware URI
  ansible.builtin.set_fact:
    test_middleware_uri: >-
      {{ (test_fwo_config_file.content | b64decode | from_json).middleware_uri }}

- name: Derive the configured HTTPS middleware endpoint
  ansible.builtin.set_fact:
    test_middleware_host: "{{ test_middleware_uri | urlsplit('hostname') }}"
    test_middleware_port: "{{ (test_middleware_uri | urlsplit('port')) | default(443, true) }}"

- name: Require an HTTPS middleware endpoint in the FWO configuration
  ansible.builtin.assert:
    that:
      - test_middleware_uri | urlsplit('scheme') == 'https'
      - test_middleware_host | length > 0
    fail_msg: >-
      {{ fworch_conf_file }} must define middleware_uri as an HTTPS Apache
      endpoint, but contains {{ test_middleware_uri }}.

- name: randomize test names to avoid interference with production data
  set_fact:
    test_postfix: "_test_{{ randomly_generated_pwd }}"

# todo: is this play needless?
- name: set postfix to brand all objects in this test run
  set_fact:
    sample_postfix: "{{ test_postfix }}"

- name: create test user1 password
  set_fact:
    test_user1_pw: "{{ randomly_generated_pwd }}"

- name: create test user2 password
  set_fact:
    test_user2_pw: "{{ randomly_generated_pwd }}"

- name: initialize handler for deleting test data
  set_fact:
    test_importer_handler_guard: start
  changed_when: true
  notify:
  - test importer handler

- name: include test data
  include_role:
    name: sample-data
  vars:
    sample_role_purpose: test
    sample_fortigate_name: "{{ test_fortigate_name }}"
    sample_checkpoint_name: "{{ test_checkpoint_name }}"
    sample_config_user: fworchtest
    # sample_config_user_home: "/home/{{ sample_config_user }}"
  when: "'sampleserver' in group_names"

- name: include test auth data
  include_role:
    name: sample-auth-data
  vars:
    sample_postfix: "{{ test_postfix }}"
    sample_role_purpose: test
    sample_user1_pw: "{{ test_user1_pw }}"
    sample_user2_pw: "{{ test_user2_pw }}"
  when: "'middlewareserver' in group_names"

- name: database testing
  import_tasks: test-database.yml
  when: "'databaseserver' in group_names"

- name: create config with test user creds
  import_tasks: write-config-test-user-creds.yml

- name: auth testing
  import_tasks: test-auth.yml
  when: "'middlewareserver' in group_names"

- name: api testing
  import_tasks: test-api.yml
  when: "'apiserver' in group_names"

- name: imorter testing
  import_tasks: test-importer.yml
  when: "'sampleserver' in group_names"

- name: testing all exposed web services
  import_tasks: test-web.yml

- name: systemd unit testing
  import_tasks: test-systemd-units.yml

- name: internal service listener testing
  import_tasks: test-internal-service-listeners.yml

- name: Apache TLS key preflight testing
  import_tasks: test-apache-tls-key-preflight.yml
  when: "['frontends', 'middlewareserver', 'apiserver'] | intersect(group_names) | length > 0"

- name: Apache intermediate chain configuration testing
  import_tasks: test-apache-intermediate-chain.yml
  when: "['frontends', 'middlewareserver', 'apiserver'] | intersect(group_names) | length > 0"

- name: Apache endpoint name coverage testing
  import_tasks: test-apache-endpoint-names.yml
  when: "['frontends', 'middlewareserver', 'apiserver'] | intersect(group_names) | length > 0"

- name: finalize handler for deleting test data
  set_fact:
    test_importer_handler_guard: stop
  changed_when: true
  notify: "test importer handler"

- name: delete ldif files
  file:
    path: "{{  middleware_ldif_dir }}"
    state: absent
  become: true
  when: "'middlewareserver' in group_names"
