---
# Every FWO client verifies the endpoints it talks to against the trust bundle, so an
# Apache certificate that does not carry the name its endpoint is addressed under takes
# the installation down - and does it with a TLS host name mismatch at the caller, far
# from the certificate that caused it. The names are read from the deployed
# configuration and the inventory rather than rebuilt here, so this fails exactly when
# the served identity and the endpoint it serves have drifted apart, which is what an
# upgrade that renames an endpoint does to a certificate that is still valid.
#
# The name sources are this file's own and deliberately differ from the preflight's - it
# reads what was actually written to fworch.json, the preflight reads what the inventory
# asks for. The *matching* is not this file's own: it drives
# roles/internalCA/tasks/validate-retained-certificate.yml. Keeping a second copy of the
# classification here is what let the two part company once already, when an IP literal
# containing a colon stayed a dNSName on this side after the preflight had learned to
# emit it as an iPAddress - so the late check rejected at the end of a run what the
# preflight had accepted in its first minute.
- name: Read the Apache certificate this host serves
  community.crypto.x509_certificate_info:
    path: "{{ internalca_apache_certificate }}"
  register: test_apache_certificate
  changed_when: false
  become: true

- name: Collect the names this host's FWO endpoints are addressed under
  set_fact:
    test_apache_endpoint_names: >-
      {{
        ([{'setting': 'middleware_uri', 'name': test_fwo_config.middleware_uri | urlsplit('hostname')}]
          if 'middlewareserver' in group_names else [])
        + ([{'setting': 'api_uri', 'name': test_fwo_config.api_uri | urlsplit('hostname')}]
          if 'apiserver' in group_names else [])
        + ([{'setting': 'ui_hostname', 'name': ui_hostname}]
          if 'frontends' in group_names else [])
      }}
  vars:
    test_fwo_config: "{{ test_fwo_config_file.content | b64decode | from_json }}"

- name: Require the Apache certificate to cover every configured endpoint name
  include_tasks: "{{ role_path }}/../internalCA/tasks/validate-retained-certificate.yml"
  vars:
    retained_certificate_subject: Apache
    retained_certificate_path: "{{ internalca_apache_certificate }}"
    retained_certificate_info: "{{ test_apache_certificate }}"
    # Deduplicated, because on a single-host installation all three endpoints resolve to
    # the same name - that is the shipped inventory - and the shared matcher reports every
    # entry it was given, so without this the message names it three times. Which setting
    # carried which name is not lost: it is in the remedy below.
    retained_certificate_required_names: >-
      {{ test_apache_endpoint_names | map(attribute='name') | unique | list }}
    # The certificate under test here is normally one FWO issued, not one it retained, so
    # the shared message's default opening clause would name it wrongly.
    retained_certificate_lead: >-
      The Apache certificate served on {{ inventory_hostname }}
      ({{ internalca_apache_certificate }})
    # Which setting carried which name is the part of the old per-name message worth
    # keeping: the shared matcher reports every uncovered name at once, so the mapping
    # goes into the remedy instead of into a loop label. Built with an explicit loop
    # because Jinja has no comprehensions.
    retained_certificate_remedy: >-
      Every {{ product_name }} client verifies this endpoint, so all of them fail on a
      host name mismatch until the certificate is reissued for the configured name. This
      host serves {{ test_endpoint_name_settings }}, read from the deployed configuration.
    test_endpoint_name_settings: >-
      {%- set pairs = [] -%}
      {%- for endpoint in test_apache_endpoint_names -%}
        {%- set _ = pairs.append(endpoint.setting ~ '=' ~ endpoint.name) -%}
      {%- endfor -%}
      {{ pairs | join(', ') }}
