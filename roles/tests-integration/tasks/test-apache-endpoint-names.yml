---
# Every FWO client verifies the endpoints it talks to against the trust bundle, so an
# Apache certificate that does not carry the name its endpoint is addressed under takes
# the installation down - and does it with a TLS host name mismatch at the caller, far
# from the certificate that caused it. The names are read from the deployed
# configuration and the inventory rather than rebuilt here, so this fails exactly when
# the served identity and the endpoint it serves have drifted apart, which is what an
# upgrade that renames an endpoint does to a certificate that is still valid.
- name: Read the Apache certificate this host serves
  community.crypto.x509_certificate_info:
    path: "{{ internalca_apache_certificate }}"
  register: test_apache_certificate
  changed_when: false
  become: true

- name: Collect the names this host's FWO endpoints are addressed under
  set_fact:
    test_apache_endpoint_names: >-
      {{
        ([{'setting': 'middleware_uri', 'name': test_fwo_config.middleware_uri | urlsplit('hostname')}]
          if 'middlewareserver' in group_names else [])
        + ([{'setting': 'api_uri', 'name': test_fwo_config.api_uri | urlsplit('hostname')}]
          if 'apiserver' in group_names else [])
        + ([{'setting': 'ui_hostname', 'name': ui_hostname}]
          if 'frontends' in group_names else [])
      }}
  vars:
    test_fwo_config: "{{ test_fwo_config_file.content | b64decode | from_json }}"

# An IP literal is only matched by an iPAddress entry - a dNSName holding the same
# digits is not - so each name is looked up as the entry type it can be matched by,
# the same split roles/internalCA makes when it issues the certificate.
- name: Require the Apache certificate to cover every configured endpoint name
  assert:
    that:
      - >-
        item.name in test_certificate_ip_names
        if item.name is match(test_ipv4_pattern)
        else (
          item.name | lower in test_certificate_dns_names
          or item.name | lower | regex_replace('^[^.]+\.', '*.') in test_certificate_dns_names
        )
    fail_msg: >-
      {{ internalca_apache_certificate }} on {{ inventory_hostname }} is not valid for
      {{ item.name }}, the host name {{ item.setting }} addresses this endpoint under.
      Its subjectAltName holds
      {{ test_apache_certificate.subject_alt_name | default([], true) | join(', ') }}.
      Every FWO client verifies this endpoint, so all of them fail on a host name
      mismatch until the certificate is reissued for the configured name.
  loop: "{{ test_apache_endpoint_names }}"
  loop_control:
    label: "{{ item.setting }}={{ item.name }}"
  vars:
    # Block scalars keep backslashes verbatim, so this pattern uses single backslashes.
    test_ipv4_pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
    # Matched the same way roles/internalCA matches a certificate it retains, or this
    # test rejects at the end of the run what the preflight deliberately accepted in its
    # first minute: DNS names compared case insensitively because the resolver is, and a
    # wildcard accepted for the one label it covers, which is how customer certificates
    # are commonly issued. IP entries stay verbatim - an iPAddress entry is the only one
    # an IP literal matches, and neither case nor wildcards apply to it.
    test_certificate_dns_names: >-
      {{
        test_apache_certificate.subject_alt_name | default([], true) | select('match', '^DNS:')
        | map('regex_replace', '^DNS:', '') | map('lower') | list
      }}
    test_certificate_ip_names: >-
      {{
        test_apache_certificate.subject_alt_name | default([], true) | select('match', '^IP:')
        | map('regex_replace', '^IP:', '') | list
      }}
