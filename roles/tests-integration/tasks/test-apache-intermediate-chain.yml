---
- name: Create a temporary directory for Apache intermediate chain tests
  tempfile:
    state: directory
    prefix: fworch-apache-chain-
  register: test_apache_chain_directory
  become: true

- name: Write certificate extension files for Apache intermediate chain tests
  copy:
    content: "{{ item.content }}"
    dest: "{{ test_apache_chain_directory.path }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - name: intermediate-extensions.cnf
      content: |
        basicConstraints=critical,CA:TRUE,pathlen:0
        keyUsage=critical,keyCertSign,cRLSign
        subjectKeyIdentifier=hash
        authorityKeyIdentifier=keyid,issuer
    - name: leaf-extensions.cnf
      content: |
        basicConstraints=critical,CA:FALSE
        keyUsage=critical,digitalSignature,keyEncipherment
        extendedKeyUsage=serverAuth
        subjectKeyIdentifier=hash
        authorityKeyIdentifier=keyid,issuer
  become: true

- name: Create a root CA for Apache intermediate chain tests
  command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:2048
      - -nodes
      - -keyout
      - "{{ test_apache_chain_directory.path }}/root.key"
      - -out
      - "{{ test_apache_chain_directory.path }}/root.crt"
      - -subj
      - /CN=FWO intermediate chain test root
      - -days
      - "1"
      - -addext
      - basicConstraints=critical,CA:TRUE
      - -addext
      - keyUsage=critical,keyCertSign,cRLSign
  changed_when: false
  become: true

- name: Create an intermediate CA request for Apache intermediate chain tests
  command:
    argv:
      - openssl
      - req
      - -new
      - -newkey
      - rsa:2048
      - -nodes
      - -keyout
      - "{{ test_apache_chain_directory.path }}/intermediate.key"
      - -out
      - "{{ test_apache_chain_directory.path }}/intermediate.csr"
      - -subj
      - /CN=FWO intermediate chain test intermediate
  changed_when: false
  become: true

- name: Sign the intermediate CA for Apache intermediate chain tests
  command:
    argv:
      - openssl
      - x509
      - -req
      - -in
      - "{{ test_apache_chain_directory.path }}/intermediate.csr"
      - -CA
      - "{{ test_apache_chain_directory.path }}/root.crt"
      - -CAkey
      - "{{ test_apache_chain_directory.path }}/root.key"
      - -CAcreateserial
      - -out
      - "{{ test_apache_chain_directory.path }}/intermediate.crt"
      - -days
      - "1"
      - -sha256
      - -extfile
      - "{{ test_apache_chain_directory.path }}/intermediate-extensions.cnf"
  changed_when: false
  become: true

- name: Create an Apache leaf request for intermediate chain tests
  command:
    argv:
      - openssl
      - req
      - -new
      - -newkey
      - rsa:2048
      - -nodes
      - -keyout
      - "{{ test_apache_chain_directory.path }}/leaf.key"
      - -out
      - "{{ test_apache_chain_directory.path }}/leaf.csr"
      - -subj
      - /CN=FWO intermediate chain test leaf
  changed_when: false
  become: true

- name: Sign the Apache leaf for intermediate chain tests
  command:
    argv:
      - openssl
      - x509
      - -req
      - -in
      - "{{ test_apache_chain_directory.path }}/leaf.csr"
      - -CA
      - "{{ test_apache_chain_directory.path }}/intermediate.crt"
      - -CAkey
      - "{{ test_apache_chain_directory.path }}/intermediate.key"
      - -CAcreateserial
      - -out
      - "{{ test_apache_chain_directory.path }}/leaf.crt"
      - -days
      - "1"
      - -sha256
      - -extfile
      - "{{ test_apache_chain_directory.path }}/leaf-extensions.cnf"
  changed_when: false
  become: true

- name: Verify the preflight accepts a complete Apache intermediate chain
  include_tasks:
    file: "{{ role_path }}/../internalCA/tasks/validate-apache-intermediates.yml"
    apply:
      become: true
  vars:
    internalca_apache_chain_leaf_path: "{{ test_apache_chain_directory.path }}/leaf.crt"
    internalca_apache_chain_intermediates_path: "{{ test_apache_chain_directory.path }}/intermediate.crt"
    internalca_apache_chain_root_path: "{{ test_apache_chain_directory.path }}/root.crt"

- name: Verify the preflight rejects an unrelated Apache root
  block:
    - include_tasks: "{{ role_path }}/../internalCA/tasks/validate-apache-intermediates.yml"
      vars:
        internalca_apache_chain_leaf_path: "{{ test_apache_chain_directory.path }}/leaf.crt"
        internalca_apache_chain_intermediates_path: "{{ test_apache_chain_directory.path }}/intermediate.crt"
        internalca_apache_chain_root_path: "{{ internalca_ca_certificate_local }}"
    - set_fact:
        test_apache_invalid_chain_rejected: false
  rescue:
    - set_fact:
        test_apache_invalid_chain_rejected: true
  become: true

- name: Assert the preflight rejected an unrelated Apache root
  assert:
    that:
      - test_apache_invalid_chain_rejected | bool
    fail_msg: The Apache intermediate chain preflight accepted an unrelated root CA.

- name: Select installed FWO Apache configuration files
  set_fact:
    test_apache_tls_configuration_files: >-
      {{
        ([http_conf_dir ~ product_name ~ '-api.conf'] if 'apiserver' in group_names else [])
        + ([http_conf_dir ~ product_name ~ '-mw.conf'] if 'middlewareserver' in group_names else [])
        + ([http_conf_dir ~ product_name ~ '-ui.conf'] if 'frontends' in group_names else [])
      }}

- name: Read installed FWO Apache configuration files
  slurp:
    src: "{{ item }}"
  loop: "{{ test_apache_tls_configuration_files }}"
  register: test_apache_tls_configurations
  become: true

- name: Assert Apache intermediate chain references match the installer setting
  assert:
    that:
      - >-
        (internalca_apache_intermediate_certificates | length > 0
         and expected_apache_chain_directive in (item.content | b64decode))
        or
        (internalca_apache_intermediate_certificates | length == 0
         and 'SSLCertificateChainFile' not in (item.content | b64decode))
    fail_msg: >-
      {{ item.item }} does not match the configured Apache intermediate
      certificate chain reference.
  vars:
    expected_apache_chain_directive: >-
      SSLCertificateChainFile {{ internalca_apache_intermediate_certificates }}
  loop: "{{ test_apache_tls_configurations.results }}"

# Read here rather than reusing the register from roles/internalCA: that role does not
# run under --tags test, and depending on its registers made this file fail with an
# undefined variable instead of an assertion whenever a peer CA was configured.
- name: Read the configured peer CA certificate
  slurp:
    src: "{{ internalca_peer_ca_certificate }}"
  register: test_configured_peer_ca
  become: true
  when: internalca_peer_ca_certificate != internalca_ca_certificate_local

- name: Read the installed FWO trust bundle
  slurp:
    src: "{{ internalca_trust_bundle }}"
  register: test_fwo_trust_bundle
  become: true

- name: Assert the installed FWO trust bundle holds every configured anchor
  assert:
    that:
      - >-
        (test_fwo_trust_bundle.content | b64decode
         | regex_findall('-----BEGIN CERTIFICATE-----') | length)
        == 1 + (test_configured_peer_ca.content | default('') | b64decode
                | regex_findall('-----BEGIN CERTIFICATE-----') | length)
    fail_msg: >-
      {{ internalca_trust_bundle }} does not hold the internal CA plus every certificate
      configured as internalca_peer_ca_certificate.

- name: Verify the installed FWO trust bundle parses
  command:
    argv:
      - openssl
      - crl2pkcs7
      - -nocrl
      - -certfile
      - "{{ internalca_trust_bundle }}"
  changed_when: false
  become: true

# The installed bundle holds a single anchor unless this installation was given a peer
# CA, so the multi-certificate assembly - the only shape in which the PEM line endings
# can break - has to be driven explicitly. This runs the production task file, so a
# regression there fails here; asserting against a bundle the test assembles itself
# would only prove the test's own copy of the idiom.
- name: Assemble a trust bundle from two certificates with the production task
  include_tasks:
    file: "{{ role_path }}/../internalCA/tasks/assemble-trust-bundle.yml"
  vars:
    internalca_bundle_internal_ca_path: "{{ test_apache_chain_directory.path }}/root.crt"
    internalca_bundle_peer_ca_path: "{{ test_apache_chain_directory.path }}/intermediate.crt"
    internalca_bundle_path: "{{ test_apache_chain_directory.path }}/assembled-bundle.crt"

- name: Read the assembled trust bundle
  slurp:
    src: "{{ test_apache_chain_directory.path }}/assembled-bundle.crt"
  register: test_assembled_trust_bundle
  become: true

- name: Assert the assembled trust bundle separates its PEM blocks
  assert:
    that:
      - >-
        (test_assembled_trust_bundle.content | b64decode
         | regex_findall('-----BEGIN CERTIFICATE-----') | length) == 2
      - "'END CERTIFICATE-----BEGIN' not in (test_assembled_trust_bundle.content | b64decode)"
    fail_msg: >-
      The assembled trust bundle does not hold two separately readable PEM certificates.

- name: Convert the test peer certificate to DER
  command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ test_apache_chain_directory.path }}/intermediate.crt"
      - -outform
      - DER
      - -out
      - "{{ test_apache_chain_directory.path }}/intermediate.der"
  changed_when: false
  become: true

# openssl accepts DER, the .NET clients do not. A bundle assembled from one would look
# healthy to every openssl based check and leave the retained endpoint unvalidatable.
- name: Assemble a trust bundle from a DER encoded peer certificate
  block:
    - include_tasks:
        file: "{{ role_path }}/../internalCA/tasks/assemble-trust-bundle.yml"
      vars:
        internalca_bundle_internal_ca_path: "{{ test_apache_chain_directory.path }}/root.crt"
        internalca_bundle_peer_ca_path: "{{ test_apache_chain_directory.path }}/intermediate.der"
        internalca_bundle_path: "{{ test_apache_chain_directory.path }}/der-bundle.crt"
    - name: Record that the DER encoded peer certificate was accepted
      set_fact:
        test_der_peer_ca_accepted: true
  rescue:
    - name: Record that the DER encoded peer certificate was rejected
      set_fact:
        test_der_peer_ca_accepted: false

- name: Assert a DER encoded peer certificate is rejected
  assert:
    that:
      - not (test_der_peer_ca_accepted | bool)
    fail_msg: >-
      The trust bundle assembly accepted a DER encoded peer CA. The .NET clients read the
      bundle as PEM and would silently never see that anchor.

- name: Remove Apache intermediate chain test files
  file:
    path: "{{ test_apache_chain_directory.path }}"
    state: absent
  become: true
