# this playbook contains api tests

- name: test api version
  uri:
    url: https://{{ api_network_listening_ip_address }}:{{ api_web_port }}/api/v1/version
    method: GET
    headers:
      Content-Type: application/json
    body:
      query: ""
    body_format: json
    validate_certs: true
    ca_path: "{{ internalca_trust_bundle }}"
    client_cert: "{{ internalca_client_certificate }}"
    client_key: "{{ internalca_client_private_key }}"
    return_content: true
  register: api_version
  become: true
  changed_when: false
  failed_when: false

- name: api version test output
  assert:
    that:
      - api_version.content is search('version')
    fail_msg: "unexpected version test result (does not contain 'version'): {{ api_version.content }}"

- name: test anonymous api access
  uri:
    url: https://{{ api_network_listening_ip_address }}:{{ api_web_port }}/api/v1/graphql
    method: POST
    headers:
      Content-Type: application/json
      x-hasura-role: anonymous
    body:
      query: "query { object(limit:3) {obj_name} }"
    body_format: json
    validate_certs: true
    ca_path: "{{ internalca_trust_bundle }}"
    client_cert: "{{ internalca_client_certificate }}"
    client_key: "{{ internalca_client_private_key }}"
    return_content: true
  register: api_query_anonymous
  become: true
  changed_when: false
  environment: "{{ proxy_env }}"

- name: anonymous api access output
  assert:
    that:
      - >
        api_query_anonymous.content is search("Missing 'Authorization' or 'Cookie' header in JWT authentication mode")
        or api_query_anonymous.content is search("Missing 'Authorization' or 'Cookie' header")
    fail_msg: 'unexpected version test result (does not contain "Missing ''Authorization'' or ''Cookie'' header in JWT authentication mode"): {{ api_query_anonymous.content }}'

- name: get sample jwt
  uri:
    url: "{{ test_middleware_uri }}api/AuthenticationToken/Get/"
    method: POST
    headers:
      Content-Type: application/json
    body:
      Username: user1{{ test_postfix }}
      Password: "{{ test_user1_pw }}"
    body_format: json
    validate_certs: true
    ca_path: "{{ internalca_trust_bundle }}"
    client_cert: "{{ internalca_client_certificate }}"
    client_key: "{{ internalca_client_private_key }}"
    return_content: true
  register: sample_JWT
  become: true
  changed_when: false
  environment: "{{ proxy_env }}"

- name: test anonymous api access with JWT
  uri:
    url: https://{{ api_network_listening_ip_address }}:{{ api_web_port }}/api/v1/graphql
    method: POST
    headers:
      Content-Type: application/json
      # Remove leading and trailing text of jwt output
      Authorization: Bearer {{ sample_JWT.content }}
    body:
      query: "query text { txt(limit:3) { id } }"
    body_format: json
    validate_certs: true
    ca_path: "{{ internalca_trust_bundle }}"
    client_cert: "{{ internalca_client_certificate }}"
    client_key: "{{ internalca_client_private_key }}"
    return_content: true
  register: api_query_anonymous_with_JWT
  become: true
  changed_when: false
  environment: "{{ proxy_env }}"

- name: anonymous api access with JWT output
  assert:
    that:
      - api_query_anonymous_with_JWT.content is search('id')
    fail_msg: "unexpected version test result (does not contain id): {{ api_query_anonymous_with_JWT.content }}"

# SEC-19: a UI role must not read the security state or directory binding of any user, and reads
# its own security state through the self-only own_* computed fields
- name: test that a UI role cannot read the password history of users
  uri:
    url: https://{{ api_network_listening_ip_address }}:{{ api_web_port }}/api/v1/graphql
    method: POST
    headers:
      Content-Type: application/json
      Authorization: Bearer {{ sample_JWT.content }}
    body:
      query: "query { uiuser { uiuser_id uiuser_pwd_history } }"
    body_format: json
    validate_certs: true
    ca_path: "{{ internalca_trust_bundle }}"
    client_cert: "{{ internalca_client_certificate }}"
    client_key: "{{ internalca_client_private_key }}"
    return_content: true
  register: api_query_uiuser_security_state
  become: true
  changed_when: false
  environment: "{{ proxy_env }}"

- name: UI role password history access output
  assert:
    that:
      - api_query_uiuser_security_state.content is search('uiuser_pwd_history')
      - api_query_uiuser_security_state.content is search('not found')
    fail_msg: "a UI role could read uiuser_pwd_history: {{ api_query_uiuser_security_state.content }}"

- name: test that a UI role reads its own security state
  uri:
    url: https://{{ api_network_listening_ip_address }}:{{ api_web_port }}/api/v1/graphql
    method: POST
    headers:
      Content-Type: application/json
      Authorization: Bearer {{ sample_JWT.content }}
    body:
      query: "query { uiuser { uiuser_id own_password_must_be_changed } }"
    body_format: json
    validate_certs: true
    ca_path: "{{ internalca_trust_bundle }}"
    client_cert: "{{ internalca_client_certificate }}"
    client_key: "{{ internalca_client_private_key }}"
    return_content: true
  register: api_query_uiuser_own_state
  become: true
  changed_when: false
  environment: "{{ proxy_env }}"

- name: UI role own security state output
  assert:
    that:
      - api_query_uiuser_own_state.content is search('own_password_must_be_changed')
      - api_query_uiuser_own_state.content is not search('errors')
    fail_msg: "a UI role could not read its own security state: {{ api_query_uiuser_own_state.content }}"

# Todo: this only works if the hasura key is actually installed on the machine running the tests
- name: read hasura admin secret from file for tests
  slurp:
    src: "{{ fworch_secrets_dir }}/hasura_admin_pwd"
  register: api_hasura_admin_secret
  become: true
  no_log: true

- name: decode hasura admin secret
  set_fact:
    api_hasura_admin_secret: "{{ api_hasura_admin_secret['content'] | b64decode | trim }}"
  no_log: true

- name: test hasura-admin api access
  uri:
    url: https://{{ api_network_listening_ip_address }}:{{ api_web_port }}/api/v1/graphql
    method: POST
    headers:
      Content-Type: application/json
      x-hasura-role: admin
      x-hasura-admin-secret: "{{ api_hasura_admin_secret }}"
    body:
      query: "{ stm_obj_typ(limit: 1) { obj_typ_name } }"
    body_format: json
    validate_certs: true
    ca_path: "{{ internalca_trust_bundle }}"
    client_cert: "{{ internalca_client_certificate }}"
    client_key: "{{ internalca_client_private_key }}"
    return_content: true
  register: api_query_admin
  become: true
  changed_when: false
  environment: "{{ proxy_env }}"
  no_log: true

- name: admin api access output
  assert:
    that:
      - api_query_admin.content is search('obj_typ_name')
    fail_msg: "unexpected version test result (does not contain obj_typ_name): {{ api_query_admin.content }}"
