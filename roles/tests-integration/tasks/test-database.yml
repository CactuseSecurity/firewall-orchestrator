# add integration tests for database here
# - import test
# - report test

# pg_prove -U postgres /pgjwt/test.sql

- debug:
    msg: starting database integration tests

# the probe runs in a single transaction that is always rolled back and fails on the first wrong visibility
- name: test that rule_from / rule_to tenant visibility only depends on the rule itself (GHSA-v8hx-cx2q-j75v)
  command: psql -X -q -v ON_ERROR_STOP=1 -d "{{ fworch_db_name }}"
  args:
    stdin: "{{ lookup('file', 'database/test-rule-endpoint-tenant-visibility.sql') }}"
  register: test_rule_endpoint_tenant_visibility
  changed_when: false
  become: true
  become_user: postgres

# the upgrade file is run twice within the test transaction (at its run-upgrade markers), which is always rolled back
- name: test the data changes of the 9.7.0 database upgrade
  command: psql -X -q -v ON_ERROR_STOP=1 -d "{{ fworch_db_name }}"
  args:
    stdin: >-
      {{ lookup('file', 'database/test-upgrade-9.7.0.sql')
         | replace('-- @run-upgrade-9.7.0', lookup('file', role_path + '/../database/files/upgrade/9.7.0.sql')) }}
  register: test_upgrade_9_7_0
  changed_when: false
  become: true
  become_user: postgres
