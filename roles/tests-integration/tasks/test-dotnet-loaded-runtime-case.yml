---
- name: "Evaluate the dotnet process map: {{ dotnet_loaded_runtime_case.case }}"
  include_tasks: "{{ dotnet_loaded_runtime_evaluation }}"
  vars:
    dotnet_min_runtime_version: "10.0.15"
    dotnet_required_shared_frameworks:
      - Microsoft.NETCore.App
      - Microsoft.AspNetCore.App
    dotnet_process_maps: "{{ dotnet_loaded_runtime_case.maps }}"

- name: "Assert the loaded frameworks below the minimum: {{ dotnet_loaded_runtime_case.case }}"
  assert:
    that: dotnet_loaded_runtimes_below_minimum == dotnet_loaded_runtime_case.expected_below_minimum
    fail_msg: >-
      {{ dotnet_loaded_runtime_case.case }}: expected {{ dotnet_loaded_runtime_case.expected_below_minimum }}
      loaded below 10.0.15, the evaluation returned {{ dotnet_loaded_runtimes_below_minimum }}
