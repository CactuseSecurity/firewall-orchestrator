---
# Drives roles/lib/tasks/evaluate_dotnet_runtime_versions.yml itself with literal
# `dotnet --list-runtimes` listings, then checks that the runtime of this host meets the
# minimum the installer enforced. Runs as the connecting user and changes nothing.
#
# The listings and the minimum are literal, not derived from the inventory: a regression
# that accepts an old runtime must not turn these cases green.
- name: Set the dotnet runtime minimum test inputs
  set_fact:
    dotnet_runtime_evaluation: "{{ role_path }}/../lib/tasks/evaluate_dotnet_runtime_versions.yml"
    dotnet_runtime_minimum_cases:
      - case: both frameworks at the minimum
        expected_shortfall: []
        listing: |
          Microsoft.AspNetCore.App 10.0.15 [/usr/lib/dotnet/shared/Microsoft.AspNetCore.App]
          Microsoft.NETCore.App 10.0.15 [/usr/lib/dotnet/shared/Microsoft.NETCore.App]
      - case: an old patch beside a newer one
        expected_shortfall: []
        listing: |
          Microsoft.AspNetCore.App 10.0.9 [/usr/share/dotnet/shared/Microsoft.AspNetCore.App]
          Microsoft.AspNetCore.App 10.0.20 [/usr/share/dotnet/shared/Microsoft.AspNetCore.App]
          Microsoft.NETCore.App 10.0.9 [/usr/share/dotnet/shared/Microsoft.NETCore.App]
          Microsoft.NETCore.App 10.0.16 [/usr/share/dotnet/shared/Microsoft.NETCore.App]
      - case: both frameworks one patch below
        expected_shortfall: [Microsoft.NETCore.App, Microsoft.AspNetCore.App]
        listing: |
          Microsoft.AspNetCore.App 10.0.14 [/usr/lib/dotnet/shared/Microsoft.AspNetCore.App]
          Microsoft.NETCore.App 10.0.14 [/usr/lib/dotnet/shared/Microsoft.NETCore.App]
      - case: only ASP.NET Core below, compared as version and not as text
        expected_shortfall: [Microsoft.AspNetCore.App]
        listing: |
          Microsoft.AspNetCore.App 10.0.2 [/usr/lib/dotnet/shared/Microsoft.AspNetCore.App]
          Microsoft.NETCore.App 10.0.100 [/usr/lib/dotnet/shared/Microsoft.NETCore.App]
      - case: newer runtimes of other channels only
        expected_shortfall: [Microsoft.NETCore.App, Microsoft.AspNetCore.App]
        listing: |
          Microsoft.AspNetCore.App 11.0.1 [/usr/share/dotnet/shared/Microsoft.AspNetCore.App]
          Microsoft.NETCore.App 100.0.30 [/usr/share/dotnet/shared/Microsoft.NETCore.App]
          Microsoft.NETCore.App 9.0.30 [/usr/share/dotnet/shared/Microsoft.NETCore.App]
      - case: preview build of the channel
        expected_shortfall: [Microsoft.NETCore.App, Microsoft.AspNetCore.App]
        listing: |
          Microsoft.AspNetCore.App 10.0.0-rc.2.25502.107 [/usr/share/dotnet/shared/Microsoft.AspNetCore.App]
          Microsoft.NETCore.App 10.0.0-rc.2.25502.107 [/usr/share/dotnet/shared/Microsoft.NETCore.App]
      - case: no runtime at all
        expected_shortfall: [Microsoft.NETCore.App, Microsoft.AspNetCore.App]
        listing: ""

- name: Verify the dotnet runtime evaluation for every case
  include_tasks: test-dotnet-runtime-minimum-case.yml
  loop: "{{ dotnet_runtime_minimum_cases }}"
  loop_control:
    loop_var: dotnet_runtime_minimum_case

- name: Read the dotnet runtimes of this host
  command: dotnet --list-runtimes
  register: test_dotnet_host_runtimes
  changed_when: false
  failed_when: false

- name: Evaluate the dotnet runtimes of this host
  include_tasks: "{{ dotnet_runtime_evaluation }}"
  vars:
    dotnet_runtime_listing: "{{ test_dotnet_host_runtimes.stdout | default('') }}"

- name: Assert that this host runs dotnet {{ dotnet_min_runtime_version }} or newer
  assert:
    that: dotnet_runtime_shortfall | length == 0
    fail_msg: >-
      The installer finished, but {{ dotnet_runtime_shortfall | join(' and ') }} is below
      {{ dotnet_min_runtime_version }} on this host: {{ test_dotnet_host_runtimes.stdout_lines | default([]) | join('; ') }}
