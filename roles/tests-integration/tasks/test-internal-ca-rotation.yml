---
# Only what the run that took a CA rotation step can be asked about: this file runs when
# the installer was invoked with internalca_ca_rotation, and checks the state that step
# has to leave behind on every host.
#
# prepare: both internal CAs are trusted everywhere - the window pass 2 relies on - while
#          every FWO identity is still signed by the CA in force. Proven end to end with a
#          throwaway client identity signed by the staged CA, which Apache has to accept
#          and every trust store FWO's clients read has to validate.
# activate: the next CA is in force, every FWO identity is signed by it, and the
#           previous CA is trusted nowhere any more.
- name: Read the internal CA file after the rotation step
  slurp:
    src: "{{ internalca_ca_certificate_local }}"
  register: test_rotation_ca_local_content
  become: true

- name: Read the internal CA in force after the rotation step
  community.crypto.x509_certificate_info:
    path: "{{ internalca_ca_certificate_local }}"
  register: test_rotation_ca_info

- name: Read the client identity after the rotation step
  community.crypto.x509_certificate_info:
    path: "{{ internalca_client_certificate }}"
  register: test_rotation_client_info
  become: true

- name: Look for the second internal CA in the operating-system trust store
  stat:
    path: >-
      {{ '/usr/local/share/ca-certificates' if ansible_facts['os_family'] == 'Debian'
         else '/etc/pki/ca-trust/source/anchors' }}/{{ internalca_ca_rotation_trust_anchor }}
  register: test_rotation_os_anchor
  become: true

- name: Count the internal CAs trusted after the rotation step
  set_fact:
    test_rotation_ca_local_count: >-
      {{ test_rotation_ca_local_content.content | b64decode
         | regex_findall('-----BEGIN CERTIFICATE-----') | length }}

# What Apache has actually loaded, not what is on disk: the CA names it sends in its
# client-certificate request come from the client CA file as of its last reload. This is
# how a missing reload shows - a file already narrowed to the new CA while Apache still
# accepts identities of the previous one. No client identity is presented, so the
# handshake itself is expected to be refused.
- name: Read the client CAs Apache advertises after the rotation step
  command:
    argv:
      - openssl
      - s_client
      - -connect
      - "{{ api_network_listening_ip_address }}:{{ api_web_port }}"
      - -CAfile
      - "{{ internalca_trust_bundle }}"
    stdin: ""
  register: test_rotation_apache_handshake
  changed_when: false
  failed_when: false
  timeout: 60
  when:
    - "'apiserver' in group_names"
    - graphql_api_requires_client_certificate | bool

# The section between the header and the next one: "Requested Signature Algorithms" with
# TLS 1.3, "Client Certificate Types" with TLS 1.2. Split rather than matched with a
# capturing regex, because Ansible escapes the backslash of a back-reference.
- name: Collect the client CAs Apache advertises
  set_fact:
    test_rotation_apache_client_cas: >-
      {{
        test_rotation_after_ca_header.split('Requested Signature Algorithms')[0]
        .split('Client Certificate Types')[0]
      }}
  vars:
    test_rotation_after_ca_header: >-
      {{
        (test_rotation_apache_handshake.stdout | default('')).split('Acceptable client certificate CA names')[1:]
        | first | default('')
      }}
  when:
    - "'apiserver' in group_names"
    - graphql_api_requires_client_certificate | bool

- name: Verify Apache advertises the internal CA in force
  assert:
    that:
      - test_rotation_apache_client_cas | trim | length > 0
      - >-
        test_rotation_apache_client_cas
        is search('(?m)CN ?= ?' ~ (test_rotation_ca_info.subject.commonName | regex_escape) ~ '$')
    fail_msg: >-
      After internalca_ca_rotation={{ internalca_ca_rotation }} Apache on
      {{ inventory_hostname }} does not advertise the internal CA in force
      "{{ test_rotation_ca_info.subject.commonName }}" for client certificates. Advertised:
      {{ test_rotation_apache_client_cas | default('') }}
  when:
    - "'apiserver' in group_names"
    - graphql_api_requires_client_certificate | bool

- name: Verify the client identity is signed by the internal CA in force
  assert:
    that:
      - >-
        test_rotation_client_info.issuer.get('commonName', '')
        == test_rotation_ca_info.subject.get('commonName', '')
    fail_msg: >-
      After internalca_ca_rotation={{ internalca_ca_rotation }} the client identity of
      {{ inventory_hostname }} is issued by
      "{{ test_rotation_client_info.issuer.get('commonName', '') }}", but the internal CA in
      force is "{{ test_rotation_ca_info.subject.get('commonName', '') }}".

- name: Test pass 1 of the CA rotation
  when: internalca_ca_rotation == 'prepare'
  block:
    - name: Verify both internal CAs are trusted after pass 1
      assert:
        that:
          - test_rotation_ca_local_count | int == 2
          - test_rotation_os_anchor.stat.exists
        fail_msg: >-
          After internalca_ca_rotation=prepare {{ inventory_hostname }} must trust both
          internal CAs, but {{ internalca_ca_certificate_local }} holds
          {{ test_rotation_ca_local_count }} certificates and the operating-system anchor
          {{ internalca_ca_rotation_trust_anchor }} is
          {{ 'present' if test_rotation_os_anchor.stat.exists else 'missing' }}.

    - name: Read the staged internal CA
      community.crypto.x509_certificate_info:
        path: "{{ internalca_next_ca_certificate }}"
      register: test_rotation_next_info
      delegate_to: "{{ internalca_ca_host }}"
      become: true

    - name: Read the rotation marker of this host
      slurp:
        src: "{{ internalca_ca_rotation_marker_dir }}/{{ inventory_hostname }}"
      register: test_rotation_marker
      delegate_to: "{{ internalca_ca_host }}"
      become: true

    - name: Verify pass 1 staged a separate CA and recorded this host
      assert:
        that:
          - >-
            test_rotation_next_info.subject.commonName
            is match('^' ~ product_name ~ ' Internal CA [0-9a-f]{16}$')
          - test_rotation_next_info.subject.commonName != test_rotation_ca_info.subject.commonName
          - >-
            (test_rotation_marker.content | b64decode | trim)
            == test_rotation_next_info.fingerprints.sha256
        fail_msg: >-
          Pass 1 must stage a CA with its own name beside
          "{{ test_rotation_ca_info.subject.commonName }}" and record that
          {{ inventory_hostname }} trusts it, so pass 2 can tell that pass 1 completed here.

    - name: Verify Apache advertises the staged internal CA after pass 1
      assert:
        that:
          - >-
            test_rotation_apache_client_cas
            is search('(?m)CN ?= ?' ~ (test_rotation_next_info.subject.commonName | regex_escape) ~ '$')
        fail_msg: >-
          Apache on {{ inventory_hostname }} has not loaded the staged internal CA
          "{{ test_rotation_next_info.subject.commonName }}" as a client CA, so pass 2 would
          lock out every FWO client it re-signs. Advertised: {{ test_rotation_apache_client_cas }}
      when:
        - "'apiserver' in group_names"
        - graphql_api_requires_client_certificate | bool

    - name: Create a directory for the staged CA test identity on the CA host
      tempfile:
        state: directory
        suffix: fwo-rotation-test
      register: test_rotation_issuer_dir
      delegate_to: "{{ internalca_ca_host }}"
      run_once: true
      become: true

    - name: Create a test client key for the staged CA
      community.crypto.openssl_privatekey:
        path: "{{ test_rotation_issuer_dir.path }}/client.key"
        type: ECC
        curve: secp256r1
      delegate_to: "{{ internalca_ca_host }}"
      run_once: true
      become: true
      no_log: true

    - name: Create a test client signing request for the staged CA
      community.crypto.openssl_csr:
        path: "{{ test_rotation_issuer_dir.path }}/client.csr"
        privatekey_path: "{{ test_rotation_issuer_dir.path }}/client.key"
        common_name: "{{ product_name }}-rotation-test-client"
        extended_key_usage:
          - clientAuth
      delegate_to: "{{ internalca_ca_host }}"
      run_once: true
      become: true

    # Signed by the staged CA, which nothing in the installation presents yet: whatever
    # accepts this identity now accepts every identity pass 2 is about to issue.
    - name: Sign the test client identity with the staged CA
      community.crypto.x509_certificate:
        path: "{{ test_rotation_issuer_dir.path }}/client.crt"
        csr_path: "{{ test_rotation_issuer_dir.path }}/client.csr"
        ownca_path: "{{ internalca_next_ca_certificate }}"
        ownca_privatekey_path: "{{ internalca_next_ca_private_key }}"
        ownca_not_after: "+1d"
        provider: ownca
      delegate_to: "{{ internalca_ca_host }}"
      run_once: true
      become: true

    - name: Read the staged CA test identity
      slurp:
        src: "{{ test_rotation_issuer_dir.path }}/{{ item }}"
      loop:
        - client.crt
        - client.key
      register: test_rotation_identity
      delegate_to: "{{ internalca_ca_host }}"
      run_once: true
      become: true
      no_log: true

    - name: Remove the staged CA test identity from the CA host
      file:
        path: "{{ test_rotation_issuer_dir.path }}"
        state: absent
      delegate_to: "{{ internalca_ca_host }}"
      run_once: true
      become: true

    - name: Test the staged CA test identity on this host
      block:
        - name: Create a directory for the staged CA test identity
          tempfile:
            state: directory
            suffix: fwo-rotation-test
          register: test_rotation_dir
          become: true

        - name: Install the staged CA test identity
          copy:
            content: "{{ item.content | b64decode }}"
            dest: "{{ test_rotation_dir.path }}/{{ item.item }}"
            mode: "0600"
          loop: "{{ test_rotation_identity.results }}"
          loop_control:
            label: "{{ item.item }}"
          become: true
          no_log: true

        # The three places FWO components read internal CA anchors from: the trust bundle
        # (fworch.json tls_ca_certificate), the client CA file Apache verifies against, and
        # the operating-system store (openssl's default verify locations).
        - name: Validate the staged CA test identity against every trust store
          command:
            argv: "{{ ['openssl', 'verify'] + item + [test_rotation_dir.path ~ '/client.crt'] }}"
          loop:
            - ['-CAfile', "{{ internalca_trust_bundle }}"]
            - ['-CAfile', "{{ internalca_ca_certificate_local }}"]
            - []
          loop_control:
            label: "{{ item | join(' ') | default('operating-system store', true) }}"
          changed_when: false
          become: true

        - name: Present the staged CA test identity to the API
          uri:
            url: https://{{ api_network_listening_ip_address }}:{{ api_web_port }}/api/v1/version
            method: GET
            validate_certs: true
            ca_path: "{{ internalca_trust_bundle }}"
            client_cert: "{{ test_rotation_dir.path }}/client.crt"
            client_key: "{{ test_rotation_dir.path }}/client.key"
            return_content: true
          register: test_rotation_api_version
          changed_when: false
          become: true
          when:
            - "'apiserver' in group_names"
            - graphql_api_requires_client_certificate | bool

        - name: Verify the API accepts a client identity of the staged CA
          assert:
            that:
              - test_rotation_api_version.content is search('version')
            fail_msg: >-
              Apache on {{ inventory_hostname }} rejected a client identity signed by the
              staged CA, so pass 2 would lock out every FWO client it re-signs.
          when:
            - "'apiserver' in group_names"
            - graphql_api_requires_client_certificate | bool
      always:
        - name: Remove the staged CA test identity
          file:
            path: "{{ test_rotation_dir.path }}"
            state: absent
          become: true
          when: test_rotation_dir.path is defined

- name: Test pass 2 of the CA rotation
  when: internalca_ca_rotation == 'activate'
  block:
    - name: Look for leftover CA rotation state on the CA host
      stat:
        path: "{{ item }}"
      loop:
        - "{{ internalca_next_ca_certificate }}"
        - "{{ internalca_next_ca_private_key }}"
        - "{{ internalca_previous_ca_certificate }}"
        - "{{ internalca_ca_rotation_marker_dir }}"
      register: test_rotation_leftovers
      delegate_to: "{{ internalca_ca_host }}"
      become: true

    - name: Verify pass 2 retired the previous internal CA
      assert:
        that:
          - test_rotation_ca_local_count | int == 1
          - not test_rotation_os_anchor.stat.exists
          - test_rotation_leftovers.results | selectattr('stat.exists') | list | length == 0
          - >-
            test_rotation_ca_info.subject.commonName
            not in hostvars[internalca_ca_host].internalca_previous_ca_common_names | default([], true)
          - hostvars[internalca_ca_host].internalca_previous_ca_common_names | default([], true) | length > 0
        fail_msg: >-
          After internalca_ca_rotation=activate {{ inventory_hostname }} must trust the new
          internal CA "{{ test_rotation_ca_info.subject.commonName }}" alone, with the
          previous one recorded as retired and no rotation state left on
          {{ internalca_ca_host }}. Found {{ test_rotation_ca_local_count }} certificates in
          {{ internalca_ca_certificate_local }}, the operating-system rotation anchor
          {{ 'present' if test_rotation_os_anchor.stat.exists else 'absent' }} and leftover
          state {{ test_rotation_leftovers.results | selectattr('stat.exists') | map(attribute='item') | list }}.

    # The negative counterpart of the check that Apache advertises the CA in force: none of
    # the CAs this installation has retired may still be accepted for client certificates.
    # Matched as whole names, because the unsuffixed pre-9.5.0 name is a prefix of every
    # suffixed one.
    - name: Verify Apache no longer accepts client identities of a retired internal CA
      assert:
        that:
          - >-
            test_rotation_apache_client_cas
            is not search('(?m)CN ?= ?' ~ (item | regex_escape) ~ '$')
        fail_msg: >-
          Apache on {{ inventory_hostname }} still advertises the retired internal CA
          "{{ item }}" for client certificates after internalca_ca_rotation=activate, so it
          was not reloaded after the previous CA was withdrawn.
      loop: "{{ hostvars[internalca_ca_host].internalca_previous_ca_common_names | default([], true) }}"
      when:
        - "'apiserver' in group_names"
        - graphql_api_requires_client_certificate | bool
