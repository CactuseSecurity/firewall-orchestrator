---
- name: Read the kernel IPv6 interface table
  slurp:
    src: /proc/net/if_inet6
  register: kernel_ipv6_interfaces
  failed_when: false

- name: IPv6 loopback detection must match the kernel state
  assert:
    that:
      - >-
        ipv6_loopback_available | bool ==
        ((kernel_ipv6_interfaces.content | default('') | b64decode
          | regex_search('(?m)^00000000000000000000000000000001\\s')) is not none)
    fail_msg: >-
      ipv6_loopback_available={{ ipv6_loopback_available }} does not match
      the IPv6 loopback state reported in /proc/net/if_inet6.

- name: Read the active PostgreSQL listener addresses
  community.postgresql.postgresql_query:
    db: postgres
    query: SHOW listen_addresses
  register: postgresql_listener_configuration
  become: true
  become_user: postgres
  when: "'databaseserver' in group_names"

- name: PostgreSQL must use the configured listener addresses
  assert:
    that:
      - postgresql_listener_configuration.query_result[0].listen_addresses == postgresql_listening_addresses
    fail_msg: >-
      PostgreSQL listens on '{{ postgresql_listener_configuration.query_result[0].listen_addresses }}'
      instead of '{{ postgresql_listening_addresses }}'.
  when: "'databaseserver' in group_names"

- name: PostgreSQL must accept every configured loopback address family
  wait_for:
    host: "{{ item }}"
    port: "{{ fworch_db_port }}"
    timeout: 5
  loop: "{{ postgresql_listening_addresses | split(',') }}"
  when:
    - "'databaseserver' in group_names"
    - not (distributed_install | default(false) | bool)

# Asserted against openldap_server_services itself, which is why that variable lives
# in group_vars rather than the openldap-server role defaults. Re-deriving the string
# here would only prove that two copies of the same expression agree with each other.
- name: Verify the active LDAP listener configuration
  command:
    argv:
      - grep
      - --fixed-strings
      - --line-regexp
      - 'SLAPD_SERVICES="{{ openldap_server_services }}"'
      - "{{ openldap_service_defaults_file }}"
  register: openldap_listener_configuration
  changed_when: false
  become: true
  when: "'middlewareserver' in group_names"

# The check above proves the defaults file matches the configuration, not that slapd
# is serving it: slapd reads -h once at startup, so a process left over from an
# earlier listener configuration passes it and then fails the connection loop below
# with a bare connection timeout that names no cause. Read the listener list off the
# running process as well, so that drift fails here and says so.
- name: Read the state of the slapd service
  systemd:
    name: slapd
  register: openldap_service_state
  changed_when: false
  become: true
  when: "'middlewareserver' in group_names"

- name: Read the command line of the running slapd
  slurp:
    src: "/proc/{{ openldap_slapd_main_pid }}/cmdline"
  vars:
    openldap_slapd_main_pid: "{{ (openldap_service_state.status | default({})).get('MainPID', '0') }}"
  register: openldap_service_command_line
  become: true
  when:
    - "'middlewareserver' in group_names"
    - openldap_slapd_main_pid != '0'

# A foreground slapd retains the -h value as a single argument holding the whole
# space-separated URL list. A daemonizing slapd may rewrite its process title after
# forking, however, so the listener arguments are not observable on every supported
# service-unit type. Compare them when they are present; the live connection checks
# below remain the portable runtime verification for every configured listener.
- name: The running slapd must serve the configured listeners
  vars:
    slapd_arguments: >-
      {{ openldap_service_command_line.content | default('') | b64decode
         | regex_findall("[^\x00]+") }}
    slapd_running_services: >-
      {{ slapd_arguments[slapd_arguments.index('-h') + 1]
         if '-h' in slapd_arguments
            and slapd_arguments.index('-h') + 1 < slapd_arguments | length
         else '' }}
  assert:
    that:
      - slapd_running_services | split | sort == openldap_server_services | trim | split | sort
    fail_msg: >-
      The running slapd serves '{{ slapd_running_services }}' while
      {{ openldap_service_defaults_file }} configures
      '{{ openldap_server_services | trim }}'. slapd reads its listener list only at
      startup, so it has not been restarted since that file was last changed.
  when:
    - "'middlewareserver' in group_names"
    - "'-h' in slapd_arguments"

# Derived from the listener URLs themselves rather than a restated host/port matrix,
# so a host without an IPv6 loopback is not asked to answer on [::1].
- name: Internal LDAP must accept every configured loopback listener
  wait_for:
    host: "{{ item | regex_replace('^ldaps?://\\[?([^]/]+)\\]?/$', '\\1') }}"
    port: "{{ openldap_tls_listener_port if item.startswith('ldaps://') else openldap_plain_listener_port }}"
    timeout: 5
  loop: "{{ openldap_server_services | split }}"
  when:
    - "'middlewareserver' in group_names"
    - not (distributed_install | default(false) | bool)

- name: Verify the Hasura listener configuration
  command:
    argv:
      - grep
      - --fixed-strings
      - --line-regexp
      - "HASURA_GRAPHQL_SERVER_HOST={{ api_local_listening_ip_address }}"
      - "{{ api_env_file }}"
  register: hasura_listener_configuration
  changed_when: false
  become: true
  when: "'apiserver' in group_names"

- name: Hasura must accept IPv4 loopback connections
  wait_for:
    host: "{{ api_local_listening_ip_address }}"
    port: "{{ api_port }}"
    timeout: 5
  when: "'apiserver' in group_names"
