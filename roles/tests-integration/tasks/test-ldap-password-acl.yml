# The read-only account searches entries but must not read password hashes; passwords are checked by
# binding as the user (GHSA-6g84, role-openldap-server-002). Checked on the effective slapd configuration,
# so both a fresh install and the 9.8.6 upgrade step are covered.
- name: read the configuration of the FWO directory database
  command: >-
    slapcat -F {{ '/etc/openldap' if ansible_facts['os_family'] == 'RedHat' else '/etc/ldap' }}/slapd.d
    -n 0 -a "(olcSuffix={{ openldap_path }})"
  register: test_ldap_password_acl_config
  changed_when: false
  become: true

- name: assert the read-only account has no read access to userPassword
  vars:
    test_ldap_password_acl_unfolded: "{{ test_ldap_password_acl_config.stdout | regex_replace('\\n ', '') }}"
    test_ldap_password_acl_rule: >-
      {{ test_ldap_password_acl_unfolded
         | regex_findall('^olcAccess: ([{][0-9]+[}]to attrs=userPassword .*)$', multiline=True)
         | first | default('') }}
  assert:
    that:
      - test_ldap_password_acl_rule | length > 0
      - test_ldap_password_acl_rule is not search('by\s+dn\.base="' ~ (openldap_readonly_user_dn | regex_escape) ~ '"\s+read')
    fail_msg: >-
      The userPassword access rule still lets {{ openldap_readonly_user_dn }} read password hashes:
      {{ test_ldap_password_acl_rule | default('rule not found') }}
