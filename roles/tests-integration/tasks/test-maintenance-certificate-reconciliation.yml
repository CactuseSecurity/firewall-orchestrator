---
# The reconciliation is exercised against throwaway vhosts rather than the installed one,
# so the facts roles/internalCA left behind for restart-consumers.yml are saved first and
# put back afterwards: including the production task file overwrites them, and a test must
# not leave the run believing the maintenance identity changed when only a temporary file
# under /tmp did.
# Saved as one dict with an empty-string stand-in rather than as omit values: a set_fact
# whose every value is omit has no key/value pair left and fails outright, which is the
# state of a host whose maintenance vhost the real run never reconciled.
- name: Remember the maintenance reconciliation state before testing it
  set_fact:
    test_maintenance_state_before:
      identity_changed: "{{ internalca_maintenance_identity_changed | default('') }}"
      # Not an empty-string stand-in like the one above: restart-consumers.yml reads this
      # fact through | default(true), so an empty string would restore "false" where the
      # production default is "true" and suppress a deferred restart rather than restore it.
      identity_available: "{{ internalca_maintenance_identity_available | default(true) }}"

- name: Create a temporary maintenance certificate test directory
  tempfile:
    state: directory
    prefix: fworch-maintenance-certificate-
  register: test_maintenance_certificate_directory

# The production task refuses to write an identity that is not on disk, so the pair the
# reconciliation cases expect has to exist. Only its presence is under test here - the
# reconciliation reads neither file, it only writes their paths into the vhost.
- name: Create the identity the reconciliation cases are reconciled onto
  copy:
    content: "not a certificate - only its presence on disk is under test"
    dest: "{{ test_maintenance_certificate_directory.path }}/{{ item }}"
    mode: "0600"
  loop:
    - expected.crt
    - expected.key

# Three cases, because each one is a different way for the reconciliation to be wrong:
# the legacy paths a pre-9.5.0 upgrade brings, a vhost that already names the selected
# identity and must report no change, and a vhost missing the directives entirely - where
# an unanchored lineinfile appends them past the last </VirtualHost> and quietly sets the
# identity for the whole server instead of for the maintenance site.
- name: Define the maintenance reconciliation cases
  set_fact:
    test_maintenance_reconciliation_cases:
      # apache_ssl_dir rather than internalca_legacy_apache_certificate: the latter is a
      # roles/internalCA default and is out of scope in this play. It carries the same
      # value, and being OS-aware it exercises the RedHat layout on RedHat.
      - name: legacy-paths
        expect_changed: true
        content: |
          <VirtualHost *:80>
              ServerName maintenance-test:80
          </VirtualHost>

          <VirtualHost *:{{ ui_web_port }}>
              SSLEngine on
              SSLCertificateFile {{ apache_ssl_dir }}/server.crt
              SSLCertificateKeyFile {{ apache_ssl_dir }}/server.key
          </VirtualHost>
        absent:
          - "{{ apache_ssl_dir }}/server.crt"
          - "{{ apache_ssl_dir }}/server.key"
      - name: already-reconciled
        expect_changed: false
        content: |
          <VirtualHost *:80>
              ServerName maintenance-test:80
          </VirtualHost>

          <VirtualHost *:{{ ui_web_port }}>
              SSLEngine on
              SSLCertificateFile {{ test_maintenance_certificate_directory.path }}/expected.crt
              SSLCertificateKeyFile {{ test_maintenance_certificate_directory.path }}/expected.key
          </VirtualHost>
        absent: []
      - name: missing-directives
        expect_changed: true
        content: |
          <VirtualHost *:80>
              ServerName maintenance-test:80
          </VirtualHost>

          <VirtualHost *:{{ ui_web_port }}>
              SSLEngine on
          </VirtualHost>
        absent: []

- name: Write a maintenance configuration for each reconciliation case
  copy:
    content: "{{ item.content }}"
    dest: "{{ test_maintenance_certificate_directory.path }}/{{ item.name }}-maintenance.conf"
    mode: "0600"
  loop: "{{ test_maintenance_reconciliation_cases }}"
  loop_control:
    label: "{{ item.name }}"

- name: Reconcile each test maintenance configuration
  include_tasks: assert-maintenance-certificate-reconciliation.yml
  loop: "{{ test_maintenance_reconciliation_cases }}"
  loop_control:
    loop_var: test_maintenance_case
    label: "{{ test_maintenance_case.name }}"
  vars:
    test_maintenance_expected_certificate: "{{ test_maintenance_certificate_directory.path }}/expected.crt"
    test_maintenance_expected_private_key: "{{ test_maintenance_certificate_directory.path }}/expected.key"

# The three cases above are hand-written fixtures, so they only ever prove the
# reconciliation against the shape a test author expects. This case renders the vhost
# roles/common actually installs - the same template, through the same template module -
# and reconciles it onto the identity it already names. It must report no change: the
# production template and this task write the two identity directives, and if their
# indentation ever drifts apart again, lineinfile rewrites both lines on every upgrade
# and Apache is reloaded for a certificate that did not move.
- name: Render the maintenance vhost the way roles/common installs it
  template:
    src: "{{ role_path }}/../common/templates/httpd-maintenance.conf"
    dest: "{{ test_maintenance_certificate_directory.path }}/template-rendered-maintenance.conf"
    mode: "0600"
  vars:
    maintenance_apache_certificate: "{{ test_maintenance_certificate_directory.path }}/expected.crt"
    maintenance_apache_private_key: "{{ test_maintenance_certificate_directory.path }}/expected.key"

- name: Reconcile the vhost roles/common renders onto the identity it already names
  include_tasks: assert-maintenance-certificate-reconciliation.yml
  vars:
    test_maintenance_case:
      name: template-rendered
      expect_changed: false
      absent: []
    test_maintenance_expected_certificate: "{{ test_maintenance_certificate_directory.path }}/expected.crt"
    test_maintenance_expected_private_key: "{{ test_maintenance_certificate_directory.path }}/expected.key"

# internalca_issue_apache_certificate=false is the one way the selected identity can be
# absent at this point: FWO issues nothing and the paths are the operator's own. Writing
# them in and letting restart-consumers.yml reload Apache would fail the configuration
# test and stop the web server while the maintenance site is all that is enabled, so the
# vhost has to be left naming whatever Apache is already serving.
- name: Write a maintenance configuration whose selected identity does not exist
  copy:
    content: |
      <VirtualHost *:80>
          ServerName maintenance-test:80
      </VirtualHost>

      <VirtualHost *:{{ ui_web_port }}>
          SSLEngine on
          SSLCertificateFile {{ apache_ssl_dir }}/server.crt
          SSLCertificateKeyFile {{ apache_ssl_dir }}/server.key
      </VirtualHost>
    dest: "{{ test_maintenance_certificate_directory.path }}/absent-identity-maintenance.conf"
    mode: "0600"

- name: Reconcile a maintenance configuration onto an identity that does not exist
  include_tasks: "{{ role_path }}/../internalCA/tasks/reconcile-maintenance-certificate.yml"
  vars:
    http_conf_dir: "{{ test_maintenance_certificate_directory.path }}/"
    product_name: absent-identity
    internalca_apache_certificate: "{{ test_maintenance_certificate_directory.path }}/never-issued.crt"
    internalca_apache_private_key: "{{ test_maintenance_certificate_directory.path }}/never-issued.key"

- name: Read the maintenance configuration that was left alone
  slurp:
    src: "{{ test_maintenance_certificate_directory.path }}/absent-identity-maintenance.conf"
  register: test_maintenance_absent_identity_configuration

- name: Verify an absent identity is neither written into the vhost nor restarted into
  assert:
    that:
      - not (internalca_maintenance_identity_available | bool)
      - not (internalca_maintenance_identity_changed | bool)
      - "'never-issued' not in test_maintenance_absent_identity_content"
      - "apache_ssl_dir ~ '/server.crt' in test_maintenance_absent_identity_content"
      - "apache_ssl_dir ~ '/server.key' in test_maintenance_absent_identity_content"
    fail_msg: >-
      The maintenance vhost was repointed at an identity that does not exist
      (available={{ internalca_maintenance_identity_available }},
      changed={{ internalca_maintenance_identity_changed }}). Apache would then be
      reloaded into a certificate it cannot read. Content: {{ test_maintenance_absent_identity_content }}
  vars:
    test_maintenance_absent_identity_content: >-
      {{ test_maintenance_absent_identity_configuration.content | b64decode }}

# For identity_changed an empty string restores the "not set" state as far as
# restart-consumers.yml is concerned, because it reads that fact through | default(false).
# identity_available was captured with its own production default for the opposite reason,
# noted where it is saved.
- name: Restore the maintenance reconciliation state
  set_fact:
    internalca_maintenance_identity_changed: "{{ test_maintenance_state_before.identity_changed }}"
    internalca_maintenance_identity_available: "{{ test_maintenance_state_before.identity_available }}"

- name: Remove the temporary maintenance certificate test directory
  file:
    path: "{{ test_maintenance_certificate_directory.path }}"
    state: absent
