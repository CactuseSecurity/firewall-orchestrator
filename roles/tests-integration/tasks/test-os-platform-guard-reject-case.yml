---
# One unsupported platform for test-os-platform-guard.yml. In its own file because a
# rescue ends a loop at its first failure, and every case has to fail on its own.
#
# allow_unsupported_os is passed in as false. Only -e outranks that, and a run given
# -e allow_unsupported_os=true cannot be rejected by design, so the case is skipped then.
- name: Skip the rejection of {{ os_platform.distribution }} {{ os_platform.version }} (allow_unsupported_os given with -e)
  debug:
    msg: "allow_unsupported_os=true was given on the command line, the guard only warns in this run."
  when: allow_unsupported_os | bool

- name: Run the OS platform guard for {{ os_platform.distribution }} {{ os_platform.version }}
  when: not allow_unsupported_os | bool
  block:
    - include_tasks: "{{ os_platform_guard }}"
      vars:
        os_platform_distribution: "{{ os_platform.distribution }}"
        os_platform_version: "{{ os_platform.version }}"
    - set_fact:
        os_platforms_not_rejected: "{{ os_platforms_not_rejected + [os_platform.distribution ~ ' ' ~ os_platform.version ~ ': not rejected'] }}"
  rescue:
    # The operator has to see what was found, what is supported and the way out, on one line.
    - set_fact:
        os_platforms_not_rejected: "{{ os_platforms_not_rejected + [os_platform.distribution ~ ' ' ~ os_platform.version ~ ': ' ~ ansible_failed_result.msg] }}"
      when: >-
        (os_platform.distribution ~ ' ' ~ os_platform.version) not in ansible_failed_result.msg
        or ('RedHat ' ~ supported_os_minimum_major_versions['RedHat'] ~ '+') not in ansible_failed_result.msg
        or 'allow_unsupported_os=true' not in ansible_failed_result.msg
        or '\n' in ansible_failed_result.msg
