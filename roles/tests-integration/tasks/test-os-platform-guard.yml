---
# Drives roles/common/tasks/validate-os-platform.yml itself rather than a copy of its
# expressions, with the distribution facts passed in, so every case runs on any host.
#
# Runs unprivileged and touches nothing: the guard is a comparison of distribution facts.
- name: Set the OS platform guard test inputs
  set_fact:
    os_platform_guard: "{{ role_path }}/../common/tasks/validate-os-platform.yml"
    # The floor of every supported distribution, newer releases, and the version strings
    # Debian testing reports instead of a release number.
    os_platforms_supported:
      - { distribution: Debian, version: "12" }
      - { distribution: Debian, version: "13.1" }
      - { distribution: Debian, version: "n/a" }
      - { distribution: Debian, version: "forky/sid" }
      - { distribution: Ubuntu, version: "22.04" }
      - { distribution: Ubuntu, version: "24.04" }
      - { distribution: Ubuntu, version: "26.04" }
      - { distribution: RedHat, version: "9.6" }
      - { distribution: RedHat, version: "10.0" }
      - { distribution: Rocky, version: "9.6" }
    # Deliberately literal and not derived from supported_os_minimum_major_versions:
    # lowering a floor by mistake must not turn these cases green.
    os_platforms_unsupported:
      - { distribution: RedHat, version: "8.10" }
      - { distribution: Rocky, version: "8.10" }
      - { distribution: Debian, version: "11.11" }
      - { distribution: Ubuntu, version: "20.04" }
      - { distribution: Ubuntu, version: "25.10" }
      - { distribution: CentOS, version: "9" }
    os_platforms_not_rejected: []

- name: Verify the guard lets every supported platform through
  block:
    - include_tasks: "{{ os_platform_guard }}"
      loop: "{{ os_platforms_supported }}"
      loop_control:
        loop_var: os_platform
      vars:
        os_platform_distribution: "{{ os_platform.distribution }}"
        os_platform_version: "{{ os_platform.version }}"
    - set_fact:
        os_platform_guard_blocked: false
  rescue:
    - set_fact:
        os_platform_guard_blocked: true
        os_platform_guard_block_message: "{{ ansible_failed_result.msg }}"

- name: Assert that no supported platform was blocked
  assert:
    that:
      - not os_platform_guard_blocked | bool
    fail_msg: >-
      The OS platform guard refused a supported platform:
      {{ os_platform_guard_block_message | default('no message') }}

- name: Verify the guard stops every unsupported platform
  include_tasks: test-os-platform-guard-reject-case.yml
  loop: "{{ os_platforms_unsupported }}"
  loop_control:
    loop_var: os_platform
  vars:
    # Outranks the inventory and the installer settings file, but not -e, see the case file.
    allow_unsupported_os: false

- name: Assert that every unsupported platform was rejected with a usable message
  assert:
    that:
      - os_platforms_not_rejected | length == 0
    fail_msg: >-
      The OS platform guard did not usably reject:
      {{ os_platforms_not_rejected | join('; ') }}

- name: Verify the override lets an unsupported platform through
  block:
    - include_tasks: "{{ os_platform_guard }}"
      vars:
        os_platform_distribution: RedHat
        os_platform_version: "8.10"
        allow_unsupported_os: true
    - set_fact:
        os_platform_override_blocked: false
  rescue:
    - set_fact:
        os_platform_override_blocked: true
        os_platform_override_block_message: "{{ ansible_failed_result.msg }}"

- name: Assert that the override was honoured
  assert:
    that:
      - not os_platform_override_blocked | bool
    fail_msg: >-
      The OS platform guard refused RedHat 8.10 although allow_unsupported_os was set:
      {{ os_platform_override_block_message | default('no message') }}
