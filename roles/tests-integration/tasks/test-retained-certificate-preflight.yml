---
# Drives roles/internalCA/tasks/validate-retained-apache-certificate.yml itself rather
# than a copy of its expressions: the defect this preflight exists for is an upgrade
# that keeps an administrator-managed certificate and only discovers ten minutes later
# that no FWO client can validate the endpoints it just configured, and a test that
# reimplements the matching would stay green through a regression in the real one.
# Runs unprivileged: everything happens inside a temporary directory this test creates,
# so nothing here needs root, unlike the preflight tests that inspect a real vhost.
- name: Set the retained certificate preflight test inputs
  set_fact:
    # The production file, included rather than reimplemented.
    retained_certificate_preflight: "{{ role_path }}/../internalCA/tasks/validate-retained-apache-certificate.yml"
    # Case is exercised in both directions on purpose - an endpoint name in a case the
    # certificate does not use, and a certificate entry in a case the endpoint name does
    # not - because lower-casing only one side of the comparison still passes a test that
    # varies the other.
    retained_certificate_covered_names:
      - fwo.test.example.com
      - web.apps.test.example.com
      - FWO.Test.Example.COM
      - mixed.case.example.com
      - 10.11.12.13
    retained_certificate_uncovered_names:
      - fwo.test.example.com
      - localhost
      - 10.11.12.14

- name: Create a temporary directory for retained certificate preflight tests
  tempfile:
    state: directory
    prefix: fworch-retained-certificate-
  register: retained_certificate_test_directory

# One certificate carrying all three entry kinds a customer certificate mixes: an exact
# name, a wildcard, and an iPAddress entry. Every case below is a different set of
# endpoint names checked against this one certificate.
- name: Create a customer style certificate for the retained certificate preflight test
  command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - ec
      - -pkeyopt
      - ec_paramgen_curve:P-256
      - -nodes
      - -days
      - "2"
      - -keyout
      - "{{ retained_certificate_test_directory.path }}/retained.key"
      - -out
      - "{{ retained_certificate_test_directory.path }}/retained.crt"
      - -subj
      - /O=Test/CN=fwo.test.example.com
      - -addext
      - subjectAltName=DNS:fwo.test.example.com,DNS:*.apps.test.example.com,DNS:Mixed.Case.Example.com,IP:10.11.12.13
  changed_when: false

- name: Read the customer style certificate for the retained certificate preflight test
  community.crypto.x509_certificate_info:
    path: "{{ retained_certificate_test_directory.path }}/retained.crt"
  register: retained_certificate_test_info
  changed_when: false

# An exact name, a name the wildcard covers, a name differing only in case, and the IP
# literal as an iPAddress entry must all be accepted. Any of these failing would stop an
# upgrade that has a perfectly usable certificate, which is worse than not checking.
- name: Verify the preflight accepts every endpoint name the certificate covers
  include_tasks: "{{ retained_certificate_preflight }}"
  vars:
    internalca_existing_apache_certificate: "{{ retained_certificate_test_directory.path }}/retained.crt"
    internalca_existing_apache_certificate_info: "{{ retained_certificate_test_info }}"
    internalca_endpoint_host_names: "{{ retained_certificate_covered_names }}"

- name: Assert that no covered endpoint name was reported as uncovered
  assert:
    that:
      - internalca_uncovered_endpoint_host_names | length == 0
    fail_msg: >-
      The retained certificate preflight rejected
      {{ internalca_uncovered_endpoint_host_names | join(', ') }}, which
      {{ retained_certificate_test_directory.path }}/retained.crt covers.

# The case this preflight was written for: the shipped inventory still names the host
# localhost while the retained certificate names the customer endpoint, so api_uri
# addresses a name the certificate does not carry.
- name: Verify the preflight rejects an endpoint name the certificate does not cover
  block:
    - include_tasks: "{{ retained_certificate_preflight }}"
      vars:
        internalca_existing_apache_certificate: "{{ retained_certificate_test_directory.path }}/retained.crt"
        internalca_existing_apache_certificate_info: "{{ retained_certificate_test_info }}"
        internalca_endpoint_host_names: "{{ retained_certificate_uncovered_names }}"
    - set_fact:
        retained_certificate_preflight_rejected: false
  rescue:
    - set_fact:
        retained_certificate_preflight_rejected: true
        retained_certificate_preflight_message: "{{ ansible_failed_result.msg }}"

- name: Assert that the uncovered endpoint names were rejected before the run continued
  assert:
    that:
      - retained_certificate_preflight_rejected | bool
      # The exact missing-names clause, not just the names somewhere in the message:
      # that asserts both that the two uncovered names are reported and that
      # fwo.test.example.com, which the certificate does cover, is not - while still
      # allowing it to appear later in the message, where the covered names are listed.
      - >-
        'no subjectAltName entry for localhost, 10.11.12.14,'
        in retained_certificate_preflight_message
      # The remedy has to be in the message. The failure this replaces was a bare TLS
      # host name mismatch at a client, with nothing pointing at the certificate.
      - "'fwo_endpoint_hostname' in retained_certificate_preflight_message"
    fail_msg: >-
      The retained certificate preflight did not reject
      {{ retained_certificate_uncovered_names | join(', ') }} with a usable message:
      {{ retained_certificate_preflight_message | default('it did not fail at all') }}

- name: Remove the retained certificate preflight test directory
  file:
    path: "{{ retained_certificate_test_directory.path }}"
    state: absent
