- block:
    - name: ensure test_dir exists
      file:
        path: "{{ test_dir }}/csharp"
        state: directory
        owner: "{{ fworch_user }}"
        group: "{{ fworch_group }}"
        mode: "0755"
      become: true

    - name: sync test files to frontend target
      ansible.posix.synchronize:
        src: FWO.Test
        dest: "{{ test_dir }}/csharp"
        rsync_opts:
          - "--chown={{ fworch_user }}:{{ fworch_group }}"
          - "--delete"
      become: true

    - name: provide api metadata for the report permission tests
      copy:
        src: roles/api/files/replace_metadata.json
        dest: "{{ test_dir }}/csharp/replace_metadata.json"
        owner: "{{ fworch_user }}"
        group: "{{ fworch_group }}"
        mode: "0644"
      become: true

    - name: ensure repository-contract fixture directory exists
      file:
        path: "{{ test_dir }}/csharp/repository-contracts"
        state: directory
        owner: "{{ fworch_user }}"
        group: "{{ fworch_group }}"
        mode: "0755"
      become: true

    - name: provide repository-contract fixtures for installed csharp tests
      copy:
        src: "{{ item.source }}"
        dest: "{{ test_dir }}/csharp/repository-contracts/{{ item.destination }}"
        owner: "{{ fworch_user }}"
        group: "{{ fworch_group }}"
        mode: "0644"
      loop:
        - source: roles/middleware/files/FWO.Middleware.Server/Program.cs
          destination: Program.cs
        - source: roles/api/files/replace_metadata.json
          destination: replace_metadata.json
        - source: roles/database/files/upgrade/9.8.1.sql
          destination: 9.8.1.sql
        - source: roles/database/files/upgrade/9.7.1.sql
          destination: 9.7.1.sql
        - source: roles/database/files/sql/creation/fworch-create-tables-request.sql
          destination: fworch-create-tables-request.sql
      become: true

    # the lib role creates it as well, but the tests also run on their own (tag test)
    - name: create the runtime directory for dotnet commands run as {{ fworch_user }}
      file:
        path: "{{ dotnet_xdg_runtime_dir }}"
        state: directory
        owner: "{{ fworch_user }}"
        group: "{{ fworch_group }}"
        mode: "0700"
      become: true

    - name: run csharp tests
      command: dotnet test
      args:
        chdir: "{{ csharp_test_start_dir }}"
      become: true
      become_user: "{{ fworch_user }}"
      register: csharp_tests
      ignore_errors: false
      environment: "{{ dotnet_env | combine({'FW_SKIP_PDF_TEST': 'true'}) }}"

    - name: show csharp test results in case of errors
      debug:
        var: csharp_tests
      when: csharp_tests.rc != 0

  when: "'frontends' in group_names"
  # run only once (on frontends)

- block:
    - name: Run importer Python unit tests
      environment:
        PYTHONPATH: "/usr/local/fworch/importer"
      args:
        chdir: "/usr/local/fworch/importer"
      command: >
        {{ importer_venv_dir }}/bin/python3 -m pytest -s . -p no:cacheprovider -v
      become: true
      become_user: "{{ fworch_user }}"
      register: pytest_tests
      ignore_errors: false

    - name: show pytest output
      debug:
        var: pytest_tests.stdout_lines

    - name: show pytest errors if any
      debug:
        var: pytest_tests.stderr_lines
      when: pytest_tests.rc != 0
