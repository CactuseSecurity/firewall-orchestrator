# http vhost (optional):
{% if ui_comm_mode == 'standard' -%}
<VirtualHost *:80>
	ServerName {{ ui_server_name }}:80
	ServerAdmin {{ server_admin }}
{% if ui_server_alias | length > 0 %}
	ServerAlias {{ ui_server_alias }}
{% endif %}
	Timeout {{ apache_ui_timeout }}

    RewriteEngine on
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

	ErrorLog /var/log/{{ webserver_package_name }}/error.log
	TransferLog /var/log/{{ webserver_package_name }}/access.log
</VirtualHost>
{%- endif %}

{% if ui_comm_mode == 'allow_http' or ui_comm_mode == 'no_ws_and_allow_http' -%}
<VirtualHost *:80>
	ServerName {{ ui_server_name }}:80
	ServerAdmin {{ server_admin }}
{% if ui_server_alias | length > 0 %}
	ServerAlias {{ ui_server_alias }}
{% endif %}
	Timeout {{ apache_ui_timeout }}

    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:{{ ui_port }}/$1 [P,L]
    RewriteRule /(.*) http://127.0.0.1:{{ ui_port }}/$1 [P,L]

	ErrorLog /var/log/{{ webserver_package_name }}/error.log
	TransferLog /var/log/{{ webserver_package_name }}/access.log
</VirtualHost>
{%- endif %}

# https vhost:
<VirtualHost *:{{ ui_web_port }}>
	ServerName {{ ui_server_name }}:{{ ui_web_port }}
	ServerAdmin {{ server_admin }}
{% if ui_server_alias | length > 0 %}
	ServerAlias {{ ui_server_alias }}
{% endif %}
	Timeout {{ apache_ui_timeout }}

	# the jwt is sent in the "Authorization" header and grows with the permissions of the user,
	# so raise the per-header limit from the 8190 byte default to the kestrel default of 32KB
	LimitRequestFieldSize {{ apache_limit_request_field_size }}

	# rewriting upgrade to websocket
    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:{{ ui_port }}/$1 [P,L]
    RewriteRule /(.*) http://127.0.0.1:{{ ui_port }}/$1 [P,L]

	ErrorLog /var/log/{{ webserver_package_name }}/error.log
	TransferLog /var/log/{{ webserver_package_name }}/access.log
	CustomLog /var/log/{{ webserver_package_name }}/ssl_request_log "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"
	SSLEngine on
	{{ apache_ssl_protocol }}
	{{ apache_ssl_cipher_suite }}
	SSLCertificateFile {{ internalca_apache_certificate }}
	SSLCertificateKeyFile {{ internalca_apache_private_key }}
{% if internalca_apache_intermediate_certificates | length > 0 %}
	SSLCertificateChainFile {{ internalca_apache_intermediate_certificates }}
{% endif %}

    # --- Security Headers ---
<IfModule mod_headers.c>
{% for header in apache_security_headers %}
    {{ header }}
{% endfor %}
</IfModule>

</VirtualHost>
