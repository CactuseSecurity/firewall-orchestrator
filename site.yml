---
# for installation options see https://github.com/CactuseSecurity/firewall-orchestrator/blob/master/documentation/installer/install-advanced.md

- hosts: all
  roles:
    - { role: common }
  tags:
    - backend
    - frontend
    - importer
    - ui
    - api

- hosts: databaseserver
  roles:
    - { role: database, when: "not installation_mode == 'uninstall'" }
  tags:
    - backend

- hosts: middlewareserver
  roles:
    - { role: openldap-server, when: "not installation_mode == 'uninstall'" }
    - { role: lib, when: "not installation_mode == 'uninstall'" }
    - { role: middleware, when: "not installation_mode == 'uninstall'" }
  tags:
    - backend
    - csharp

- hosts: apiserver
  roles:
    - { role: podman, when: "not installation_mode == 'uninstall'" }
  tags:
    - backend
    - api

# do not put this into the same play as podman (runtime needs to be installed first)
- hosts: apiserver 
  roles:
    - { role: api, when: "not installation_mode == 'uninstall'" }
  tags:
    - backend
    - api

- hosts: frontends
  roles:
    - { role: lib, when: "not installation_mode == 'uninstall'"}
    - { role: ui, when: "not installation_mode == 'uninstall'"}
  tags:
    - frontend
    - csharp
    - ui

- hosts: sampleserver
  roles:
    - { role: sample-data, when: "add_demo_data|bool and not installation_mode == 'uninstall'" }
  tags:
    - samples
    - backend
    - importer

- hosts: middlewareserver
  roles:
    - { role: sample-auth-data, when: "add_demo_data|bool and not installation_mode == 'uninstall'" }
  tags:
    - samples
    - backend

- hosts: importers
  roles:
    - { role: importer, when: "not installation_mode == 'uninstall'" }
  tags:
    - frontend
    - importer

- hosts: frontends
  tasks:
    - name: restart ui service to display new version
      service:
        name: "{{ ui_service_name }}"
        state: restarted
      become: true
      when: "not installation_mode == 'uninstall' and (ui_deploy_changed | default(false))"
  tags:
    - frontend
    - ui

- hosts: all
  roles:
    - { role: finalize, when: "not installation_mode == 'uninstall'" }
  tags:
    - finalize
    - backend
    - frontend
    - importer
    - ui

- hosts: all
  roles:
    - { role: tests-unit, when: not installation_mode == 'uninstall' }
  tags:
    - test
    - unittests

- hosts: all
  roles:
    - { role: tests-integration, when: not installation_mode == 'uninstall' }
  tags:
    - test
    - integrationtests

# The importer has to be the last service which is started. An import which is already running
# while one of its dependencies restarts loses its API connection and is rolled back, and every
# play above this one may still restart such a dependency - finalize restarts apache, the
# middleware and the UI, and the integration tests restart the middleware (sample-auth-data) and
# apache (test-auth). So keep this play last and do not start the importer anywhere before it.
- hosts: importers
  tasks:
    # restarted rather than started: every installer run restarts apache unconditionally, so an
    # import which was in flight is lost either way, and only a restart makes sure the importer
    # reconnects to the api and middleware it has just been separated from. the unit is enabled by
    # the importer role, this task only decides when it runs.
    # tagged always on purpose: every way of invoking the playbook restarts one of the importer
    # dependencies somewhere, so the importer has to be restarted afterwards no matter which tags
    # were selected - including "--tags integrationtests", where the tests restart apache and the
    # middleware, and "--skip-tags integrationtests", which must not skip starting the importer
    - name: restart importer service once all of its dependencies are up for good
      ansible.builtin.systemd:
        name: "{{ product_name }}-importer-api"
        state: restarted
        daemon_reload: true
      become: true
      when: "not installation_mode == 'uninstall'"
      tags:
        - always

    # this verifies the state the installation ends in - it cannot fail because of the restart
    # above, but it does fail once anything restarts an importer dependency after that restart
    - name: importer service startup order testing
      import_tasks: roles/tests-integration/tasks/test-importer-service-start-order.yml
      when: "not installation_mode == 'uninstall'"
      tags:
        - test
        - integrationtests
  tags:
    - finalize
    - backend
    - frontend
    - importer
    - ui

- hosts: all
  tasks:
    # display status & pwds
    - name: show listener status
      import_tasks: scripts/show-fworch-listeners.yml
      become: true

    - name: display secrets for this installation
      debug:
        msg:
          - "The initial UI admin password is stored in {{ ui_admin_password_file }}"
          - "The API Hasura admin secret is stored in {{ fworch_secrets_dir }}/hasura_admin_pwd"
      when: |
        admin_password is defined and 
        api_hasura_admin_secret is defined
