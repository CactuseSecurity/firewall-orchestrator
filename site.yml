---
# for installation options see https://github.com/CactuseSecurity/firewall-orchestrator/blob/master/documentation/installer/install-advanced.md

# The host wide, operator owned installer settings (see documentation/installer/
# install-advanced.md). Loaded here rather than only by scripts/run-playbook-with-sudo.sh,
# because the launcher can be bypassed - a plain "ansible-playbook site.yml" then applied
# none of the settings, silently, and installed the endpoints under the inventory names
# instead. include_vars outranks inventory/group_vars and survives into the later plays,
# while extra variables given on the command line still outrank it.
#
# "tags: always" so that a tag limited run - "--tags certificates" above all, which
# reissues the very certificates these names are written into - is configured like a
# full one.
- hosts: all
  gather_facts: false
  vars:
    # The launcher reads the same two locations in the same order. Both are resolved on
    # the controller, because that is where include_vars and --extra-vars read from.
    fwo_effective_install_settings_file: "{{ lookup('env', 'FWORCH_LOCAL_SETTINGS') | default(fwo_install_settings_file, true) }}"
  tasks:
    - name: look for the {{ product_name }} installer settings file
      stat:
        path: "{{ fwo_effective_install_settings_file }}"
      register: fwo_install_settings_stat
      delegate_to: localhost
      run_once: true
      changed_when: false
      tags: always

    - name: apply the {{ product_name }} installer settings
      include_vars:
        file: "{{ fwo_effective_install_settings_file }}"
      when: fwo_install_settings_stat.stat.exists
      tags: always

    # internalca_reset_certificates is imperative: it replaces the CA and every
    # FWO-managed identity, and every browser and external trust store then has to be
    # given the new anchor by hand. Left in the settings file it would do that again on
    # every upgrade, silently. Refused here rather than documented only, because this is
    # the one place that can still tell a persisted setting from an --extra-vars one.
    - name: refuse a persisted certificate reset switch
      assert:
        that:
          - "'internalca_reset_certificates' not in fwo_persisted_install_settings"
        fail_msg: >-
          internalca_reset_certificates is set in {{ fwo_effective_install_settings_file }}.
          It is a one-shot rotation switch, not a setting: keeping it there rotates the
          internal CA on every upgrade and invalidates every trust store that was given
          the previous anchor. Remove it from the file and pass it on the command line for
          the single run that should rotate, with
          -e "installation_mode=upgrade internalca_reset_certificates=true".
      vars:
        fwo_persisted_install_settings: >-
          {{ lookup('file', fwo_effective_install_settings_file) | from_yaml | default({}, true) }}
      when: fwo_install_settings_stat.stat.exists
      delegate_to: localhost
      run_once: true
      tags: always

    - name: report the endpoints the installer settings put in force
      debug:
        msg: >-
          Applied installer settings from {{ fwo_effective_install_settings_file }}
          - api: {{ api_network_listening_ip_address }},
          middleware: {{ middleware_hostname }}, ui: {{ ui_hostname }}
      when: fwo_install_settings_stat.stat.exists
      tags: always
  tags:
    - backend
    - frontend
    - importer
    - ui
    - api
    - certificates

# any_errors_fatal for the same reason as the internalCA play below, and this is the play
# where it matters most: the upgrade source version guard and the Apache private key
# preflight both live here, and a failing host is otherwise merely dropped - so on a
# distributed installation the database play went on to migrate the schema on another host
# after a preflight had just refused the upgrade. The flag only ever fires for a failure
# inside its own play, so a host already unreachable in an earlier play does not abort the
# run for the others.
#
# The cost is deliberate: OS preparation and package installation happen here too, so a
# failure on one host now stops the whole run rather than installing the rest. For an
# installer that is the safer half of the trade - a partially prepared installation is
# what the preflights in this play exist to prevent.
- hosts: all
  any_errors_fatal: true
  roles:
    - { role: common }
  tags:
    - backend
    - frontend
    - importer
    - ui
    - api

# Certificates are created after the common role has created the FWO user and
# configuration directories, but before any service consumes them.
#
# any_errors_fatal because this play is preflight plus certificate issuance, where one
# host failing makes the rest worthless: the retained-certificate checks run on the
# middleware host alone, and without this Ansible would merely drop that host and let the
# database play migrate the schema on another one - so an upgrade the installer had just
# refused would still have changed the installation. It also stops a host from being left
# without an identity while the services that need it are installed on the others.
- hosts: all
  any_errors_fatal: true
  roles:
    - { role: internalCA, when: "not installation_mode == 'uninstall'" }
  tags:
    - backend
    - frontend
    - importer
    - ui
    - api
    - certificates

- hosts: databaseserver
  roles:
    - { role: database, when: "not installation_mode == 'uninstall'" }
  tags:
    - backend

- hosts: middlewareserver
  roles:
    - { role: openldap-server, when: "not installation_mode == 'uninstall'" }
    - { role: lib, when: "not installation_mode == 'uninstall'" }
    - { role: middleware, when: "not installation_mode == 'uninstall'" }
  tags:
    - backend
    - csharp

- hosts: apiserver
  roles:
    - { role: podman, when: "not installation_mode == 'uninstall'" }
  tags:
    - backend
    - api

# do not put this into the same play as podman (runtime needs to be installed first)
- hosts: apiserver 
  roles:
    - { role: api, when: "not installation_mode == 'uninstall'" }
  tags:
    - backend
    - api

- hosts: frontends
  roles:
    - { role: lib, when: "not installation_mode == 'uninstall'"}
    - { role: ui, when: "not installation_mode == 'uninstall'"}
  tags:
    - frontend
    - csharp
    - ui

- hosts: sampleserver
  roles:
    - { role: sample-data, when: "add_demo_data|bool and not installation_mode == 'uninstall'" }
  tags:
    - samples
    - backend
    - importer

- hosts: middlewareserver
  roles:
    - { role: sample-auth-data, when: "add_demo_data|bool and not installation_mode == 'uninstall'" }
  tags:
    - samples
    - backend

- hosts: importers
  roles:
    - { role: importer, when: "not installation_mode == 'uninstall'" }
  tags:
    - frontend
    - importer

- hosts: frontends
  tasks:
    - name: restart ui service to display new version
      service:
        name: "{{ ui_service_name }}"
        state: restarted
      become: true
      when: "not installation_mode == 'uninstall' and (ui_deploy_changed | default(false))"
  tags:
    - frontend
    - ui

- hosts: all
  roles:
    - { role: finalize, when: "not installation_mode == 'uninstall'" }
  tags:
    - finalize
    - backend
    - frontend
    - importer
    - ui

- hosts: all
  roles:
    - { role: tests-unit, when: not installation_mode == 'uninstall' }
  tags:
    - test
    - unittests

- hosts: all
  roles:
    - { role: tests-integration, when: not installation_mode == 'uninstall' }
  tags:
    - test
    - integrationtests

# The importer has to be the last service which is started. An import which is already running
# while one of its dependencies restarts loses its API connection and is rolled back, and every
# play above this one may still restart such a dependency - finalize restarts apache, the
# middleware and the UI, and the integration tests restart the middleware (sample-auth-data) and
# apache (test-auth). So keep this play last and do not start the importer anywhere before it.
# It carries the same tags as the finalize play, so it runs whenever finalize does, after finalize
# has cleared a failed start limit. That covers every tag selection which installs or upgrades the
# stack, but not every one which restarts a dependency: "--tags api" restarts apache and the api,
# and "--tags certificates" restarts the middleware and reloads apache after a renewal (see
# roles/internalCA/tasks/restart-consumers.yml). Neither selects finalize or this play, so the
# importer keeps running across them - and an upgrade limited to "--tags api" leaves it stopped,
# as the common play stops it on every upgrade.
- hosts: importers
  tasks:
    # a host can be listed in the importers group without the importer having been deployed to it
    # in this run, and systemd fails a restart of a unit it does not know
    - name: check for importer service unit
      stat:
        path: "{{ item }}/{{ product_name }}-importer-api.service"
      loop: "{{ fworch_systemd_unit_search_dirs }}"
      register: importer_service_unit
      become: true
      when: "not installation_mode == 'uninstall'"

    # restarted rather than started: every installer run restarts apache unconditionally, so an
    # import which was in flight is lost either way, and only a restart makes sure the importer
    # reconnects to the api and middleware it has just been separated from. the unit is enabled by
    # the importer role, this task only decides when the service runs
    - name: restart importer service once all of its dependencies are up for good
      ansible.builtin.systemd:
        name: "{{ product_name }}-importer-api"
        state: restarted
        daemon_reload: true
      become: true
      register: importer_service_start
      when:
        - "not installation_mode == 'uninstall'"
        - importer_service_unit.results | default([]) | selectattr('stat.exists') | list | length > 0
  tags:
    - finalize
    - backend
    - frontend
    - importer
    - ui

# separate play so that the assertions below carry the test tags only - tags of a play are added
# to every task in it, so a task in the play above could be widened but never narrowed down to
# "test". It is guarded by the restart above having run: a run which only selects the test tags
# does not restart the importer, and the tests it just executed restarted apache and the
# middleware, so the importer is legitimately older than its dependencies there.
- hosts: importers
  tasks:
    - name: importer service startup order testing
      import_tasks: roles/tests-integration/tasks/test-importer-service-start-order.yml
      when:
        - importer_service_start is defined
        - not importer_service_start is skipped
  tags:
    - test
    - integrationtests

- hosts: all
  tasks:
    # display status & pwds
    - name: show listener status
      import_tasks: scripts/show-fworch-listeners.yml
      become: true

    # Read from the world readable copy every host receives, not from the issuer copy on
    # the CA host: the local copy is the file the documentation tells an operator to
    # trust, it is world readable where the issuer copy sits in a root-only directory,
    # and reading it needs no delegation at all. internalca_ca_certificate_local and the
    # anchor file name it is built from are defined in inventory/group_vars/all.yml, so
    # they are in scope in this play - role defaults are not.
    #
    # failed_when: false because this is the closing information display of a completed
    # installation. Everything that depends on the certificate has already run and
    # succeeded by now, so not being able to print it must not turn a good installation
    # into a failed run - it reports that it could not, instead.
    - name: read the internal CA certificate for browser trust setup
      ansible.builtin.slurp:
        src: "{{ internalca_ca_certificate_local }}"
      register: fwo_internal_ca_certificate
      become: true
      run_once: true
      failed_when: false
      when: installation_mode in ['new', 'upgrade']
      tags:
        - backend
        - frontend
        - importer
        - ui
        - api
        - certificates

    # "content is defined" rather than "is not skipped": it is false for a skipped read
    # and for a failed one alike, which is what the two branches here need.
    - name: display the internal CA certificate for browser trust setup
      ansible.builtin.debug:
        msg:
          - "Trust this FWO internal CA certificate on the browser host to accept {{ product_name }} Apache certificates:"
          - (unless you already have a peer certificate configured, in which case the peer CA certificate is the one to trust)
          - "{{ fwo_internal_ca_certificate.content | b64decode }}"
      run_once: true
      when:
        - installation_mode in ['new', 'upgrade']
        - fwo_internal_ca_certificate.content is defined
      tags:
        - backend
        - frontend
        - importer
        - ui
        - api
        - certificates

    - name: report that the internal CA certificate could not be shown
      ansible.builtin.debug:
        msg: >-
          Could not read {{ internalca_ca_certificate_local }}, so the internal CA
          certificate is not printed here. That file is the one to trust on the browser
          host; the installation itself is unaffected.
      run_once: true
      when:
        - installation_mode in ['new', 'upgrade']
        - fwo_internal_ca_certificate.content is not defined
      tags:
        - backend
        - frontend
        - importer
        - ui
        - api
        - certificates

    - name: display secrets for this installation
      debug:
        msg:
          - "The initial UI admin password is stored in {{ ui_admin_password_file }}"
          - "The API Hasura admin secret is stored in {{ fworch_secrets_dir }}/hasura_admin_pwd"
      when: |
        admin_password is defined and 
        api_hasura_admin_secret is defined
