---
# for installation options see https://github.com/CactuseSecurity/firewall-orchestrator/blob/master/documentation/installer/install-advanced.md

# The host wide, operator owned installer settings (see documentation/installer/
# install-advanced.md). Loaded here rather than only by scripts/run-playbook-with-sudo.sh,
# because the launcher can be bypassed - a plain "ansible-playbook site.yml" then applied
# none of the settings, silently, and installed the endpoints under the inventory names
# instead. include_vars outranks inventory/group_vars and survives into the later plays,
# while extra variables given on the command line still outrank it.
#
# "tags: always" so that a tag limited run - "--tags certificates" above all, which
# reissues the very certificates these names are written into - is configured like a
# full one.
- hosts: all
  gather_facts: false
  vars:
    # The launcher reads the same two locations in the same order. Both are resolved on
    # the controller, because that is where include_vars and --extra-vars read from.
    fwo_effective_install_settings_file: "{{ lookup('env', 'FWORCH_LOCAL_SETTINGS') | default(fwo_install_settings_file, true) }}"
  tasks:
    - name: look for the {{ product_name }} installer settings file
      stat:
        path: "{{ fwo_effective_install_settings_file }}"
      register: fwo_install_settings_stat
      delegate_to: localhost
      run_once: true
      changed_when: false
      tags: always

    - name: apply the {{ product_name }} installer settings
      include_vars:
        file: "{{ fwo_effective_install_settings_file }}"
      when: fwo_install_settings_stat.stat.exists
      tags: always

    - name: report the endpoints the installer settings put in force
      debug:
        msg: >-
          Applied installer settings from {{ fwo_effective_install_settings_file }}
          - api: {{ api_network_listening_ip_address }},
          middleware: {{ middleware_hostname }}, ui: {{ ui_hostname }}
      when: fwo_install_settings_stat.stat.exists
      tags: always
  tags:
    - backend
    - frontend
    - importer
    - ui
    - api
    - certificates

# any_errors_fatal for the same reason as the internalCA play below, and this is the play
# where it matters most: the upgrade source version guard and the Apache private key
# preflight both live here, and a failing host is otherwise merely dropped - so on a
# distributed installation the database play went on to migrate the schema on another host
# after a preflight had just refused the upgrade. The flag only ever fires for a failure
# inside its own play, so a host already unreachable in an earlier play does not abort the
# run for the others.
#
# The cost is deliberate: OS preparation and package installation happen here too, so a
# failure on one host now stops the whole run rather than installing the rest. For an
# installer that is the safer half of the trade - a partially prepared installation is
# what the preflights in this play exist to prevent.
- hosts: all
  any_errors_fatal: true
  roles:
    - { role: common }
  tags:
    - backend
    - frontend
    - importer
    - ui
    - api

# Certificates are created after the common role has created the FWO user and
# configuration directories, but before any service consumes them.
#
# any_errors_fatal because this play is preflight plus certificate issuance, where one
# host failing makes the rest worthless: the retained-certificate checks run on the
# middleware host alone, and without this Ansible would merely drop that host and let the
# database play migrate the schema on another one - so an upgrade the installer had just
# refused would still have changed the installation. It also stops a host from being left
# without an identity while the services that need it are installed on the others.
- hosts: all
  any_errors_fatal: true
  roles:
    - { role: internalCA, when: "not installation_mode == 'uninstall'" }
  tags:
    - backend
    - frontend
    - importer
    - ui
    - api
    - certificates

- hosts: databaseserver
  roles:
    - { role: database, when: "not installation_mode == 'uninstall'" }
  tags:
    - backend

- hosts: middlewareserver
  roles:
    - { role: openldap-server, when: "not installation_mode == 'uninstall'" }
    - { role: lib, when: "not installation_mode == 'uninstall'" }
    - { role: middleware, when: "not installation_mode == 'uninstall'" }
  tags:
    - backend
    - csharp

- hosts: apiserver
  roles:
    - { role: podman, when: "not installation_mode == 'uninstall'" }
  tags:
    - backend
    - api

# do not put this into the same play as podman (runtime needs to be installed first)
- hosts: apiserver 
  roles:
    - { role: api, when: "not installation_mode == 'uninstall'" }
  tags:
    - backend
    - api

- hosts: frontends
  roles:
    - { role: lib, when: "not installation_mode == 'uninstall'"}
    - { role: ui, when: "not installation_mode == 'uninstall'"}
  tags:
    - frontend
    - csharp
    - ui

- hosts: sampleserver
  roles:
    - { role: sample-data, when: "add_demo_data|bool and not installation_mode == 'uninstall'" }
  tags:
    - samples
    - backend
    - importer

- hosts: middlewareserver
  roles:
    - { role: sample-auth-data, when: "add_demo_data|bool and not installation_mode == 'uninstall'" }
  tags:
    - samples
    - backend

- hosts: importers
  roles:
    - { role: importer, when: "not installation_mode == 'uninstall'" }
  tags:
    - frontend
    - importer

- hosts: frontends
  tasks:
    - name: restart ui service to display new version
      service:
        name: "{{ ui_service_name }}"
        state: restarted
      become: true
      when: "not installation_mode == 'uninstall' and (ui_deploy_changed | default(false))"
  tags:
    - frontend
    - ui

- hosts: all
  roles:
    - { role: finalize, when: "not installation_mode == 'uninstall'" }
  tags:
    - finalize
    - backend
    - frontend
    - importer
    - ui

- hosts: all
  roles:
    - { role: tests-unit, when: not installation_mode == 'uninstall' }
  tags:
    - test
    - unittests

- hosts: all
  roles:
    - { role: tests-integration, when: not installation_mode == 'uninstall' }
  tags:
    - test
    - integrationtests

- hosts: all
  tasks:
    # display status & pwds
    - name: show listener status
      import_tasks: scripts/show-fworch-listeners.yml
      become: true

    - name: read the internal CA certificate for browser trust setup
      ansible.builtin.slurp:
        src: "{{ internalca_ca_certificate_local }}"
      register: fwo_internal_ca_certificate
      delegate_to: "{{ internalca_ca_host }}"
      run_once: true
      when: installation_mode in ['new', 'upgrade']

    - name: display the internal CA certificate for browser trust setup
      ansible.builtin.debug:
        msg:
          - "Trust this FWO internal CA certificate on the browser host to accept {{ product_name }} Apache certificates:"
          - (unless you already have a peer certificate configured, in which case the peer CA certificate is the one to trust)
          - "{{ fwo_internal_ca_certificate.content | b64decode }}"
      run_once: true
      when:
        - installation_mode in ['new', 'upgrade']
        - fwo_internal_ca_certificate is not skipped

    - name: display secrets for this installation
      debug:
        msg:
          - "The initial UI admin password is stored in {{ ui_admin_password_file }}"
          - "The API Hasura admin secret is stored in {{ fworch_secrets_dir }}/hasura_admin_pwd"
      when: |
        admin_password is defined and 
        api_hasura_admin_secret is defined
